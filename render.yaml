{
  "services": [
    {
      "type": "web",
      "runtime": "static",
      "name": "sunny-cow-picking-preview-20261029",
      "repo": "https://github.com/pederaus9-ux/Bugsy",
      "branch": "codex/phone-preview-20261029",
      "autoDeployTrigger": "off",
      "buildCommand": "node verify-dist.cjs",
      "staticPublishPath": "./dist",
      "headers": [
        {
          "path": "/*",
          "name": "Content-Security-Policy",
          "value": "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'none'; media-src 'none'; worker-src 'none'; child-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'; frame-ancestors 'none'"
        },
        {
          "path": "/*",
          "name": "Referrer-Policy",
          "value": "no-referrer"
        },
        {
          "path": "/*",
          "name": "X-Content-Type-Options",
          "value": "nosniff"
        },
        {
          "path": "/*",
          "name": "Cache-Control",
          "value": "no-store"
        },
        {
          "path": "/*",
          "name": "Permissions-Policy",
          "value": "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        }
      ]
    }
  ]
}