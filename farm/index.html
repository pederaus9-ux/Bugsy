function drawStand() {
  const b = boxOf("stand"), t = now();
  const [A, B, C, D] = corners(b.gx + .25, b.gy + .55, b.w - .5, b.h - .8);
  const ol = "rgba(70,35,10,.45)", H = 15;
  fillPoly([iso(b.gx + .2, b.gy + .5), iso(b.gx + b.w - .1, b.gy + .5), iso(b.gx + b.w - .1, b.gy + b.h), iso(b.gx + .2, b.gy + b.h)], "rgba(0,0,0,.12)");
  const post = (p) => { ctx.fillStyle = "#7A4B25"; ctx.fillRect(p[0] - 2, p[1] - 48, 4, 48); };
  post(A); post(B); post(D);
  // counter
  fillPoly([D, C, up(C, H), up(D, H)], "#C98B4A", ol);
  fillPoly([C, B, up(B, H), up(C, H)], "#A86F38", ol);
  fillPoly([up(A, H), up(B, H), up(C, H), up(D, H)], "#E0A865", ol);
  ctx.strokeStyle = "rgba(70,35,10,.25)"; ctx.lineWidth = 1.5; ctx.beginPath();
  for (const k of [.33, .66]) { const p = lerp(up(D, H * k), up(C, H * k), 0), q = up(C, H * k); ctx.moveTo(...p); ctx.lineTo(...q); }
  ctx.stroke();
  // goods on the counter
  const shown = S.stand.list.filter(Boolean).slice(0, 4);
  shown.forEach((L, j) => {
    const pt = up(lerp(lerp(A, D, .5), lerp(B, C, .5), (j + .5) / 4), H + 7);
    drawEmoji(L.sellAt <= t ? "💰" : ITEMS[L.id].e, pt[0], pt[1], 15);
  });
  post(C);
  // striped awning
  const aw = (p, h) => up(p, h), n = 6;
  for (let k = 0; k < n; k++) {
    const f0 = lerp(D, C, k / n), f1 = lerp(D, C, (k + 1) / n), b0 = lerp(A, B, k / n), b1 = lerp(A, B, (k + 1) / n);
    fillPoly([aw(b0, 58), aw(b1, 58), aw(f1, 46), aw(f0, 46)], k % 2 ? "#fff" : "#E8513C", "rgba(120,30,20,.3)", 1);
  }
  for (let k = 0; k < n; k++) {
    const m = up(lerp(D, C, (k + .5) / n), 46);
    ctx.beginPath(); ctx.arc(m[0], m[1], 5, 0, Math.PI); ctx.fillStyle = k % 2 ? "#fff" : "#E8513C"; ctx.fill();
  }
  const sideA = up(lerp(B, C, 0), 58), sideB = up(C, 46);
  fillPoly([sideA, sideB, up(sideB, -3), up(sideA, -3)], "#B8331F");
  const sold = S.stand.list.some(L => L && L.sellAt <= t);
  const top = up(lerp(A, C, .5), 76);
  if (sold) { const by = top[1] + bob(1.3, 3); circle(top[0], by, 16, "rgba(255,255,255,.95)"); ctx.strokeStyle = "#6CC04A"; ctx.lineWidth = 3; ctx.stroke(); drawEmoji("💰", top[0], by, 20); }
  nextHits.push({type:"stand", rect:[D[0] - 6, top[1] - 16, B[0] + 6, C[1] + 6], mv:"stand"});
}

function drawWalker(w) {
  const {gx, gy} = walkerPos(w);
  if (gx < 0 || gx > MAP_W) return;
  const [x, y] = iso(gx, gy);
  ellipse(x, y, 8, 3, "rgba(0,0,0,.15)");
  drawEmoji(w.e, x, y - 12 - Math.abs(Math.sin(T / 160 + w.off)) * 2, 24, w.dir > 0);
}

function drawFx() {
  const tn = performance.now();
  for (let j = fx.length - 1; j >= 0; j--) {
    const f = fx[j], age = tn - f.t0;
    if (age > 1300) { fx.splice(j, 1); continue; }
    const [x, y] = iso(f.gx, f.gy), yy = y - 40 - age * .045;
    ctx.globalAlpha = age > 900 ? 1 - (age - 900) / 400 : 1;
    const sc = age < 120 ? age / 120 : 1;
    label(f.txt, x - 10, yy, 20 * sc);
    drawEmoji(f.e, x + 14 + f.txt.length * 3, yy, 20);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#6EC3E6"; ctx.fillRect(0, 0, W, H);
  // gentle water ripples around the island
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
  for (let k = 0; k < 14; k++) {
    const x = ((k * 173 + T / 60) % (W + 80)) - 40, y = (k * 97) % H;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8, y - 4, x + 16, y); ctx.stroke();
  }
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, dpr * (W / 2 - cam.x * zoom), dpr * (H / 2 - cam.y * zoom));
  nextHits = [];
  const boxes = allBoxes();
  drawGround();
  S.plots.forEach((_, i) => drawField(i));
  const spot = nextPlotSpot(boxes);
  if (move) { // green = fits here, red = something's in the way
    const b = move.box;
    fillPoly(corners(b.gx, b.gy, b.w, b.h), move.valid ? "rgba(120,240,110,.5)" : "rgba(255,90,70,.5)", "#fff", 2);
  }

  // everything that stands up gets sorted back-to-front
  const objs = [];
  const depth = (b) => b.gx + b.w + b.gy + b.h;
  const house = boxOf("house"), barn = boxOf("barn"), gift = giftPos();
  objs.push({d:depth(house), f:() => nextHits.push({type:"house", rect:drawHouse(house, STYLE.house).rect, mv:"house"})});
  objs.push({d:depth(barn), f:() => nextHits.push({type:"barn", rect:drawHouse(barn, STYLE.barn).rect, mv:"barn"})});
  objs.push({d:depth(boxOf("stand")), f:drawStand});
  objs.push({d:depth(LAYOUT.board), f:drawBoard});
  objs.push({d:LAYOUT.truck.gx + LAYOUT.truck.gy + 1, f:drawTruck});
  objs.push({d:gift.gx + gift.gy, f:drawGift});
  if (spot) objs.push({d:spot.gx + spot.gy + 1, f:() => drawSaleSign(spot)});
  S.plots.forEach((p, i) => { if (p.crop) objs.push({d:p.gx + p.gy + 1.5, f:() => drawCrops(i)}); });
  for (const bid of Object.keys(BUILDINGS)) objs.push({d:depth(boxOf("b:" + bid)), f:() => drawBuilding(bid)});
  for (const k of Object.keys(ANIMALS)) objs.push({d:depth(boxOf("p:" + k)), f:() => drawPen(k)});
  for (const w of WALKERS) { const p = walkerPos(w); objs.push({d:p.gx + p.gy, f:() => drawWalker(w)}); }
  const covered = (tr) => boxes.some(([, b]) => tr.gx >= b.gx - .2 && tr.gx < b.gx + b.w + .2 && tr.gy >= b.gy - .2 && tr.gy < b.gy + b.h + .2);
  for (const tr of SCENE.trees) if (!covered(tr)) objs.push({d:tr.gx + tr.gy, f:() => drawTree(tr)});
  objs.sort((a, b) => a.d - b.d).forEach(o => o.f());
  if (move) { // outline on top too, so it shows even under a tall building
    const b = move.box; path(corners(b.gx, b.gy, b.w, b.h));
    ctx.setLineDash([8, 6]); ctx.strokeStyle = move.valid ? "#3E8E24" : "#D8412A"; ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]);
  }
  drawFx();
  hits = nextHits;
}

let lastFrame = performance.now();
function frame(tn) {
  const dt = Math.min(0.1, (tn - lastFrame) / 1000); lastFrame = tn; T = tn;
  if (camAnim) {
    const k = Math.min(1, (tn - camAnim.t0) / 550), e = 1 - Math.pow(1 - k, 3);
    cam.x = camAnim.fx + (camAnim.tx - camAnim.fx) * e; cam.y = camAnim.fy + (camAnim.ty - camAnim.fy) * e;
    if (k >= 1) camAnim = null;
  }
  if (move && move.sx != null) {
    const m = 50, sp = 420 * dt / zoom;
    const dx = move.sx < m ? -sp : move.sx > W - m ? sp : 0, dy = move.sy < m + 60 ? -sp : move.sy > H - m ? sp : 0;
    if (dx || dy) { cam.x += dx; cam.y += dy; clampCam(); dragMoveTo(move.sx, move.sy); }
  }
  updateAnimals(dt);
  draw();
  requestAnimationFrame(frame);
}

/* ============================================================
   TOUCH: pan, pinch, tap, and drag tools (seeds, sickle, feed)
   ============================================================ */
const ptrs = new Map();
let gesture = null;
const screenToTile = (sx, sy) => { const [x, y] = toWorld(sx, sy); return [x / TW + y / TH, y / TH - x / TW]; };
cv.addEventListener("pointerdown", (e) => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  camAnim = null;
  if (ptrs.size === 1) {
    gesture = {mode:"tap", sx:e.clientX, sy:e.clientY, cx:cam.x, cy:cam.y};
    // press and hold on something to pick it up and move it
    const h = hitAt(e.clientX, e.clientY);
    if (h && h.mv) gesture.lp = setTimeout(() => startMove(h.mv, gesture.lx ?? e.clientX, gesture.ly ?? e.clientY), 450);
  } else if (ptrs.size === 2) {
    if (gesture) clearTimeout(gesture.lp);
    if (move) cancelMove();
    const [p, q] = [...ptrs.values()];
    gesture = {mode:"pinch", d:Math.hypot(p.x - q.x, p.y - q.y), z:zoom};
    closeTray();
  }
});
cv.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId) || !gesture) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  gesture.lx = e.clientX; gesture.ly = e.clientY;
  if (gesture.mode === "tap" && Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > 8) { gesture.mode = "pan"; clearTimeout(gesture.lp); closeTray(); }
  if (gesture.mode === "move") dragMoveTo(e.clientX, e.clientY);
  else if (gesture.mode === "pan") {
    cam.x = gesture.cx - (e.clientX - gesture.sx) / zoom;
    cam.y = gesture.cy - (e.clientY - gesture.sy) / zoom;
    clampCam();
  } else if (gesture.mode === "pinch" && ptrs.size === 2) {
    const [p, q] = [...ptrs.values()];
    setZoom(gesture.z * Math.hypot(p.x - q.x, p.y - q.y) / gesture.d, (p.x + q.x) / 2, (p.y + q.y) / 2);
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gesture) clearTimeout(gesture.lp);
  if (gesture && gesture.mode === "move") endMove(e.type === "pointerup");
  else if (gesture && gesture.mode === "tap" && e.type === "pointerup" && ptrs.size === 0) onTap(e.clientX, e.clientY);
  if (ptrs.size === 1 && gesture && gesture.mode === "pinch") {
    const [p] = [...ptrs.values()];
    gesture = {mode:"pan", sx:p.x, sy:p.y, cx:cam.x, cy:cam.y};
  }
  if (!ptrs.size) gesture = null;
}
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("wheel", (e) => { e.preventDefault(); closeTray(); setZoom(zoom * Math.pow(0.999, e.deltaY), e.clientX, e.clientY); }, {passive:false});

function startMove(key, sx, sy) {
  if (!gesture || gesture.mode !== "tap") return;
  gesture.mode = "move";
  const b = boxOf(key), [tx, ty] = screenToTile(sx, sy);
  move = {key, orig:{...b}, box:{...b}, grab:[tx - b.gx, ty - b.gy], valid:true, sx, sy};
  closeTray(); sfx("pickup");
  if (navigator.vibrate) navigator.vibrate(15);
  $("#moveHint").hidden = false;
}
function dragMoveTo(sx, sy) {
  if (!move) return;
  move.sx = sx; move.sy = sy;
  const [tx, ty] = screenToTile(sx, sy);
  const gx = Math.round(tx - move.grab[0]), gy = Math.round(ty - move.grab[1]);
  if (gx === move.box.gx && gy === move.box.gy) return;
  move.box = {...move.box, gx, gy};
  move.valid = canPlace(move.key, move.box);
  sfx("tick");
}
function endMove(place) {
  const m = move; move = null;
  $("#moveHint").hidden = true;
  if (!m) return;
  const changed = m.box.gx !== m.orig.gx || m.box.gy !== m.orig.gy;
  if (place && m.valid && changed) {
    if (m.key.startsWith("f:")) Object.assign(S.plots[+m.key.slice(2)], {gx:m.box.gx, gy:m.box.gy});
    else S.pos[m.key] = {gx:m.box.gx, gy:m.box.gy};
    sfx("place"); save();
  } else if (changed) { sfx("error"); toast("Can't put it there. Something's in the way."); }
}
function cancelMove() { move = null; $("#moveHint").hidden = true; }

function onTap(sx, sy) {
  closeTray();
  const h = hitAt(sx, sy);
  if (!h) return;
  const t = now();
  switch (h.type) {
    case "field": {
      const p = S.plots[h.i];
      if (!p.crop) seedTray(h.i, sx, sy);
      else if (p.end <= t) sickleTray(sx, sy);
      else growTray(h.i, sx, sy);
      break;
    }
    case "sale":
      openTray(`<div class="tray-title">New field</div><div class="tray-sub">More fields, bigger harvests</div>
        <div class="row"><button class="btn gold" data-act="plot+">Buy · ${plotCost()} 🪙</button></div>`, sx, sy);
      break;
    case "building":
      if (!collectJobs(h.bid)) openPanel("building", h.bid);
      break;
    case "stand":
      if (!standCollectAll()) openPanel("stand");
      break;
    case "lot": {
      const b = BUILDINGS[h.bid];
      openTray(`<div class="tray-title">${b.e} ${b.n}</div><div class="tray-sub">Makes ${b.recipes.map(r => ITEMS[r].e).join(" ")}</div>
        <div class="row">${S.level >= b.lvl ? `<button class="btn gold" data-act="building" data-k="${h.bid}">Build · ${b.cost} 🪙</button>` : `<span class="tray-sub">🔒 Unlocks at level ${b.lvl}</span>`}</div>`, sx, sy);
      break;
    }
    case "penLot": {
      const a = ANIMALS[h.k];
      openTray(`<div class="tray-title">${a.e} ${a.pen}</div><div class="tray-sub">Raise ${a.n.toLowerCase()}s for ${ITEMS[a.out].e} ${ITEMS[a.out].n.toLowerCase()}</div>
        <div class="row">${S.level >= a.lvl ? `<button class="btn gold" data-act="pen" data-k="${h.k}">Build · ${a.penCost} 🪙</button>` : `<span class="tray-sub">🔒 Unlocks at level ${a.lvl}</span>`}</div>`, sx, sy);
      break;
    }
    case "animal": {
      const end = S.pens[h.k].list[h.i];
      if (end && end <= t) { collectAll(h.k); break; }
      sfx(h.k);
      if (end === 0) { penTray(h.k, sx, sy); break; }
      tapAnimal(h.k, h.i);
      break;
    }
    case "pen":
      if (!collectAll(h.k)) penTray(h.k, sx, sy);
      break;
    case "orders": sfx("truck"); openPanel("orders"); break;
    case "barn": openPanel("barn"); break;
    case "house": openPanel("farm"); break;
    case "gift": claimDaily(); break;
  }
}

// --- trays ---
let tray = null;
function openTray(html, sx, sy, extra) {
  closeTray();
  const el = document.createElement("div");
  el.className = "tray"; el.innerHTML = html;
  document.body.appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  let top = sy - h - 30;
  if (top < 80) top = sy + 30;
  el.style.left = clamp(sx - w / 2, 8, W - w - 8) + "px";
  el.style.top = clamp(top, 8, H - h - 8) + "px";
  tray = Object.assign({el}, extra);
  sfx("pop");
}
function closeTray() { if (tray) { tray.el.remove(); tray = null; } }

const SICKLE = `<svg viewBox="0 0 48 48" width="38" height="38" style="pointer-events:none"><path d="M12 40 L22 28" stroke="#8B5A2B" stroke-width="7" stroke-linecap="round"/><path d="M19 31 C 6 16, 22 0, 44 8 C 28 7, 19 16, 24 28 Z" fill="#E3E9EE" stroke="#6B7C8A" stroke-width="2.5" stroke-linejoin="round"/></svg>`;

function seedTray(i, sx, sy) {
  const tools = Object.entries(CROPS).filter(([id]) => ITEMS[id].lvl <= S.level).map(([id, c]) =>
    `<div class="tool" data-tool="seed" data-c="${id}" title="${ITEMS[id].n}"><span class="e">${ITEMS[id].e}</span><span class="n">${have(id) ? have(id) : c.seed + "🪙"}</span></div>`).join("");
  openTray(`<div class="tray-title">Plant</div><div class="tools">${tools}</div><div class="tray-hint">Drag a seed across empty fields</div>`, sx, sy, {i});
}
function sickleTray(sx, sy) {
  openTray(`<div class="tools"><div class="tool" data-tool="sickle"><span class="e">${SICKLE}</span></div></div><div class="tray-hint">Swipe the sickle over ripe crops</div>`, sx, sy);
}
function growTray(i, sx, sy) {
  const p = S.plots[i], it = ITEMS[p.crop];
  const body = () => `<div class="tray-title">${it.e} ${it.n}</div><div class="tray-sub">${STAGE_NAMES[growStage(1 - (p.end - now()) / (CROPS[p.crop].time * 1000))]} · ready in ${fmt(p.end - now())}</div>
    <div class="row"><button class="btn blue sm" data-act="speedPlot" data-i="${i}">Finish now · ${gemCost(p.end - now())} 💎</button></div>`;
  openTray(`<div id="trayBody">${body()}</div>`, sx, sy, {update:() => {
    if (!p.crop || p.end <= now()) return closeTray();
    const tb = $("#trayBody"); if (tb) tb.innerHTML = body();
  }});
}
function penTray(k, sx, sy) {
  const a = ANIMALS[k], pen = S.pens[k];
  const hungry = pen.list.filter(e => e === 0).length;
  openTray(`<div class="tray-title">${a.e} ${a.pen}</div>
    ${hungry ? `<div class="tools"><div class="tool" data-tool="feed" data-k="${k}"><span class="e">${ITEMS[a.feed].e}</span><span class="n">${have(a.feed)}</span></div></div>
      <div class="tray-hint">${have(a.feed) ? "Drag feed onto hungry animals, or tap to feed all" : "Make " + ITEMS[a.feed].n.toLowerCase() + " at the Feed Mill"}</div>`
      : `<div class="tray-sub">Everyone is busy making ${ITEMS[a.out].e}</div>`}
    ${pen.list.length < a.max ? `<div class="row"><button class="btn gold sm" data-act="animal" data-k="${k}">Buy ${a.e} · ${a.cost} 🪙</button></div>` : ""}`, sx, sy);
}

// --- dragging a tool out of the tray ---
let drag = null, ghost = null, pendingLevel = null;
document.addEventListener("pointerdown", (e) => {
  const tl = e.target.closest(".tool");
  if (!tl || !tray) return;
  e.preventDefault();
  drag = {tool:tl.dataset.tool, crop:tl.dataset.c, k:tl.dataset.k, sx:e.clientX, sy:e.clientY, id:e.pointerId, moved:false, n:0, warned:false, html:tl.querySelector(".e").innerHTML};
});
window.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) {
    drag.moved = true;
    tray.el.style.visibility = "hidden";
    ghost = document.createElement("div"); ghost.className = "ghost"; ghost.innerHTML = drag.html;
    document.body.appendChild(ghost);
  }
  if (!drag.moved) return;
  ghost.style.left = e.clientX - 35 + "px"; ghost.style.top = e.clientY - 80 + "px";
  // check a few points along the finger's path so fast swipes don't skip fields
  const last = drag.last || [e.clientX, e.clientY];
  for (let k = 1; k <= 4; k++) applyTool(last[0] + (e.clientX - last[0]) * k / 4, last[1] + (e.clientY - last[1]) * k / 4);
  drag.last = [e.clientX, e.clientY];
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (ghost) { ghost.remove(); ghost = null; }
  if (!d.moved && e.type === "pointerup") {
    if (d.tool === "seed" && tray && tray.i != null) { if (plant(tray.i, d.crop)) closeTray(); }
    else if (d.tool === "sickle") { closeTray(); harvestAll(); }
    else if (d.tool === "feed") { closeTray(); feedAll(d.k); }
  } else closeTray();
  commit();
  if (pendingLevel) { const p = pendingLevel; pendingLevel = null; showLevelUp(p.lvl, p.unlocked); }
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

function applyTool(sx, sy) {
  const h = hitAt(sx, sy);
  if (!h) return;
  if (drag.tool === "seed" && h.type === "field" && !S.plots[h.i].crop) {
    if (plant(h.i, drag.crop, true)) drag.n++;
    else if (!drag.warned) { drag.warned = true; toast("Out of coins for " + ITEMS[drag.crop].n.toLowerCase() + " seeds"); }
  } else if (drag.tool === "sickle" && h.type === "field") {
    const p = S.plots[h.i];
    if (p.crop && p.end <= now() && !harvest(h.i, true) && !drag.warned) { drag.warned = true; barnFull(); }
  } else if (drag.tool === "feed" && (h.type === "animal") && h.k === drag.k) {
    if (S.pens[h.k].list[h.i] === 0 && !feedOne(h.k, h.i) && !drag.warned) { drag.warned = true; toast("Out of " + ITEMS[ANIMALS[h.k].feed].n.toLowerCase()); }
  }
  renderHud();
}

/* ============================================================
   HUD, PANELS, TOASTS
   ============================================================ */
function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 2400);
  while ($("#toasts").children.length > 3) $("#toasts").firstChild.remove();
}
function barnFull() { toast("📦 Barn is full! Sell items or upgrade it."); sfx("error"); }

function commit() { save(); renderHud(); if (panel) renderPanel(); }

function renderHud() {
  $("#lvl").textContent = S.level;
  const need = xpNeed(S.level);
  $("#xpTxt").textContent = S.xp + "/" + need;
  $("#xpBar").style.width = Math.min(100, (S.xp / need) * 100) + "%";
  $("#coins").textContent = S.coins.toLocaleString();
  $("#gems").textContent = S.gems;
  const badge = (sel, n) => {
    const btn = document.querySelector(sel);
    let d = btn.querySelector(".badge");
    if (n) { if (!d) { d = document.createElement("span"); d.className = "badge"; btn.appendChild(d); } d.textContent = n; }
    else if (d) d.remove();
  };
  badge('[data-p="orders"]', S.orders.filter(o => !o.wait && hasAll(o.items)).length);
  badge('[data-p="barn"]', space() <= 0 ? "!" : 0);
}

const timer = (end) => `<span data-end="${end}">${fmt(end - now())}</span>`;
const needList = (req) => Object.entries(req).map(([id, n]) =>
  `<span class="${have(id) < n ? "short" : ""}">${ITEMS[id].e} ${have(id)}/${n}</span>`).join("");

let panel = null, lastPanelSig = "", selItem = null;
function openPanel(type, arg) { closeTray(); if (!panel) sfx("pop"); panel = {type, arg}; renderPanel(); }
function closePanel() { panel = null; standUI = null; $("#panelRoot").innerHTML = ""; }

function panelBuilding(bid) {
  const b = BUILDINGS[bid], st = S.buildings[bid], t = now();
  const running = st.jobs.find(j => j.end > t), done = st.jobs.filter(j => j.end <= t).length;
  let h = `<div class="queue">` + st.jobs.map(j => j.end <= t
      ? `<div class="qslot slot done"><span class="e">${ITEMS[j.r].e}</span>Ready!</div>`
      : `<div class="qslot slot ${j === running ? "" : "wait"}"><span class="e">${ITEMS[j.r].e}</span>${j === running ? timer(j.end) : "Next"}</div>`).join("") +
    Array.from({length:QUEUE_SLOTS - st.jobs.length}, () => `<div class="qslot empty">Empty</div>`).join("") + `</div>`;
  h += `<div class="qbtns">${done ? `<button class="btn" data-act="collectJobs" data-b="${bid}">Collect ${done}</button>` : ""}
    ${running ? `<button class="btn blue" data-act="speedJob" data-b="${bid}">Finish now · ${gemCost(running.end - t)} 💎</button>` : ""}</div>`;
  h += `<h4>Recipes</h4><div class="recipes">` + b.recipes.map(rid => {
    const r = RECIPES[rid], it = ITEMS[rid];
    if (it.lvl > S.level) return `<div class="rcard slot locked"><span class="e">🔒</span><div class="mid"><b>${it.n}</b><small>Unlocks at level ${it.lvl}</small></div></div>`;
    const ok = hasAll(r.in) && st.jobs.length < QUEUE_SLOTS;
    return `<div class="rcard slot"><span class="e">${it.e}</span><div class="mid"><b>${r.out > 1 ? r.out + "× " : ""}${it.n}</b><small>⏱ ${fmt(r.time * 1000)} · +${r.xp}⭐</small>
      <div class="need">${needList(r.in)}</div></div><button class="btn sm" data-act="make" data-b="${bid}" data-r="${rid}" ${ok ? "" : "disabled"}>Make</button></div>`;
  }).join("") + `</div>`;
  return {title:b.n, body:h};
}

function panelOrders() {
  let h = `<div class="orders">` + S.orders.map((o, i) => {
    if (o.wait) return `<div class="note waiting"><div><div class="e">🚚</div>New order in<br>${timer(o.wait)}</div></div>`;
    const can = hasAll(o.items);
    return `<div class="note ${can ? "can" : ""}"><div class="items">` +
      Object.entries(o.items).map(([id, n]) => `<span class="oi ${have(id) < n ? "short" : "ok"}" title="${ITEMS[id].n}"><span class="e">${ITEMS[id].e}</span>${have(id)}/${n}</span>`).join("") +
      `</div><div class="reward"><span>🪙 ${o.coins}</span><span>⭐ ${o.xp}</span>${o.gem ? `<span>💎 ${o.gem}</span>` : ""}</div>
      <div class="foot"><button class="btn sm" data-act="deliver" data-i="${i}" ${can ? "" : "disabled"}>Deliver</button>
      <button class="btn plain sm" data-act="discard" data-i="${i}" aria-label="Remove order">🗑️</button></div></div>`;
  }).join("") + `</div><p class="center muted" style="font-weight:800;margin:14px 0 0">Orders pay more than selling. Every 10th order gives a bonus 💎.</p>`;
  return {title:"Truck Orders", body:h};
}

function panelBarn() {
  const used = barnUsed(), ids = Object.keys(ITEMS).filter(id => have(id) > 0);
  if (selItem && !have(selItem)) selItem = null;
  let h = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <b style="font-family:var(--fun);font-weight:400;font-size:18px">${used} / ${S.barnCap}</b>
    <button class="btn gold sm" data-act="barnUp">Upgrade +25 · ${barnCost()} 🪙</button></div>
    <div class="cap ${used >= S.barnCap ? "full" : ""}"><i style="width:${Math.min(100, used / S.barnCap * 100)}%"></i></div>`;
  if (!ids.length) return {title:"Barn", body:h + `<p class="center muted" style="font-weight:800">Your barn is empty. Go harvest something!</p>`};
  h += `<div class="inv">` + ids.map(id => `<button class="islot slot ${selItem === id ? "sel" : ""}" data-act="selItem" data-id="${id}" title="${ITEMS[id].n}"><span class="e">${ITEMS[id].e}</span><span class="q out">${have(id)}</span></button>`).join("") + `</div>`;
  if (selItem) {

  } else h += `<p class="center muted" style="font-weight:800;margin:12px 0 0">Tap an item to sell it</p>`;

}

let standUI = null; // {slot, id, qty, price} while choosing what to sell
function panelStand() {
  const t = now();
  if (standUI) {
    const ids = Object.keys(ITEMS).filter(id => have(id) > 0);
    let h = `<h4>What do you want to sell?</h4>`;
    h += ids.length ? `<div class="inv">` + ids.map(id => `<button class="islot slot ${standUI.id === id ? "sel" : ""}" data-act="standItem" data-id="${id}" title="${ITEMS[id].n}"><span class="e">${ITEMS[id].e}</span><span class="q out">${have(id)}</span></button>`).join("") + `</div>`
      : `<p class="center muted" style="font-weight:800">Your barn is empty. Harvest or make something first.</p>`;

        <div class="prow"><span>Price</span><div class="stepper"><button class="btn plain" data-act="price" data-d="-1" aria-label="Cheaper">−</button><b>${standUI.price} 🪙</b><button class="btn plain" data-act="price" data-d="1" aria-label="Pricier">+</button></div></div>

  }

function panelShop() {
  let h = `<h4>Expand</h4><div class="shop">`;
  h += S.plots.length < MAX_PLOTS
    ? `<div class="scard slot"><span class="e">🟫</span><b>New field</b><small>${S.plots.length}/${MAX_PLOTS} fields</small><button class="btn gold sm" data-act="plot+">${plotCost()} 🪙</button></div>`
    : `<div class="scard slot"><span class="e">🟫</span><b>Fields</b><small>All ${MAX_PLOTS} owned!</small></div>`;
  h += `<div class="scard slot"><span class="e">📦</span><b>Barn +25</b><small>Holds ${S.barnCap} now</small><button class="btn gold sm" data-act="barnUp">${barnCost()} 🪙</button></div></div>`;
  h += `<h4>Animals</h4><div class="shop">`;
  for (const [k, a] of Object.entries(ANIMALS)) {
    const pen = S.pens[k];
    if (pen.owned) h += `<div class="scard slot"><span class="e">${a.e}</span><b>${a.n}</b><small>${pen.list.length}/${a.max} · makes ${ITEMS[a.out].e}</small>
      ${pen.list.length < a.max ? `<button class="btn gold sm" data-act="animal" data-k="${k}">${a.cost} 🪙</button>` : `<small>Pen is full</small>`}</div>`;
    else if (S.level >= a.lvl) h += `<div class="scard slot"><span class="e">${a.e}</span><b>${a.pen}</b><small>Comes with 1 ${a.n.toLowerCase()}</small><button class="btn gold sm" data-act="pen" data-k="${k}">${a.penCost} 🪙</button></div>`;
    else h += `<div class="scard slot locked"><span class="e">🔒</span><b>${a.pen}</b><small>Level ${a.lvl}</small></div>`;
  }
  h += `</div><h4>Buildings</h4><div class="shop">`;
  for (const [k, b] of Object.entries(BUILDINGS)) {
    if (S.buildings[k].owned) continue;
    h += S.level >= b.lvl
      ? `<div class="scard slot"><span class="e">${b.e}</span><b>${b.n}</b><small>Makes ${b.recipes.map(r => ITEMS[r].e).join(" ")}</small><button class="btn gold sm" data-act="building" data-k="${k}">${b.cost} 🪙</button></div>`
      : `<div class="scard slot locked"><span class="e">🔒</span><b>${b.n}</b><small>Level ${b.lvl}</small></div>`;
  }
  if (Object.values(S.buildings).every(b => b.owned)) h += `<div class="scard slot"><span class="e">🎉</span><b>All built!</b></div>`;
  h += `</div>` + promise();
  return {title:"Shop", body:h};
}

const promise = () => `<div class="promise"><b>💎 No real money. Ever.</b><div>Nothing in this game costs real money. Coins and gems are only earned by playing:</div>
  <ul><li>+2 💎 every level up</li><li>+1 💎 from the daily gift 🎁</li><li>+1 💎 every 10th order, and some orders pay 💎</li></ul></div>`;

function panelFarm() {
  return {title:"Your Farm", body:`<div class="stats">
      <div class="stat slot"><b>${S.stats.harvests}</b>fields harvested</div>
      <div class="stat slot"><b>${S.stats.orders}</b>orders delivered</div>
      <div class="stat slot"><b>${S.stats.made}</b>goods made</div>
      <div class="stat slot"><b>${S.stats.earned.toLocaleString()}</b>coins earned</div></div>
    <h4>Sound</h4><div class="toggles">
      <button class="btn ${snd.on ? "" : "plain"} sm" data-act="sound">${snd.on ? "🔊 Sounds on" : "🔇 Sounds off"}</button>
      <button class="btn ${snd.music ? "" : "plain"} sm" data-act="music">${snd.music ? "🎵 Music on" : "🎵 Music off"}</button></div>
    <h4>How to play</h4>${howTo()}${promise()}
    <p class="center" style="margin:18px 0 0"><button class="btn plain sm" data-act="reset">Start a new farm…</button></p>`};
}
const howTo = () => `<ul class="howto">
  <li>Tap an empty field, then <b>drag a seed</b> across the fields.</li>
  <li>When crops are ripe, tap one and <b>swipe the sickle</b> over them.</li>
  <li>Tap the 🚚 truck or order board to deliver orders for coins and ⭐.</li>
  <li>Tap buildings to make feed, bread, cheese, pies and more.</li>
  <li>Sell at the 🏪 roadside shop by the road, at your own price.</li>
  <li><b>Press and hold</b> a building, pen or field to move it.</li>
  <li>Drag the map to look around. Pinch or use +/− to zoom.</li></ul>`;

function panelLevel({lvl, unlocked}) {
  return {title:"Level Up!", body:`<div class="big">⭐</div><p class="center" style="font-family:var(--fun);font-size:30px;margin:0">Level ${lvl}</p>
    <p class="center" style="font-weight:800;font-size:18px;margin:6px 0">+2 💎 &nbsp; +${20 * lvl} 🪙</p>
    ${unlocked.length ? `<div class="slot" style="padding:12px"><b style="font-family:var(--fun);font-weight:400;font-size:17px">New on your farm</b><ul class="howto">${unlocked.map(u => `<li>${u}</li>`).join("")}</ul></div>` : ""}
    <p class="center" style="margin:14px 0 0"><button class="btn" data-act="closePanel">Yay!</button></p>`};
}
function panelWelcome() {
  return {title:"Sunny Acres", body:`<div class="big">🌻</div><p class="center" style="font-family:var(--fun);font-size:24px;margin:0">Welcome to your farm!</p>
    ${howTo()}${promise()}<p class="center" style="margin:14px 0 0"><button class="btn" data-act="closePanel">Let's farm!</button></p>`};
}

function panelSig() {
  if (!panel) return "";
  const t = now(), f = (e) => (e && e <= t ? 1 : 0);
  if (panel.type === "building") return S.buildings[panel.arg].jobs.map(j => f(j.end)).join("");
  if (panel.type === "orders") return S.orders.map(o => f(o.wait)).join("");
  if (panel.type === "stand") return S.stand.list.map(L => L ? f(L.sellAt) : "-").join("");
  return "";
}
function renderPanel() {
  const v = {stand:panelStand, building:panelBuilding, orders:panelOrders, barn:panelBarn, shop:panelShop, farm:panelFarm, level:panelLevel, welcome:panelWelcome}[panel.type](panel.arg);
  const old = document.querySelector(".pbody"), scroll = old ? old.scrollTop : 0;
  $("#panelRoot").innerHTML = `<div class="scrim" data-act="closePanel"><div class="panel" role="dialog" aria-modal="true" aria-label="${v.title}">
    <div class="ribbon out">${v.title}</div><button class="xbtn" data-act="closePanel" aria-label="Close">✕</button>
    <div class="pbody">${v.body}</div></div></div>`;
  if (old) document.querySelector(".pbody").scrollTop = scroll;
  lastPanelSig = panelSig();
}
function showLevelUp(lvl, unlocked) {
  sfx("level");
  if (drag) { pendingLevel = {lvl, unlocked}; return; }
  openPanel("level", {lvl, unlocked});
}
function tickTimers() {
  const t = now();
  document.querySelectorAll("[data-end]").forEach(el => { el.textContent = fmt(+el.dataset.end - t); });
}
function tick() {
  const t = now();
  let changed = false;
  S.orders.forEach((o, i) => { if (o.wait && o.wait <= t) { S.orders[i] = genOrder(); changed = true; } });
  if (changed) save();
  renderHud();
  if (panel) { if (changed || panelSig() !== lastPanelSig) renderPanel(); else tickTimers(); }
  if (tray && tray.update) tray.update();
}

// ---------- buttons ----------
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("scrim") && e.target !== el) return; // tapping inside a panel shouldn't close it
  const d = el.dataset, i = +d.i;
  switch (d.act) {
    case "closePanel": closePanel(); break;
    case "open": openPanel(d.p); break;
    case "zoomIn": setZoom(zoom * 1.25); break;
    case "zoomOut": setZoom(zoom / 1.25); break;
    case "speedPlot": speedPlot(i); break;
    case "animal": buyAnimal(d.k); break;
    case "pen": if (buyPen(d.k)) { closeTray(); closePanel(); const P = boxOf("p:" + d.k); focusOn(P.gx + P.w / 2, P.gy + P.h / 2); } break;
    case "building": if (buyBuilding(d.k)) { closeTray(); closePanel(); const B = boxOf("b:" + d.k); focusOn(B.gx + B.w / 2, B.gy + B.h / 2); } break;
    case "plot+": if (buyPlot()) { closeTray(); closePanel(); const p = plotPos(S.plots.length - 1); focusOn(p.gx, p.gy); } break;
    case "make": startJob(d.b, d.r); break;
    case "collectJobs": collectJobs(d.b); break;
    case "speedJob": speedJob(d.b); break;
    case "deliver": deliver(i); break;
    case "discard": discard(i); break;
    case "selItem": selItem = d.id; renderPanel(); break;
    case "standPick": standUI = {slot:+d.s}; renderPanel(); break;
    case "standBack": standUI = null; renderPanel(); break;
    case "standItem": {
      const qty = Math.min(have(d.id), ITEMS[d.id].kind === "crop" ? 5 : 1);
      standUI = {slot:standUI.slot, id:d.id, qty, price:Math.round(ITEMS[d.id].p * qty * 1.2)};
      renderPanel(); break;
    }
    case "qty": {
      const u = standUI, ratio = u.price / (ITEMS[u.id].p * u.qty);
      u.qty = clamp(u.qty + +d.d, 1, Math.min(10, have(u.id)));
      const pr = priceRange(u.id, u.qty); u.price = clamp(Math.round(ratio * pr.base), pr.min, pr.max);
      sfx("tick"); renderPanel(); break;
    }
    case "price": {
      const u = standUI, pr = priceRange(u.id, u.qty);
      u.price = clamp(u.price + +d.d * pr.step, pr.min, pr.max);
      sfx("tick"); renderPanel(); break;
    }
    case "standList": if (standList(standUI.slot, standUI.id, standUI.qty, standUI.price)) { standUI = null; renderPanel(); } break;
    case "standCollect": if (standCollect(+d.s)) { sfx("coin"); commit(); } break;
    case "standCancel": standCancel(+d.s); break;
    case "standSlot": buyStandSlot(); break;
    case "sound": snd.on = !snd.on; saveSound(); if (panel) renderPanel(); if (snd.on) sfx("pop"); break;
    case "music": snd.music = !snd.music; saveSound(); renderPanel(); break;
    case "sell": sell(d.id, +d.n); break;
    case "barnUp": upgradeBarn(); break;
    case "reset":
      if (confirm("Start a brand new farm? Your current farm will be erased.")) {
        S = fresh(); fillOrders(); save(); renderHud(); openPanel("welcome");
      }
      break;
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closePanel(); closeTray(); } });
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); else tick(); });
window.addEventListener("resize", () => { resize(); closeTray(); });
document.addEventListener("contextmenu", (e) => e.preventDefault());

/* ============================================================
   SOUND: little effects and a gentle tune, all made on the fly
   (no sound files to download)
   ============================================================ */
const snd = {on:true, music:true};
try { Object.assign(snd, JSON.parse(localStorage.getItem(SAVE_KEY + "-sound") || "{}")); } catch (e) {}
let AC = null, master = null, musicBus = null, noiseBuf = null;
function audio() {
  if (!AC) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    try { AC = new Ctx(); } catch (e) { return null; }
    master = AC.createGain(); master.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applySound();
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function applySound() {
  $("#soundBtn").textContent = snd.on ? "🔊" : "🔇";
  if (!AC) return;
  master.gain.value = snd.on ? 0.55 : 0;
  musicBus.gain.value = snd.music ? 0.22 : 0;
}
function saveSound() { try { localStorage.setItem(SAVE_KEY + "-sound", JSON.stringify(snd)); } catch (e) {} applySound(); }
function tone(f, d, o = {}) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (o.at || 0), osc = ac.createOscillator(), g = ac.createGain();
  osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
  if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.vib; lg.gain.value = f * .04; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + .05); }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(o.vol || .2, t + (o.attack || .005));
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  let out = g;
  if (o.lp) { const f2 = ac.createBiquadFilter(); f2.type = "lowpass"; f2.frequency.value = o.lp; g.connect(f2); out = f2; }
  osc.connect(g); out.connect(o.bus || master);
  osc.start(t); osc.stop(t + d + .05);
}
function noise(d, o = {}) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (o.at || 0), src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = o.freq || 1500; f.Q.value = o.q || 1;
  g.gain.setValueAtTime(o.vol || .2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + d + .05);
}
const SOUNDS = {
  pop:() => tone(520, .08, {to:820, vol:.12, type:"triangle"}),
  tick:() => tone(900, .03, {vol:.05, type:"triangle"}),
  plant:() => { tone(240, .09, {to:420, vol:.18}); noise(.05, {vol:.06, freq:900}); },
  harvest:() => { noise(.13, {vol:.14, freq:4000, q:.7}); tone(880, .12, {type:"triangle", vol:.09, at:.04, to:1320}); },
  feed:() => { noise(.08, {vol:.1, freq:2500}); noise(.08, {vol:.08, freq:2000, at:.07}); },
  collect:() => { tone(523, .09, {type:"triangle", vol:.16}); tone(784, .16, {type:"triangle", vol:.16, at:.08}); },
  coin:() => { tone(1318, .08, {type:"square", vol:.05}); tone(1760, .25, {type:"square", vol:.05, at:.07}); },
  make:() => { tone(330, .1, {type:"triangle", vol:.12}); tone(440, .12, {type:"triangle", vol:.12, at:.08}); },
  build:() => { noise(.22, {vol:.2, freq:280}); [392, 523, 659].forEach((f, i) => tone(f, .2, {type:"triangle", vol:.13, at:.14 + i * .08})); },
  magic:() => [784, 988, 1175, 1568].forEach((f, i) => tone(f, .18, {type:"sine", vol:.1, at:i * .05})),
  level:() => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .32, {type:"triangle", vol:.15, at:i * .09})),
  error:() => tone(170, .18, {type:"square", vol:.05, to:120}),
  pickup:() => tone(380, .12, {to:720, vol:.12, type:"triangle"}),
  place:() => { noise(.1, {vol:.18, freq:380}); tone(300, .12, {type:"triangle", vol:.12, to:210}); },
  truck:() => { tone(440, .12, {type:"square", vol:.04, lp:1400}); tone(554, .16, {type:"square", vol:.04, lp:1400, at:.14}); },
  chicken:() => { tone(1150, .07, {type:"square", vol:.035, to:720, lp:2500}); tone(1250, .09, {type:"square", vol:.035, to:650, lp:2500, at:.11}); },
  cow:() => tone(165, .75, {type:"sawtooth", vol:.09, to:118, lp:700, attack:.12}),
  sheep:() => tone(330, .55, {type:"sawtooth", vol:.06, to:290, lp:1500, attack:.05, vib:9}),
};
function sfx(name) { if (!snd.on || !AC) return; try { SOUNDS[name] && SOUNDS[name](); } catch (e) {} }

// A soft, wandering tune in C major pentatonic over a I–V–vi–IV bass line.
const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
const SCALE = [60, 62, 64, 67, 69, 72, 74, 76, 79], ROOTS = [48, 43, 45, 41];
let musicAt = 0, musicStep = 0, melody = 4;
function musicTick() {
  if (!AC || AC.state !== "running" || !snd.on || !snd.music || document.hidden) { musicAt = 0; return; }
  const beat = 60 / 88 / 2; // eighth notes
  if (musicAt < AC.currentTime) musicAt = AC.currentTime + .05;
  while (musicAt < AC.currentTime + .35) {
    const at = musicAt - AC.currentTime, pos = musicStep % 8, root = ROOTS[Math.floor(musicStep / 8) % 4];
    if (pos === 0 || pos === 4) tone(midi(root), .7, {vol:.16, at, bus:musicBus});
    if (pos === 2 || pos === 6) tone(midi(root + 12), .25, {vol:.05, at, bus:musicBus, type:"triangle"});
    if (Math.random() < (pos % 2 ? .35 : .7)) {
      melody = clamp(melody + pick([-2, -1, -1, 0, 1, 1, 2]), 0, SCALE.length - 1);
      tone(midi(SCALE[melody]), .45, {type:"triangle", vol:.07, at, bus:musicBus, attack:.01});
    }
    musicAt += beat; musicStep++;
  }
}
setInterval(musicTick, 120);
document.addEventListener("pointerdown", () => { if (snd.on) audio(); }, true); // browsers only allow sound after a touch

// ---------- start ----------
load();
const isNew = !S.orders.length && S.stats.harvests === 0;
fillOrders();
resize();
zoom = clamp(Math.min(W, H) / 560, 0.55, 1.1);
{ const [x, y] = iso(FIELD0.gx + 3, FIELD0.gy + 2); cam.x = x; cam.y = y; clampCam(); }
renderHud(); applySound();
if (isNew) openPanel("welcome");
requestAnimationFrame(frame);
setInterval(tick, 1000);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
