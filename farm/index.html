<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#6EC3E6">
<title>Sunny Acres</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --parch:#FCEBC0; --parch2:#F4D79A; --wood:#9A5B2A; --wood-dk:#6E3D18; --ink:#5A3413;
  --green:#6CC04A; --green-dk:#3E8E24; --gold:#FFC83D; --gold-dk:#C4850C; --blue:#48B4F0; --blue-dk:#1F7FC0;
  --red:#E8513C; --red-dk:#A8321F; --water:#6EC3E6;
  --fun:"Lilita One","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--water);font-family:var(--body);color:var(--ink);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#world{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
.out{color:#fff;text-shadow:0 2px 0 var(--wood-dk),2px 0 0 var(--wood-dk),-2px 0 0 var(--wood-dk),0 -2px 0 var(--wood-dk),1.5px 1.5px 0 var(--wood-dk),-1.5px 1.5px 0 var(--wood-dk),1.5px -1.5px 0 var(--wood-dk),-1.5px -1.5px 0 var(--wood-dk)}
@keyframes pop{from{transform:scale(.8);opacity:0}}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.hud > *{pointer-events:auto}
.lvlbox{display:flex;align-items:center}
.star{width:56px;height:56px;position:relative;z-index:1;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.star svg{position:absolute;inset:0}
.star b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fun);font-weight:400;font-size:21px;padding-top:4px}
.xpbar{margin-left:-16px;width:118px;height:24px;background:rgba(70,35,10,.6);border:3px solid #fff;border-radius:0 13px 13px 0;position:relative;overflow:hidden}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#9BE36E,#4FAE2E);transition:width .4s}
.xpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fun);font-size:13px;padding-left:10px}
.money{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.cnt{display:flex;align-items:center;height:32px;min-width:112px;background:rgba(70,35,10,.6);border:3px solid #fff;border-radius:17px;padding-right:12px}
.cnt .ic{font-size:28px;margin-left:-14px;margin-right:6px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3));line-height:1}
.cnt b{font-family:var(--fun);font-weight:400;font-size:19px;margin-left:auto}

/* dock */
.dock{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:5;display:flex;gap:14px}
.dock button{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF2C4,#F2BF4B);border:4px solid #fff;
  box-shadow:0 4px 0 var(--wood-dk),0 7px 12px rgba(0,0,0,.3);font-size:30px;position:relative;line-height:1}
.dock button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dk)}
.dock .l{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-family:var(--fun);font-size:14px;white-space:nowrap}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--red);border:2px solid #fff;
  color:#fff;font-family:var(--fun);font-size:13px;display:grid;place-items:center;padding:0 5px}
.zoom{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:5;display:flex;flex-direction:column;gap:8px}
.zoom button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25);
  font-family:var(--fun);font-size:22px;color:var(--wood-dk)}

/* tray (the little bubble that pops up over the farm) */
.tray{position:fixed;z-index:8;background:var(--parch);border:4px solid var(--wood);border-radius:20px;padding:8px 10px 10px;
  box-shadow:0 7px 16px rgba(0,0,0,.35);max-width:min(340px,calc(100vw - 20px));touch-action:none;animation:pop .14s ease-out}
.tray-title{font-family:var(--fun);font-size:17px;text-align:center;line-height:1.2}
.tray-sub{font-size:13px;text-align:center;font-weight:800;opacity:.8}
.tools{display:flex;flex-wrap:wrap;gap:10px 8px;justify-content:center;margin:8px 0 6px}
.tool{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#F3DFAE);border:3px solid var(--wood);
  display:grid;place-items:center;position:relative;touch-action:none;cursor:grab;box-shadow:0 3px 0 var(--wood-dk)}
.tool .e{font-size:32px;line-height:1;pointer-events:none}
.tool .n{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--wood);color:#fff;border-radius:9px;font-size:11px;
  font-weight:800;padding:0 6px;white-space:nowrap;pointer-events:none}
.tray-hint{font-size:12px;text-align:center;font-weight:800;opacity:.7;margin-top:4px}
.tray .row{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.ghost{position:fixed;z-index:9;pointer-events:none;width:70px;height:70px;display:grid;place-items:center;font-size:48px;line-height:1;
  filter:drop-shadow(0 8px 5px rgba(0,0,0,.35))}

/* panels */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(40,20,0,.5);display:flex;align-items:center;justify-content:center;
  padding:30px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.panel{width:100%;max-width:580px;max-height:100%;display:flex;flex-direction:column;background:var(--parch);border:6px solid var(--wood);
  border-radius:26px;box-shadow:inset 0 0 0 4px var(--parch2),0 12px 30px rgba(0,0,0,.45);position:relative;animation:pop .18s ease-out}
.ribbon{align-self:center;margin-top:-24px;background:linear-gradient(#F0664F,#C9381F);font-family:var(--fun);font-size:22px;padding:6px 26px;
  border-radius:14px;border:3px solid #fff;box-shadow:0 4px 0 #8A2415;white-space:nowrap;max-width:calc(100% - 70px);overflow:hidden;text-overflow:ellipsis}
.ribbon.out{text-shadow:0 2px 0 #8A2415,2px 0 0 #8A2415,-2px 0 0 #8A2415,0 -2px 0 #8A2415}
.xbtn{position:absolute;top:-18px;right:-14px;width:44px;height:44px;border-radius:50%;background:linear-gradient(#F0664F,#C9381F);border:3px solid #fff;
  box-shadow:0 3px 0 #8A2415;font-family:var(--fun);font-size:22px;color:#fff}
.pbody{overflow:auto;padding:14px 14px 16px;-webkit-user-select:none}
.pbody h4{font-family:var(--fun);font-weight:400;font-size:19px;margin:14px 0 8px}
.pbody h4:first-child{margin-top:4px}
.muted{opacity:.72}
.center{text-align:center}

.btn{font-family:var(--fun);font-weight:400;font-size:16px;color:#fff;background:linear-gradient(#8BDA60,#58AE36);border-radius:13px;padding:8px 15px;
  box-shadow:0 4px 0 var(--green-dk);text-shadow:0 1px 0 rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dk)}
.btn.gold{background:linear-gradient(#FFDD70,#F4B527);box-shadow:0 4px 0 var(--gold-dk);color:var(--wood-dk);text-shadow:none}
.btn.blue{background:linear-gradient(#72CBF7,#34A0E0);box-shadow:0 4px 0 var(--blue-dk)}
.btn.plain{background:#fff;color:var(--wood-dk);box-shadow:0 3px 0 var(--parch2);text-shadow:none}
.btn.red{background:linear-gradient(#F0664F,#C9381F);box-shadow:0 4px 0 #8A2415}
.btn:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed;transform:none}
.btn.sm{font-size:14px;padding:6px 11px;border-radius:11px}
.btn.wide{width:100%}
.slot{background:var(--parch2);border-radius:16px;box-shadow:inset 0 3px 0 rgba(110,61,24,.12)}

/* building */
.queue{display:flex;gap:8px;justify-content:center}
.qslot{width:74px;height:74px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.qslot .e{font-size:32px;line-height:1.1}
.qslot.done{background:#DFF3C9;outline:3px solid var(--green)}
.qslot.wait .e{opacity:.45}
.qslot.empty{border:3px dashed rgba(110,61,24,.3);background:none;box-shadow:none;opacity:.6}
.qbtns{display:flex;gap:8px;justify-content:center;margin:12px 0 2px;flex-wrap:wrap}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.rcard{padding:8px 10px;display:flex;align-items:center;gap:10px}
.rcard .mid{flex:1;min-width:0}
.rcard > .e{font-size:36px;line-height:1;flex:none}
.rcard b{font-family:var(--fun);font-weight:400;font-size:17px;display:block;line-height:1.1}
.rcard small{font-weight:800;opacity:.7}
.need{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;font-weight:800}
.need .short{color:var(--red-dk)}
.rcard.locked{opacity:.55}

/* orders */
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:14px 10px;padding-top:6px}
.note{background:#FFFEF7;border-radius:8px;padding:16px 10px 10px;box-shadow:0 4px 0 rgba(110,61,24,.18);position:relative;display:flex;flex-direction:column;gap:8px}
.note::before{content:"📌";position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:20px}
.note.can{outline:3px solid var(--green)}
.note .items{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px}
.oi{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:13px}
.oi .e{font-size:30px;line-height:1.1}
.oi.short{color:var(--red-dk)}
.oi.ok::after{content:"✔";color:var(--green-dk);font-size:12px}
.reward{display:flex;justify-content:center;gap:8px;font-family:var(--fun);font-size:15px;flex-wrap:wrap}
.note .foot{display:flex;gap:6px}
.note .foot .btn:first-child{flex:1}
.note.waiting{justify-content:center;align-items:center;text-align:center;min-height:170px;font-weight:800;background:rgba(255,254,247,.55)}
.note.waiting .e{font-size:40px}

/* barn */
.cap{height:18px;border-radius:10px;background:rgba(110,61,24,.2);overflow:hidden;margin:4px 0 10px}
.cap i{display:block;height:100%;background:linear-gradient(#9BE36E,#4FAE2E)}
.cap.full i{background:linear-gradient(#F48B79,#D8412A)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.islot{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.islot .e{font-size:32px;line-height:1}
.islot .q{position:absolute;bottom:4px;right:6px;font-family:var(--fun);font-size:15px}
.islot.sel{outline:3px solid var(--wood);background:#FFF6DC}
.sellbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;margin-top:12px}
.sellbar .e{font-size:34px}
.sellbar .grow{flex:1;min-width:120px}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.scard .e{font-size:40px;line-height:1.1}
.scard b{font-family:var(--fun);font-weight:400;font-size:17px}
.scard small{font-weight:800;opacity:.72;font-size:12px}
.scard .btn{margin-top:auto}
.scard.locked{opacity:.55}
.promise{background:#E4F4FF;border:3px solid var(--blue);border-radius:16px;padding:12px 14px;margin-top:14px;font-weight:800}
.promise b{font-family:var(--fun);font-weight:400;font-size:18px;color:var(--blue-dk)}
.promise ul{margin:6px 0 0;padding-left:20px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{padding:10px;text-align:center}
.stat b{display:block;font-family:var(--fun);font-weight:400;font-size:24px}
.big{font-size:70px;text-align:center;line-height:1.1}
.howto{margin:8px 0;padding-left:22px;font-weight:700}
.howto li{margin:4px 0}

/* roadside shop */
.stand{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sslot{min-height:128px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;position:relative;font-weight:800;font-size:13px;width:100%}
.sslot .e{font-size:38px;line-height:1.1}
.sslot b{font-family:var(--fun);font-weight:400;font-size:17px}
.sslot small{opacity:.7;font-size:12px}
.sslot.empty{border:3px dashed rgba(110,61,24,.3);background:none;box-shadow:none;color:var(--wood)}
.sslot.sold{background:#DFF3C9;outline:3px solid var(--green);animation:pop .3s}
.sslot .rm{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--red-dk);font-weight:800;box-shadow:0 2px 0 var(--parch2)}
.picker{padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{font-family:var(--fun);font-weight:400;font-size:20px;min-width:70px;text-align:center}
.stepper .btn{width:40px;padding:6px 0;font-size:20px}
.toggles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.movehint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 108px);left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;
  background:rgba(70,35,10,.85);border:2px solid #fff;color:#fff;border-radius:99px;padding:7px 16px;font-weight:800;font-size:14px;white-space:nowrap}

/* toast */
.toasts{position:fixed;left:0;right:0;bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:rgba(70,35,10,.88);color:#fff;padding:9px 16px;border-radius:99px;font-weight:800;font-size:14px;border:2px solid #fff;
  box-shadow:0 4px 14px rgba(0,0,0,.25);animation:pop .2s ease-out;max-width:100%;text-align:center}
</style>
</head>
<body>
<canvas id="world" aria-label="Your farm. Drag to look around, tap things to use them."></canvas>

<div class="hud">
  <div class="lvlbox" title="Level">
    <div class="star">
      <svg viewBox="0 0 56 56"><path d="M28 3l7.3 15.2 16.7 2.2-12.2 11.6 3 16.6L28 40.7 13.2 48.6l3-16.6L4 20.4l16.7-2.2z" fill="#FFD23F" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/></svg>
      <b class="out" id="lvl">1</b>
    </div>
    <div class="xpbar"><i id="xpBar" style="width:0"></i><span class="out" id="xpTxt">0/15</span></div>
  </div>
  <div class="money">
    <div class="cnt" title="Coins"><span class="ic">🪙</span><b class="out" id="coins">0</b></div>
    <div class="cnt" title="Gems, earned only by playing"><span class="ic">💎</span><b class="out" id="gems">0</b></div>
  </div>
</div>

<div class="zoom">
  <button data-act="sound" id="soundBtn" aria-label="Sound on or off">🔊</button>
  <button data-act="zoomIn" aria-label="Zoom in">+</button>
  <button data-act="zoomOut" aria-label="Zoom out">−</button>
</div>

<div class="dock">
  <button data-act="open" data-p="orders" aria-label="Orders">🚚<span class="l out">Orders</span></button>
  <button data-act="open" data-p="barn" aria-label="Barn">📦<span class="l out">Barn</span></button>
  <button data-act="open" data-p="shop" aria-label="Shop">🛒<span class="l out">Shop</span></button>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="panelRoot"></div>
<div class="movehint" id="moveHint" hidden>Let go to place it</div>

<script>
"use strict";
/* ============================================================
   Sunny Acres: a cozy farm game. No real money, ever.
   Everything, including gems, is earned by playing.
   All art is drawn in code or uses the phone's own emoji.
   ============================================================ */

const SAVE_KEY = "sunny-acres-v1";

// ---------- game data ----------
// kind: crop | feed | animal | good.  p = sell price.  lvl = level it unlocks.
const ITEMS = {
  wheat:{n:"Wheat",e:"🌾",p:2,lvl:1,kind:"crop"},
  corn:{n:"Corn",e:"🌽",p:4,lvl:1,kind:"crop"},
  carrot:{n:"Carrot",e:"🥕",p:6,lvl:2,kind:"crop"},
  soybean:{n:"Soybean",e:"🫘",p:7,lvl:3,kind:"crop"},
  sugarcane:{n:"Sugarcane",e:"🎋",p:9,lvl:4,kind:"crop"},
  tomato:{n:"Tomato",e:"🍅",p:11,lvl:5,kind:"crop"},
  strawberry:{n:"Strawberry",e:"🍓",p:14,lvl:6,kind:"crop"},
  pumpkin:{n:"Pumpkin",e:"🎃",p:20,lvl:8,kind:"crop"},

  chicken_feed:{n:"Chicken feed",e:"🟡",p:3,lvl:1,kind:"feed"},
  cow_feed:{n:"Cow feed",e:"🟤",p:5,lvl:4,kind:"feed"},
  sheep_feed:{n:"Sheep feed",e:"🟢",p:7,lvl:7,kind:"feed"},

  egg:{n:"Egg",e:"🥚",p:10,lvl:2,kind:"animal"},
  milk:{n:"Milk",e:"🥛",p:18,lvl:4,kind:"animal"},
  wool:{n:"Wool",e:"🧶",p:28,lvl:7,kind:"animal"},

  bread:{n:"Bread",e:"🍞",p:12,lvl:2,kind:"good"},
  cornbread:{n:"Corn bread",e:"🥯",p:32,lvl:3,kind:"good"},
  sugar:{n:"Brown sugar",e:"🍬",p:16,lvl:4,kind:"good"},
  butter:{n:"Butter",e:"🧈",p:45,lvl:4,kind:"good"},
  cookie:{n:"Cookie",e:"🍪",p:45,lvl:5,kind:"good"},
  tomato_soup:{n:"Tomato soup",e:"🍲",p:55,lvl:5,kind:"good"},
  cheese:{n:"Cheese",e:"🧀",p:65,lvl:6,kind:"good"},
  carrot_pie:{n:"Carrot pie",e:"🥧",p:70,lvl:6,kind:"good"},
  strawberry_jam:{n:"Strawberry jam",e:"🍯",p:70,lvl:7,kind:"good"},
  pumpkin_pie:{n:"Pumpkin pie",e:"🍮",p:85,lvl:8,kind:"good"},
  sweater:{n:"Sweater",e:"🧥",p:90,lvl:8,kind:"good"},
};

// time in seconds; seed = coin price when you have none of that crop to replant
const CROPS = {
  wheat:{time:20,xp:1,seed:1}, corn:{time:45,xp:1,seed:2}, carrot:{time:90,xp:2,seed:3},
  soybean:{time:120,xp:2,seed:4}, sugarcane:{time:180,xp:3,seed:5}, tomato:{time:240,xp:3,seed:6},
  strawberry:{time:360,xp:4,seed:8}, pumpkin:{time:600,xp:6,seed:12},
};

const ANIMALS = {
  chicken:{n:"Chicken",e:"🐔",size:26,feed:"chicken_feed",out:"egg",time:90,xp:2,lvl:2,pen:"Chicken coop",penE:"🐔",penCost:100,cost:40,max:6},
  cow:{n:"Cow",e:"🐄",size:36,feed:"cow_feed",out:"milk",time:180,xp:3,lvl:4,pen:"Cow pasture",penE:"🐄",penCost:300,cost:120,max:5},
  sheep:{n:"Sheep",e:"🐑",size:32,feed:"sheep_feed",out:"wool",time:300,xp:4,lvl:7,pen:"Sheep meadow",penE:"🐑",penCost:500,cost:200,max:5},
};

const BUILDINGS = {
  feedmill:{n:"Feed Mill",e:"🏭",lvl:1,cost:0,recipes:["chicken_feed","cow_feed","sheep_feed"]},
  bakery:{n:"Bakery",e:"🥖",lvl:2,cost:120,recipes:["bread","cornbread","cookie"]},
  sugarmill:{n:"Sugar Mill",e:"🍬",lvl:4,cost:250,recipes:["sugar"]},
  dairy:{n:"Dairy",e:"🧀",lvl:4,cost:300,recipes:["butter","cheese"]},
  kitchen:{n:"Kitchen",e:"🍳",lvl:5,cost:450,recipes:["tomato_soup","carrot_pie","strawberry_jam","pumpkin_pie"]},
  loom:{n:"Loom",e:"🧵",lvl:8,cost:600,recipes:["sweater"]},
};

const RECIPES = {
  chicken_feed:{in:{wheat:2,corn:1},out:3,time:30,xp:1},

  cornbread:{in:{corn:2,egg:2},out:1,time:120,xp:4},

const MAX_PLOTS = 30, QUEUE_SLOTS = 3, STAND_MAX = 8;
// how each crop looks while it grows
const LOOK = {wheat:"grain", corn:"stalk", carrot:"leafy", soybean:"bush", sugarcane:"cane", tomato:"bush", strawberry:"low", pumpkin:"vine"};

// ---------- farm layout (isometric tiles) ----------
const TW = 72, TH = 36, MAP_W = 29, MAP_H = 20, ROAD_H = 2;
const FIELD0 = {gx:6, gy:6}, FIELD_COLS = 6;
const gridPos = (i) => ({gx:FIELD0.gx + (i % FIELD_COLS), gy:FIELD0.gy + Math.floor(i / FIELD_COLS)});
const LAYOUT = {
  house:{gx:1, gy:3, w:3, h:3},
  barn:{gx:1, gy:8, w:3, h:3},
  board:{gx:5, gy:3, w:1, h:1},
  stand:{gx:9, gy:3, w:2, h:2},
  truck:{gx:3.2, gy:1},
  pond:{gx:2, gy:13, w:4, h:3},
  buildings:{
    feedmill:{gx:14, gy:3, w:3, h:3}, bakery:{gx:18, gy:3, w:3, h:3}, sugarmill:{gx:22, gy:3, w:3, h:3},
    dairy:{gx:14, gy:8, w:3, h:3}, kitchen:{gx:18, gy:8, w:3, h:3}, loom:{gx:22, gy:8, w:3, h:3},
  },
  pens:{chicken:{gx:13, gy:13, w:4, h:4}, cow:{gx:18, gy:13, w:4, h:4}, sheep:{gx:23, gy:13, w:4, h:4}},
};
// wall / roof colors for each building
const STYLE = {
  house:{wl:"#F7E6C4", wr:"#E3CDA2", rf:"#3F83CB", rb:"#5C9BDB", door:"#8A5530", chimney:true, sign:"🏡"},
  barn:{wl:"#D8452F", wr:"#B7351F", rf:"#7C4A2E", rb:"#9A5E3B", door:"#9E2E1D", barn:true, sign:"📦"},
  feedmill:{wl:"#EAC37C", wr:"#D0A75F", rf:"#5DA63A", rb:"#78BE52", door:"#8A5530", sign:"🏭"},
  bakery:{wl:"#F9DDB6", wr:"#E5C293", rf:"#DA6F37", rb:"#EB8A55", door:"#8A5530", chimney:true, sign:"🥖"},
  sugarmill:{wl:"#EDE8D6", wr:"#D2CAB0", rf:"#8C69C0", rb:"#A585D3", door:"#6E5A8A", sign:"🍬"},
  dairy:{wl:"#FFFFFF", wr:"#E3E6EA", rf:"#3F97D6", rb:"#63AEE3", door:"#5A7EA0", sign:"🧀"},
  kitchen:{wl:"#F4CDA5", wr:"#DDB287", rf:"#C33A2C", rb:"#D95B4C", door:"#8A5530", chimney:true, sign:"🍳"},
  loom:{wl:"#DDCBEB", wr:"#C2ACD5", rf:"#E06AA2", rb:"#EB8DBB", door:"#7E5A98", sign:"🧵"},
};
const PEN_GROUND = {chicken:"#E6D08A", cow:"#A4D65C", sheep:"#B5DE72"};

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const now = () => Date.now();
const today = () => new Date().toLocaleDateString("en-CA");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const xpNeed = (lvl) => Math.round(15 * Math.pow(lvl, 1.6));
const fmt = (ms) => {
  const s = Math.max(0, Math.ceil(ms / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m" + (s % 60 ? " " + (s % 60) + "s" : "");
  return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
};
const gemCost = (ms) => Math.max(1, Math.ceil(ms / 300000)); // 1 gem per 5 min left
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const plotCost = () => 40 + (S.plots.length - 6) * 35;
const barnCost = () => Math.round(80 * Math.pow(1.55, S.barnUps) / 10) * 10;
const orderSlots = () => Math.min(4 + Math.floor(S.level / 2), 9);

// ---------- state ----------
let S;
function fresh() {
  return {
    v:1, coins:60, gems:5, xp:0, level:1,
    barn:{wheat:3, corn:2}, barnCap:50, barnUps:0,
    plots:Array.from({length:6}, (_, i) => Object.assign({crop:null, end:0}, gridPos(i))),
    pos:{}, stand:{slots:4, list:[null, null, null, null]},
    lastCrop:"wheat",
    pens:{chicken:{owned:false,list:[]}, cow:{owned:false,list:[]}, sheep:{owned:false,list:[]}},
    buildings:Object.fromEntries(Object.keys(BUILDINGS).map(k => [k, {owned:k === "feedmill", jobs:[]}])),
    orders:[], lastDaily:"",
    stats:{orders:0, harvests:0, made:0, earned:0},
  };
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const base = fresh(), saved = JSON.parse(raw);
      S = Object.assign(base, saved);
      for (const k in base.buildings) if (!S.buildings[k]) S.buildings[k] = base.buildings[k];
      for (const k in base.pens) if (!S.pens[k]) S.pens[k] = base.pens[k];
      S.stats = Object.assign(fresh().stats, S.stats);
      S.plots.forEach((p, i) => { if (p.gx == null) Object.assign(p, gridPos(i)); }); // saves from before fields could move
      return;
    }
  } catch (e) {}
  S = fresh();
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- where things are (everything except the road, pond and order board can be moved) ----------
let move = null; // the thing being dragged around right now, if any
function defaultBox(key) {
  if (key === "house" || key === "barn" || key === "stand") return LAYOUT[key];
  if (key.startsWith("b:")) return LAYOUT.buildings[key.slice(2)];
  if (key.startsWith("p:")) return LAYOUT.pens[key.slice(2)];
  return null;
}
function boxOf(key) {
  if (move && move.key === key) return move.box;
  if (key.startsWith("f:")) { const p = S.plots[+key.slice(2)]; return {gx:p.gx, gy:p.gy, w:1, h:1}; }
  const d = defaultBox(key), o = S.pos[key];
  return o ? {gx:o.gx, gy:o.gy, w:d.w, h:d.h} : d;
}
const plotPos = (i) => boxOf("f:" + i);
function allBoxes() {
  const out = [["board", LAYOUT.board], ["pond", LAYOUT.pond], ["house", boxOf("house")], ["barn", boxOf("barn")], ["stand", boxOf("stand")]];
  for (const b of Object.keys(BUILDINGS)) out.push(["b:" + b, boxOf("b:" + b)]);
  for (const k of Object.keys(ANIMALS)) out.push(["p:" + k, boxOf("p:" + k)]);
  S.plots.forEach((_, i) => out.push(["f:" + i, boxOf("f:" + i)]));
  return out;
}
const overlap = (a, b) => a.gx < b.gx + b.w && b.gx < a.gx + a.w && a.gy < b.gy + b.h && b.gy < a.gy + a.h;
function canPlace(key, b, boxes = allBoxes()) {
  if (b.gx < 0 || b.gy < ROAD_H || b.gx + b.w > MAP_W || b.gy + b.h > MAP_H) return false;
  return !boxes.some(([k, o]) => k !== key && overlap(o, b));
}
// first free spot for a new field: the field area first, then anywhere
function nextPlotSpot(boxes = allBoxes()) {
  for (let i = 0; i < MAX_PLOTS; i++) { const g = gridPos(i), b = {gx:g.gx, gy:g.gy, w:1, h:1}; if (canPlace("new", b, boxes)) return b; }
  for (let gy = ROAD_H; gy < MAP_H; gy++) for (let gx = 0; gx < MAP_W; gx++) { const b = {gx, gy, w:1, h:1}; if (canPlace("new", b, boxes)) return b; }
  return null;
}
const giftPos = () => { const h = boxOf("house"); return {gx:h.gx + h.w + .7, gy:h.gy + h.h + .8}; };

// ---------- inventory ----------
const have = (id) => S.barn[id] || 0;
const barnUsed = () => Object.values(S.barn).reduce((a, b) => a + b, 0);
const space = () => S.barnCap - barnUsed();
function add(id, n) { S.barn[id] = have(id) + n; }
function take(id, n) { S.barn[id] = have(id) - n; if (S.barn[id] <= 0) delete S.barn[id]; }
const hasAll = (req) => Object.entries(req).every(([id, n]) => have(id) >= n);

// ---------- progression ----------
function gainXP(n) {
  S.xp += n;
  while (S.xp >= xpNeed(S.level)) {
    S.xp -= xpNeed(S.level);
    S.level++;
    S.gems += 2;
    S.coins += 20 * S.level;
    showLevelUp(S.level, unlocksAt(S.level));
    fillOrders();
  }
}
function unlocksAt(lvl) {
  const out = [];
  for (const id of Object.keys(CROPS)) if (ITEMS[id].lvl === lvl) out.push(ITEMS[id].e + " " + ITEMS[id].n + " seeds");
  for (const a of Object.values(ANIMALS)) if (a.lvl === lvl) out.push(a.penE + " " + a.pen);
  for (const b of Object.values(BUILDINGS)) if (b.lvl === lvl && b.cost) out.push(b.e + " " + b.n);
  for (const id of Object.keys(RECIPES)) if (ITEMS[id].lvl === lvl) out.push(ITEMS[id].e + " " + ITEMS[id].n + " recipe");
  return out;
}

// ---------- fields ----------
function plant(i, crop, quiet) {
  const p = S.plots[i], c = CROPS[crop];
  if (!p || p.crop || ITEMS[crop].lvl > S.level) return false;
  if (have(crop) > 0) take(crop, 1);
  else if (S.coins >= c.seed) S.coins -= c.seed;
  else { if (!quiet) toast("Not enough coins for " + ITEMS[crop].n + " seeds"); return false; }
  p.crop = crop; p.end = now() + c.time * 1000; S.lastCrop = crop;
  sfx("plant");
  return true;
}
function harvest(i, quiet) {
  const p = S.plots[i];
  if (!p || !p.crop || p.end > now()) return false;
  if (space() < 2) { if (!quiet) barnFull(); return false; }
  const pos = plotPos(i);
  fxAt(pos.gx + .5, pos.gy + .5, "+2", ITEMS[p.crop].e);
  add(p.crop, 2); gainXP(CROPS[p.crop].xp); S.stats.harvests++; sfx("harvest");
  p.crop = null; p.end = 0;
  return true;
}
function harvestAll() {
  let n = 0, full = false;
  S.plots.forEach((p, i) => { if (p.crop && p.end <= now()) { if (harvest(i, true)) n++; else full = true; } });
  if (full) barnFull();
  commit();
  return n;
}

// ---------- animals ----------
function feedOne(kind, i) {
  const a = ANIMALS[kind], pen = S.pens[kind];
  if (pen.list[i] !== 0 || have(a.feed) < 1) return false;
  take(a.feed, 1); pen.list[i] = now() + a.time * 1000;
  sfx("feed");
  return true;
}
function feedAll(kind) {
  const a = ANIMALS[kind], pen = S.pens[kind];
  let n = 0;
  pen.list.forEach((_, i) => { if (feedOne(kind, i)) n++; });
  if (n) toast("Fed " + n + " " + a.e);
  else if (pen.list.some(e => e === 0)) toast("You need " + ITEMS[a.feed].n + ". Make it at the Feed Mill.");
  commit();
}
function collectAnimal(kind, i) {
  const a = ANIMALS[kind], pen = S.pens[kind], end = pen.list[i];
  if (!end || end > now()) return false;
  if (space() < 1) { barnFull(); return false; }
  add(a.out, 1); gainXP(a.xp); pen.list[i] = 0;
  const an = animWorld(kind, i); fxAt(an.x, an.y, "+1", ITEMS[a.out].e); sfx(kind);
  return true;
}
function collectAll(kind) {
  let n = 0;
  S.pens[kind].list.forEach((_, i) => { if (collectAnimal(kind, i)) n++; });
  commit();
  return n;
}
function tapAnimal(kind, i) {
  const a = ANIMALS[kind], end = S.pens[kind].list[i];
  if (end === 0) {
    if (!feedOne(kind, i)) return toast("You need " + ITEMS[a.feed].n + ". Make it at the Feed Mill.");
  } else if (end <= now()) collectAnimal(kind, i);
  else return toast(a.n + " is busy: " + fmt(end - now()) + " left");
  commit();
}

// ---------- buildings ----------
function startJob(bid, rid) {
  const b = S.buildings[bid], r = RECIPES[rid];
  if (b.jobs.length >= QUEUE_SLOTS) return toast("Queue is full. Collect finished goods first.");
  if (!hasAll(r.in)) return toast("Missing ingredients");
  for (const [id, n] of Object.entries(r.in)) take(id, n);
  const last = b.jobs[b.jobs.length - 1];
  const start = Math.max(now(), last ? last.end : 0);
  b.jobs.push({r:rid, end:start + r.time * 1000, dur:r.time * 1000});
  sfx("make");
  commit();
}
function collectJobs(bid) {
  const b = S.buildings[bid], box = boxOf("b:" + bid);
  let n = 0;
  while (b.jobs.length && b.jobs[0].end <= now()) {
    const j = b.jobs[0], r = RECIPES[j.r];
    if (space() < r.out) { barnFull(); break; }
    add(j.r, r.out); gainXP(r.xp); S.stats.made += r.out; b.jobs.shift(); n++;
    fxAt(box.gx + box.w / 2 + n * .3, box.gy + box.h / 2, "+" + r.out, ITEMS[j.r].e);
  }
  if (n) sfx("collect");
  commit();
  return n;
}
function speedJob(bid) {
  const b = S.buildings[bid], t = now();
  const j = b.jobs.find(j => j.end > t);
  if (!j) return;
  const left = j.end - t, cost = gemCost(left);
  if (S.gems < cost) return toast("Not enough 💎. Earn more by leveling up and filling orders.");
  S.gems -= cost; sfx("magic");
  b.jobs.forEach(x => { if (x.end > t) x.end -= left; }); // pull this job and the ones behind it forward
  commit();
}

// ---------- orders ----------
function producible() {
  const out = [];
  for (const [id, it] of Object.entries(ITEMS)) {
    if (it.lvl > S.level) continue;
    if (it.kind === "crop") out.push(id);
    else if (it.kind === "animal") { const a = Object.keys(ANIMALS).find(k => ANIMALS[k].out === id); if (S.pens[a].owned && S.pens[a].list.length) out.push(id); }
    else {
      const bid = Object.keys(BUILDINGS).find(k => BUILDINGS[k].recipes.includes(id));
      if (S.buildings[bid].owned && (it.kind !== "feed" || S.level < 3)) out.push(id);
    }
  }
  return out;
}
function genOrder() {
  const pool = producible();
  const kinds = Math.min(pool.length, rand(1, S.level < 3 ? 2 : 3));
  const items = {};
  while (Object.keys(items).length < kinds) {
    const id = pick(pool);
    if (items[id]) continue;
    const k = ITEMS[id].kind;
    items[id] = k === "crop" ? rand(2, 3 + Math.min(S.level, 5)) : k === "good" ? rand(1, 2) : rand(1, 3);
  }
  const value = Object.entries(items).reduce((a, [id, n]) => a + ITEMS[id].p * n, 0);
  return {items, coins:Math.round(value * 1.35 + 4), xp:Math.max(2, Math.round(value / 4)), gem:Math.random() < 0.12 ? 1 : 0, wait:0};
}
function fillOrders() { while (S.orders.length < orderSlots()) S.orders.push(genOrder()); }
function deliver(i) {
  const o = S.orders[i];
  if (!o || o.wait || !hasAll(o.items)) return;
  for (const [id, n] of Object.entries(o.items)) take(id, n);
  S.coins += o.coins; S.gems += o.gem; S.stats.orders++; S.stats.earned += o.coins;
  const bonus = S.stats.orders % 10 === 0 ? 1 : 0; // a free gem every 10 orders
  S.gems += bonus;
  toast("🚚 +" + o.coins + " 🪙" + (o.gem + bonus ? "  +" + (o.gem + bonus) + " 💎" : "") + "  +" + o.xp + " ⭐");
  fxAt(LAYOUT.truck.gx + .5, LAYOUT.truck.gy + .5, "+" + o.coins, "🪙");
  S.orders[i] = {wait:now() + 8000};
  sfx("truck"); sfx("coin");
  gainXP(o.xp);
  commit();
}
function discard(i) {
  S.orders[i] = {wait:now() + 45000};
  toast("Order removed. A new one arrives soon.");
  commit();
}

// ---------- barn / shop ----------
function sell(id, n) {
  n = Math.min(n, have(id));
  if (!n) return;
  take(id, n); S.coins += ITEMS[id].p * n; S.stats.earned += ITEMS[id].p * n; sfx("coin");
  toast("Sold " + n + " " + ITEMS[id].e + " for " + ITEMS[id].p * n + " 🪙");
  commit();
}
function upgradeBarn() {
  const c = barnCost();
  if (S.coins < c) return toast("Need " + c + " 🪙");
  S.coins -= c; S.barnUps++; S.barnCap += 25; sfx("build"); toast("Barn now holds " + S.barnCap); commit();
}
function buyPlot() {
  if (S.plots.length >= MAX_PLOTS) return false;
  const c = plotCost(), spot = nextPlotSpot();
  if (!spot) { toast("No room left. Move things around to make space."); sfx("error"); return false; }
  if (S.coins < c) { toast("Need " + c + " 🪙"); sfx("error"); return false; }
  S.coins -= c; S.plots.push({crop:null, end:0, gx:spot.gx, gy:spot.gy}); toast("New field ready!"); sfx("build"); commit();
  return true;
}
function buyBuilding(bid) {
  const b = BUILDINGS[bid];
  if (S.level < b.lvl || S.buildings[bid].owned) return false;
  if (S.coins < b.cost) { toast("Need " + b.cost + " 🪙"); return false; }
  S.coins -= b.cost; S.buildings[bid].owned = true; toast(b.n + " built!"); sfx("build"); fillOrders(); commit();
  return true;
}
function buyPen(kind) {
  const a = ANIMALS[kind];
  if (S.level < a.lvl || S.pens[kind].owned) return false;
  if (S.coins < a.penCost) { toast("Need " + a.penCost + " 🪙"); return false; }
  S.coins -= a.penCost; S.pens[kind].owned = true; S.pens[kind].list.push(0); sfx("build"); sfx(kind);
  toast(a.pen + " built, with your first " + a.n.toLowerCase() + "!"); fillOrders(); commit();
  return true;
}
function buyAnimal(kind) {
  const a = ANIMALS[kind], pen = S.pens[kind];
  if (!pen.owned || pen.list.length >= a.max) return false;
  if (S.coins < a.cost) { toast("Need " + a.cost + " 🪙"); return false; }
  S.coins -= a.cost; pen.list.push(0); sfx(kind); toast("A new " + a.n.toLowerCase() + " joined the farm!"); commit();
  return true;
}
function claimDaily() {
  if (S.lastDaily === today()) return;
  S.lastDaily = today();
  const c = 25 + 5 * S.level;
  S.coins += c; S.gems += 1;
  const g = giftPos(); fxAt(g.gx, g.gy, "+" + c, "🪙"); sfx("level");
  toast("🎁 Daily gift: +" + c + " 🪙  +1 💎"); commit();
}
function speedPlot(i) {
  const p = S.plots[i], left = p.end - now();
  if (!p.crop || left <= 0) return;
  const cost = gemCost(left);
  if (S.gems < cost) return toast("Not enough 💎");
  S.gems -= cost; p.end = now(); sfx("magic"); closeTray(); commit();
}

// ---------- roadside shop ----------
// Put items out with your own price. Townsfolk buy them over time: the higher the price, the longer it takes.
const standSlotCost = () => 150 * Math.pow(2, S.stand.slots - 4);
function priceRange(id, qty) {
  const base = ITEMS[id].p * qty;
  return {base, min:Math.max(1, Math.floor(base * .8)), max:Math.ceil(base * 1.6), step:Math.max(1, Math.round(base * .1))};
}
const saleSecs = (id, qty, price) => Math.round(20 + 200 * clamp((price / (ITEMS[id].p * qty) - .8) / .8, 0, 1));
function standList(slot, id, qty, price) {
  if (S.stand.list[slot] || have(id) < qty || qty < 1) return false;
  take(id, qty);
  S.stand.list[slot] = {id, qty, price, sellAt:now() + saleSecs(id, qty, price) * (800 + Math.random() * 400)};
  sfx("place"); commit();
  return true;
}
function standCollect(slot) {
  const L = S.stand.list[slot];
  if (!L || L.sellAt > now()) return false;
  S.coins += L.price; S.stats.earned += L.price; S.stand.list[slot] = null;
  const b = boxOf("stand"); fxAt(b.gx + 1, b.gy + 1, "+" + L.price, "🪙");
  return true;
}
function standCollectAll() {
  let n = 0;
  S.stand.list.forEach((_, j) => { if (standCollect(j)) n++; });
  if (n) { sfx("coin"); commit(); }
  return n;
}
function standCancel(slot) {
  const L = S.stand.list[slot];
  if (!L || L.sellAt <= now()) return;
  if (space() < L.qty) return barnFull();
  add(L.id, L.qty); S.stand.list[slot] = null; commit();
}
function buyStandSlot() {
  if (S.stand.slots >= STAND_MAX) return;
  const c = standSlotCost();
  if (S.coins < c) { toast("Need " + c + " 🪙"); sfx("error"); return; }
  S.coins -= c; S.stand.slots++; S.stand.list.push(null); sfx("build"); commit();
}

/* ============================================================
   THE FARM WORLD (canvas)
   ============================================================ */
const cv = $("#world"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1, zoom = 1, cam = {x:0, y:0}, camAnim = null;
const iso = (gx, gy) => [(gx - gy) * TW / 2, (gx + gy) * TH / 2];
const toWorld = (sx, sy) => [(sx - W / 2) / zoom + cam.x, (sy - H / 2) / zoom + cam.y];
const toScreen = (wx, wy) => [(wx - cam.x) * zoom + W / 2, (wy - cam.y) * zoom + H / 2];
const lerp = (p, q, k) => [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k];
const up = (p, h) => [p[0], p[1] - h];
function corners(gx, gy, w, h) { return [iso(gx, gy), iso(gx + w, gy), iso(gx + w, gy + h), iso(gx, gy + h)]; } // top, right, bottom, left

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
}
function clampCam() {
  cam.x = clamp(cam.x, -MAP_H * TW / 2 + 60, MAP_W * TW / 2 - 60);
  cam.y = clamp(cam.y, 40, (MAP_W + MAP_H) * TH / 2 - 40);
}
function focusOn(gx, gy) {
  const [x, y] = iso(gx, gy);
  camAnim = {fx:cam.x, fy:cam.y, tx:x, ty:y, t0:performance.now()};
}
function setZoom(z, sx = W / 2, sy = H / 2) {
  const [wx, wy] = toWorld(sx, sy);
  zoom = clamp(z, 0.45, 1.8);
  cam.x = wx - (sx - W / 2) / zoom; cam.y = wy - (sy - H / 2) / zoom;
  clampCam();
}

// --- small drawing helpers ---
function path(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
function fillPoly(pts, fill, stroke, lw = 1.5) {
  path(pts); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = "round"; ctx.stroke(); }
}
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
const FONT = '"Lilita One","Arial Rounded MT Bold",sans-serif';
function label(txt, x, y, size = 14, fill = "#fff", stroke = "#6E3D18") {
  ctx.font = size + "px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = Math.max(3, size / 3.5); ctx.strokeStyle = stroke; ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
// Emoji are pre-rendered once into little images; drawing text every frame is slow.
const emojiCache = new Map();
function emo(e, size) {
  const key = e + "|" + size;
  let c = emojiCache.get(key);
  if (!c) {
    c = document.createElement("canvas");
    const s = Math.ceil(size * 1.3) * 3;
    c.width = c.height = s;
    const x = c.getContext("2d");
    x.font = size * 3 + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(e, s / 2, s / 2 + size * 0.2);
    emojiCache.set(key, c);
  }
  return c;
}
function drawEmoji(e, x, y, size, flip) {
  const c = emo(e, size), w = c.width / 3;
  if (flip) { ctx.save(); ctx.translate(x, y); ctx.scale(-1, 1); ctx.drawImage(c, -w / 2, -w / 2, w, w); ctx.restore(); }
  else ctx.drawImage(c, x - w / 2, y - w / 2, w, w);
}

// --- scenery, generated once with a fixed seed so the farm always looks the same ---
function seeded(s) { return () => (s = (s * 16807) % 2147483647, (s - 1) / 2147483646); }
const SCENE = (() => {
  const R = seeded(7), trees = [], flowers = [], tufts = [], pebbles = [];
  const blocks = [LAYOUT.house, LAYOUT.barn, LAYOUT.stand, {gx:4, gy:3, w:3, h:5}, LAYOUT.pond,
    {gx:FIELD0.gx, gy:FIELD0.gy, w:FIELD_COLS, h:MAX_PLOTS / FIELD_COLS},
    ...Object.values(LAYOUT.buildings), ...Object.values(LAYOUT.pens)];
  const busy = (gx, gy) => gy < ROAD_H + 1 || blocks.some(r => gx >= r.gx - 1 && gx < r.gx + r.w + 1 && gy >= r.gy - 1 && gy < r.gy + r.h + 1);
  for (let gx = 0; gx < MAP_W; gx++) for (let gy = 0; gy < MAP_H; gy++) {
    const edge = gx === 0 || gx === MAP_W - 1 || gy === MAP_H - 1;
    if (!busy(gx, gy) && R() < (edge ? 0.8 : 0.05)) trees.push({gx:gx + .5 + (R() - .5) * .5, gy:gy + .5 + (R() - .5) * .5, s:.85 + R() * .4, pine:R() < .3});
    else if (!busy(gx, gy) && R() < 0.1) flowers.push({gx:gx + R(), gy:gy + R(), c:pick(["#fff", "#FFD34E", "#FF7BAC", "#B388FF", "#FF8A4C"])});
    if (R() < 0.3) tufts.push({gx:gx + R(), gy:gy + R()});
    if (gy < ROAD_H && R() < 0.35) pebbles.push({gx:gx + R(), gy:gy + R()});
  }
  return {trees, flowers, tufts, pebbles};
})();

// --- per-animal wandering (not saved, just for looks) ---
const anim = {};
function animFor(k, i) {
  const P = LAYOUT.pens[k];
  anim[k] = anim[k] || [];
  if (!anim[k][i]) {
    // positions are relative to the pen's corner, so animals come along when the pen is moved
    const r = () => ({x:.8 + Math.random() * (P.w - 1.6), y:.8 + Math.random() * (P.h - 1.6)});
    const a = r(), b = r();
    anim[k][i] = {x:a.x, y:a.y, tx:b.x, ty:b.y, rest:Math.random() * 2, flip:false, rand:r, walk:0};
  }
  return anim[k][i];
}
function animWorld(k, i) { const a = animFor(k, i), P = boxOf("p:" + k); return {x:P.gx + a.x, y:P.gy + a.y, a}; }
function updateAnimals(dt) {
  const t = now();
  for (const k of Object.keys(ANIMALS)) {
    const pen = S.pens[k];
    if (!pen.owned) continue;
    pen.list.forEach((end, i) => {
      const a = animFor(k, i);
      a.walk = 0;
      if (!(end > t)) return; // hungry or ready animals stand still
      if (a.rest > 0) { a.rest -= dt; return; }
      const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy), sp = 0.45 * dt;
      if (d < sp) { const n = a.rand(); a.tx = n.x; a.ty = n.y; a.rest = 1 + Math.random() * 3; return; }
      a.x += dx / d * sp; a.y += dy / d * sp; a.walk = 1;
      a.flip = (dx - dy) > 0; // moving right on screen
    });
  }
}

// --- people and a dog strolling along the road ---
const WALKERS = [{e:"🚶", sp:.8, off:0, lane:.6, dir:1}, {e:"🚶‍♀️", sp:.65, off:14, lane:1.45, dir:-1},
  {e:"🐕", sp:1.3, off:6, lane:.7, dir:1}, {e:"🚴", sp:2.1, off:22, lane:1.35, dir:-1}];
function walkerPos(w) {
  const s = ((T / 1000) * w.sp + w.off) % (MAP_W + 8);
  return {gx:w.dir > 0 ? s - 4 : MAP_W + 4 - s, gy:w.lane};
}

// --- floating "+2 🌾" rewards ---
const fx = [];
function fxAt(gx, gy, txt, e) { fx.push({gx, gy, txt, e, t0:performance.now()}); }

// --- hit areas, rebuilt each frame in draw order ---
let hits = [], nextHits = [];
function inPoly(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function hitAt(sx, sy) {
  const [x, y] = toWorld(sx, sy);
  for (let j = hits.length - 1; j >= 0; j--) {
    const h = hits[j];
    if (h.rect ? (x >= h.rect[0] && x <= h.rect[2] && y >= h.rect[1] && y <= h.rect[3]) : inPoly(x, y, h.poly)) return h;
  }
  return null;
}

// ---------- drawing the farm ----------
let T = 0; // animation clock (ms)
const bob = (speed = 1, amt = 3, phase = 0) => Math.sin(T / 260 * speed + phase) * amt;

function drawGround() {
  const [A, B, C, D] = corners(0, 0, MAP_W, MAP_H);
  // island cliff edges
  fillPoly([D, C, up(C, -34), up(D, -34)], "#9A6A40");
  fillPoly([C, B, up(B, -34), up(C, -34)], "#7A5030");
  fillPoly([D, C, up(C, -8), up(D, -8)], "#6FA82F");
  fillPoly([C, B, up(B, -8), up(C, -8)], "#5E962A");
  fillPoly([A, B, C, D], "#8DC63F");
  // checkerboard shading, drawn as one path so it's quick
  ctx.beginPath();
  for (let gx = 0; gx < MAP_W; gx++) for (let gy = ROAD_H; gy < MAP_H; gy++) if ((gx + gy) & 1) {
    const [a, b, c, d] = corners(gx, gy, 1, 1);
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath();
  }
  ctx.fillStyle = "#87C03B"; ctx.fill();
  // grass tufts
  ctx.strokeStyle = "#6FA82F"; ctx.lineWidth = 1.6; ctx.lineCap = "round"; ctx.beginPath();
  for (const t of SCENE.tufts) { if (t.gy < ROAD_H) continue; const [x, y] = iso(t.gx, t.gy); ctx.moveTo(x - 3, y - 4); ctx.lineTo(x, y); ctx.lineTo(x + 3, y - 5); }
  ctx.stroke();
  // dirt road with the truck on it
  fillPoly(corners(0, 0, MAP_W, ROAD_H), "#DDBE80");
  fillPoly(corners(0, 0.8, MAP_W, 0.4), "#E8CE96");
  ctx.fillStyle = "#C4A266";
  for (const p of SCENE.pebbles) { const [x, y] = iso(p.gx, p.gy); ctx.beginPath(); ctx.ellipse(x, y, 2.5, 1.4, 0, 0, 7); ctx.fill(); }
  ctx.strokeStyle = "#B99355"; ctx.lineWidth = 3; ctx.beginPath();
  const r1 = iso(0, ROAD_H), r2 = iso(MAP_W, ROAD_H); ctx.moveTo(r1[0], r1[1]); ctx.lineTo(r2[0], r2[1]); ctx.stroke();
  // flowers
  for (const f of SCENE.flowers) {
    const [x, y] = iso(f.gx, f.gy);
    circle(x - 3, y, 2.2, f.c); circle(x + 3, y - 1, 2.2, f.c); circle(x, y + 2, 2.2, f.c); circle(x, y, 1.2, "#F5B82E");
  }
  drawPond();
}

function drawPond() {
  const P = LAYOUT.pond, [a, b, c, d] = corners(P.gx, P.gy, P.w, P.h);
  const m = (p, q) => lerp(p, q, .5);
  const blob = () => {
    ctx.beginPath(); const s = m(d, a); ctx.moveTo(s[0], s[1]);
    ctx.quadraticCurveTo(a[0], a[1], ...m(a, b)); ctx.quadraticCurveTo(b[0], b[1], ...m(b, c));
    ctx.quadraticCurveTo(c[0], c[1], ...m(c, d)); ctx.quadraticCurveTo(d[0], d[1], ...s); ctx.closePath();
  };
  blob(); ctx.strokeStyle = "#E9D9A6"; ctx.lineWidth = 12; ctx.stroke();
  ctx.fillStyle = "#4FA9DA"; ctx.fill();
  ctx.save(); blob(); ctx.clip();
  ellipse(...m(a, c), 60, 22, "#5DB8E6");
  ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) { const [x, y] = lerp(a, c, .3 + k * .2); ctx.beginPath(); ctx.moveTo(x - 14 + bob(.5, 4, k), y); ctx.lineTo(x + 6 + bob(.5, 4, k), y); ctx.stroke(); }
  ctx.restore();
  ellipse(...lerp(d, b, .3), 9, 4.5, "#5BAE3A"); ellipse(...lerp(a, c, .72), 7, 3.5, "#5BAE3A");
  // two ducks paddling around
  const cx = m(a, c);
  for (let k = 0; k < 2; k++) {
    const ang = T / 4000 + k * Math.PI;
    drawEmoji("🦆", cx[0] + Math.cos(ang) * 38, cx[1] + Math.sin(ang) * 14 - 8, 20, Math.sin(ang) < 0);
  }
}

function drawField(i) {
  const p = S.plots[i], {gx, gy} = plotPos(i), ins = .06;
  const [a, b, c, d] = corners(gx + ins, gy + ins, 1 - 2 * ins, 1 - 2 * ins);
  fillPoly([d, c, b, up(b, -5), up(c, -5), up(d, -5)], "#5C3A20");
  fillPoly([a, b, c, d], p.crop ? "#7E5230" : "#A0703F");
  ctx.strokeStyle = "rgba(60,35,15,.35)"; ctx.lineWidth = 2; ctx.beginPath();
  for (const k of [.25, .5, .75]) { const s = lerp(a, d, k), e = lerp(b, c, k); ctx.moveTo(s[0], s[1]); ctx.lineTo(e[0], e[1]); }
  ctx.stroke();
  nextHits.push({type:"field", i, poly:[a, b, c, d], mv:"f:" + i});
}

const growStage = (prog) => prog < .15 ? 0 : prog < .45 ? 1 : prog < .8 ? 2 : 3;
const STAGE_NAMES = ["Just planted", "Sprouting", "Growing", "Almost ready"];

function drawCrops(i) {
  const p = S.plots[i];
  if (!p.crop) return;
  const {gx, gy} = plotPos(i), t = now();
  const ready = p.end <= t, prog = ready ? 1 : clamp(1 - (p.end - t) / (CROPS[p.crop].time * 1000), 0, 1);
  const spots = [[.3, .3], [.7, .3], [.3, .7], [.7, .7]];
  spots.forEach(([u, v], k) => {
    const [x, y] = iso(gx + u, gy + v);
    if (!ready && prog < .15) { // seeds in little mounds
      ellipse(x, y, 5, 2.5, "#6A4125"); circle(x - 1, y - 1, 1.3, "#E8D08A");
      return;
    }
    const g = ready ? 1 : (prog - .15) / .85;
    const top = drawPlant(LOOK[p.crop], x, y, g, ready, k);
    if (ready) drawEmoji(ITEMS[p.crop].e, x, top + bob(1.3, 1.5, k * 2), p.crop === "pumpkin" ? 20 : 16);
  });
}

// Draws one plant at (x, y). g is how grown it is (0..1). Returns where the produce sits.
function drawPlant(look, x, y, g, ripe, k) {
  const sway = Math.sin(T / 700 + k + x * .05) * g * 1.2;
  const stroke = (col, w) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round"; };
  const leaf = (lx, ly, rx, ry, rot, col) => { ctx.beginPath(); ctx.ellipse(lx, ly, rx, ry, rot, 0, 7); ctx.fillStyle = col; ctx.fill(); };
  switch (look) {
    case "grain": {
      const h = 5 + g * 15, col = ripe ? "#E2B93B" : g > .7 ? "#A9C94B" : "#6DB33F";
      stroke(col, 1.7); ctx.beginPath();
      for (const o of [-4, -2, 0, 2, 4]) { ctx.moveTo(x + o * .3, y); ctx.lineTo(x + o + sway, y - h + Math.abs(o) * .8); }
      ctx.stroke();
      if (g > .6) for (const o of [-4, 0, 4]) leaf(x + o + sway, y - h + Math.abs(o) * .8 - 2, 1.6, 3.5, o * .1, ripe ? "#F2CF5B" : "#C4D86A");
      return y - h - 6;
    }
    case "stalk": {
      const h = 6 + g * 24;
      stroke("#4E9A2E", 2.6); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + sway, y - h); ctx.stroke();
      for (let j = 1; j <= 3; j++) if (g * 3 >= j - .6) { const side = j % 2 ? 1 : -1; leaf(x + side * 5 + sway * j / 3, y - h * j / 4, 6, 1.8, side * .5, "#62B33E"); }
      if (g > .75) leaf(x + sway, y - h - 2, 1.5, 4, 0, "#D9C15A");
      return y - h * .6;
    }
    case "cane": {
      const h = 6 + g * 24;
      for (const o of [-4, 0, 4]) {
        const hh = h * (o ? .85 : 1);
        stroke(ripe ? "#A8C24A" : "#7DBB3A", 2.4); ctx.beginPath(); ctx.moveTo(x + o, y); ctx.lineTo(x + o + sway, y - hh); ctx.stroke();
        stroke("#4F8A2A", 1); ctx.beginPath();
        for (let q = 1; q < 4; q++) { const yy = y - hh * q / 4; ctx.moveTo(x + o - 1.4, yy); ctx.lineTo(x + o + 1.4, yy); }
        ctx.stroke();
        if (g > .5) leaf(x + o + 3 + sway, y - hh + 2, 4, 1.3, .6, "#62B33E");
      }
      return y - h * .7;
    }
    case "leafy": {
      const L = 3 + g * 11;
      if (g > .7) fillPoly([[x - 3, y], [x + 3, y], [x, y + 3]], "#F08A2A");
      stroke("#3F9A34", 1.5); ctx.beginPath();
      for (const a of [-1, -.5, 0, .5, 1]) { ctx.moveTo(x, y); ctx.lineTo(x + a * L * .6 + sway, y - L * (1 - Math.abs(a) * .3)); }
      ctx.stroke();
      for (const a of [-1, 0, 1]) leaf(x + a * L * .6 + sway, y - L * (1 - Math.abs(a) * .3), 2.2, 1.4, a, "#5DB84A");
      return y - L - 3;
    }
    case "bush": {
      const r = 2.5 + g * 6.5;
      circle(x - r * .5, y - r * .8, r * .8, "#3F8A2B"); circle(x + r * .5, y - r * .8, r * .8, "#3F8A2B");
      circle(x, y - r * 1.3, r * .9, "#4E9E35"); circle(x - r * .3, y - r * 1.5, r * .35, "#78C552");
      if (g > .75 && !ripe) { circle(x - r * .4, y - r, 1.6, "#fff"); circle(x + r * .5, y - r * 1.4, 1.6, "#fff"); }
      return y - r * 1.4;
    }
    case "low": {
      const r = 1.8 + g * 3.8;
      for (const [dx, dy] of [[-4, 0], [4, 0], [0, -3]]) circle(x + dx * g, y + dy * g - r * .6, r, "#4E9E35");
      circle(x, y - r * 1.3, r * .5, "#78C552");
      if (g > .6 && !ripe) for (const dx of [-3, 3]) { circle(x + dx, y - r * 1.4, 1.8, "#fff"); circle(x + dx, y - r * 1.4, .8, "#F5C518"); }
      return y - r - 4;
    }
    case "vine": {
      const s = .4 + g * .9;
      stroke("#4E9A2E", 1.5); ctx.beginPath(); ctx.moveTo(x - 8 * s, y); ctx.bezierCurveTo(x - 3 * s, y - 7 * s, x + 3 * s, y + 4 * s, x + 8 * s, y - 2 * s); ctx.stroke();
      for (const [dx, dy] of [[-6, -2], [0, -1], [6, -4]]) circle(x + dx * s, y + dy * s - 2, 3.2 * s + 1, "#4E9E35");
      if (g > .7 && !ripe) { circle(x + 2, y - 7, 2.4, "#F5C518"); circle(x + 2, y - 7, 1, "#E48A1A"); }
      return y - 6;
    }
  }
  return y - 10;
}

function drawSaleSign(spot) {
  if (S.plots.length >= MAX_PLOTS || !spot) return;
  const {gx, gy} = spot;
  const [a, b, c, d] = corners(gx + .06, gy + .06, .88, .88);
  path([a, b, c, d]); ctx.setLineDash([5, 4]); ctx.strokeStyle = "rgba(90,52,19,.55)"; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
  const [x, y] = iso(gx + .5, gy + .5);
  drawSign(x, y + 6, plotCost() + "", "🪙");
  nextHits.push({type:"sale", poly:[a, b, c, d]});
}

function drawSign(x, y, text, icon, color = "#C98B4A") {
  ctx.fillStyle = "#7A4B25"; ctx.fillRect(x - 2.5, y - 30, 5, 30);
  const w = 28 + text.length * 8;
  rrect(x - w / 2, y - 52, w, 24, 6); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = "#6E3D18"; ctx.lineWidth = 2; ctx.stroke();
  if (icon) { drawEmoji(icon, x - w / 2 + 12, y - 40, 13); label(text, x + 7, y - 40, 14); }
  else label(text, x, y - 40, 14);
}

// Draws a little cartoon building with a pitched roof on a w×h tile footprint.
function drawHouse(box, st) {
  const ins = .28, x0 = box.gx + ins, y0 = box.gy + ins, x1 = box.gx + box.w - ins, y1 = box.gy + box.h - ins;
  const A = iso(x0, y0), B = iso(x1, y0), C = iso(x1, y1), D = iso(x0, y1);
  const Hh = 18 * box.w - 10, R = 12 * box.w;
  const ol = "rgba(70,35,10,.45)";
  fillPoly([iso(x0 - .1, y0 + .1), iso(x1 + .15, y0 + .1), iso(x1 + .15, y1 + .3), iso(x0 - .1, y1 + .3)], "rgba(0,0,0,.14)");
  // walls
  fillPoly([D, C, up(C, Hh), up(D, Hh)], st.wl, ol);
  const R1 = up(lerp(up(C, Hh), up(B, Hh), .5), R), R0 = up(lerp(up(D, Hh), up(A, Hh), .5), R);
  fillPoly([C, B, up(B, Hh), R1, up(C, Hh)], st.wr, ol);
  // door and windows on the front wall
  const door = (k0, k1, hk, col) => { const p = lerp(D, C, k0), q = lerp(D, C, k1); const pts = [p, q, up(q, Hh * hk), up(p, Hh * hk)]; fillPoly(pts, col, ol); return pts; };
  if (st.barn) {
    const pts = door(.3, .7, .72, st.door);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; path(pts); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(...pts[0]); ctx.lineTo(...pts[2]); ctx.moveTo(...pts[1]); ctx.lineTo(...pts[3]); ctx.stroke();
  } else {
    door(.42, .58, .55, st.door);
    for (const k of [.18, .72]) { const p = up(lerp(D, C, k), Hh * .42), q = up(lerp(D, C, k + .1), Hh * .42); fillPoly([p, q, up(q, Hh * .3), up(p, Hh * .3)], "#BFE6FA", "#fff", 2); }
  }
  const wp = up(lerp(C, B, .35), Hh * .4), wq = up(lerp(C, B, .6), Hh * .4);
  fillPoly([wp, wq, up(wq, Hh * .32), up(wp, Hh * .32)], "#BFE6FA", "#fff", 2);
  // roof
  const e = 5;
  fillPoly([up(A, Hh), up(B, Hh), R1, R0], st.rb, ol);
  fillPoly([up([D[0] - e, D[1] + 2], Hh), up([C[0], C[1] + e], Hh), up(R1, -1), up(R0, -1)], st.rf, ol, 2);
  ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 2; ctx.beginPath();
  for (const k of [.33, .66]) { const s = lerp(up(D, Hh), R0, k), t = lerp(up(C, Hh), R1, k); ctx.moveTo(...s); ctx.lineTo(...t); }
  ctx.stroke();
  if (st.chimney) {
    const base = lerp(lerp(R0, R1, .25), lerp(up(D, Hh), up(C, Hh), .25), .4);
    fillPoly([[base[0] - 6, base[1] + 4], [base[0] + 6, base[1] + 4], [base[0] + 6, base[1] - 16], [base[0] - 6, base[1] - 16]], "#B5533C", ol);
    fillPoly([[base[0] - 8, base[1] - 16], [base[0] + 8, base[1] - 16], [base[0] + 8, base[1] - 20], [base[0] - 8, base[1] - 20]], "#8E3E2B");
    if (st.smoke) for (let k = 0; k < 3; k++) {
      const ph = ((T / 1400) + k / 3) % 1;
      circle(base[0] + Math.sin(ph * 6 + k) * 4, base[1] - 24 - ph * 30, 4 + ph * 6, `rgba(235,235,235,${.7 * (1 - ph)})`);
    }
  }
  // round sign on the gable
  const g = [(C[0] + B[0] + R1[0] * 2) / 4, (C[1] + B[1] - Hh * 2 + R1[1] * 2) / 4 + 2];
  circle(g[0], g[1], 12, "#fff"); ctx.strokeStyle = "#8A5530"; ctx.lineWidth = 2; ctx.stroke();
  drawEmoji(st.sign, g[0], g[1], 15);
  const top = Math.min(R0[1], R1[1]);
  return {rect:[D[0] - 4, top - 30, B[0] + 4, C[1] + 6], cx:(D[0] + B[0]) / 2, top};
}

function drawBuilding(bid) {
  const box = boxOf("b:" + bid), b = BUILDINGS[bid], st = S.buildings[bid], t = now();
  if (!st.owned) {
    const [a, bb, c, d] = corners(box.gx + .3, box.gy + .3, box.w - .6, box.h - .6);
    fillPoly([a, bb, c, d], "rgba(170,120,60,.35)");
    path([a, bb, c, d]); ctx.setLineDash([6, 5]); ctx.strokeStyle = "rgba(90,52,19,.5)"; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
    const [x, y] = iso(box.gx + box.w / 2, box.gy + box.h / 2);
    drawEmoji(b.e, x - 34, y + 6, 26);
    if (S.level >= b.lvl) drawSign(x, y + 14, b.cost + "", "🪙", "#6DB23E");
    else drawSign(x, y + 14, "Lv " + b.lvl, "🔒");
    nextHits.push({type:"lot", bid, poly:[a, bb, c, d]});
    return;
  }
  const running = st.jobs.find(j => j.end > t), done = st.jobs.filter(j => j.end <= t);
  const r = drawHouse(box, Object.assign({smoke:!!running}, STYLE[bid]));
  if (done.length) {
    const y = r.top - 18 + bob(1.2, 3);
    circle(r.cx, y, 17, "rgba(255,255,255,.95)"); ctx.strokeStyle = "#6CC04A"; ctx.lineWidth = 3; ctx.stroke();
    drawEmoji(ITEMS[done[0].r].e, r.cx, y, 20);
    if (done.length > 1) { circle(r.cx + 14, y - 12, 9, "#6CC04A"); label(done.length + "", r.cx + 14, y - 12, 12, "#fff", "#3E8E24"); }
  } else if (running) {
    const k = clamp(1 - (running.end - t) / running.dur, 0, 1);
    rrect(r.cx - 26, r.top - 20, 52, 10, 5); ctx.fillStyle = "rgba(70,35,10,.6)"; ctx.fill();
    rrect(r.cx - 24, r.top - 18, 48 * k, 6, 3); ctx.fillStyle = "#8BDA60"; ctx.fill();
    drawEmoji(ITEMS[running.r].e, r.cx - 34, r.top - 15, 14);
  }
  nextHits.push({type:"building", bid, rect:r.rect, mv:"b:" + bid});
}

function drawFence(p, q) {
  const n = Math.max(2, Math.round(Math.hypot(q[0] - p[0], q[1] - p[1]) / 16));
  ctx.strokeStyle = "#B57A42"; ctx.lineWidth = 2.5; ctx.beginPath();
  for (const h of [5, 11]) { ctx.moveTo(p[0], p[1] - h); ctx.lineTo(q[0], q[1] - h); }
  ctx.stroke();
  for (let k = 0; k <= n; k++) {
    const [x, y] = lerp(p, q, k / n);
    ctx.fillStyle = "#8B5A2B"; ctx.fillRect(x - 2, y - 15, 4, 16);
    ctx.fillStyle = "#C28A52"; ctx.fillRect(x - 2, y - 16, 4, 2);
  }
}

function drawPen(k) {
  const P = boxOf("p:" + k), a = ANIMALS[k], pen = S.pens[k], t = now();
  const [A, B, C, D] = corners(P.gx + .15, P.gy + .15, P.w - .3, P.h - .3);
  if (!pen.owned) {
    fillPoly([A, B, C, D], "rgba(170,120,60,.25)");
    path([A, B, C, D]); ctx.setLineDash([6, 5]); ctx.strokeStyle = "rgba(90,52,19,.5)"; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
    const [x, y] = iso(P.gx + P.w / 2, P.gy + P.h / 2);
    drawEmoji(a.e, x - 36, y + 8, 28);
    if (S.level >= a.lvl) drawSign(x, y + 16, a.penCost + "", "🪙", "#6DB23E");
    else drawSign(x, y + 16, "Lv " + a.lvl, "🔒");
    nextHits.push({type:"penLot", k, poly:[A, B, C, D]});
    return;
  }
  fillPoly([A, B, C, D], PEN_GROUND[k]);
  // a feed trough in the back corner
  const tr = corners(P.gx + .4, P.gy + .4, 1, .45);
  fillPoly(tr.map(p => up(p, 6)), "#9A6A40", "rgba(70,35,10,.4)");
  fillPoly(corners(P.gx + .5, P.gy + .47, .8, .3).map(p => up(p, 7)), have(a.feed) ? "#E8C55A" : "#6E4527");
  drawFence(A, B); drawFence(D, A);
  nextHits.push({type:"pen", k, poly:[A, B, C, D], mv:"p:" + k});
  const order = pen.list.map((end, i) => i).sort((i, j) => { const p = animFor(k, i), q = animFor(k, j); return p.x + p.y - q.x - q.y; });
  for (const i of order) {
    const end = pen.list[i], w = animWorld(k, i), an = w.a, [x, y] = iso(w.x, w.y);
    ellipse(x, y, a.size * .45, a.size * .17, "rgba(0,0,0,.18)");
    const hop = an.walk ? Math.abs(Math.sin(T / 110 + i)) * 3 : 0;
    drawEmoji(a.e, x, y - a.size * .42 - hop, a.size, an.flip);
    if (end === 0) {
      circle(x + 8, y - a.size - 2, 2.5, "#fff"); circle(x + 12, y - a.size - 8, 3.5, "#fff");
      circle(x + 18, y - a.size - 20, 11, "#fff"); drawEmoji(ITEMS[a.feed].e, x + 18, y - a.size - 20, 12);
    } else if (end <= t) {
      const by = y - a.size - 14 + bob(1.4, 3, i);
      circle(x, by, 13, "rgba(255,255,255,.9)"); drawEmoji(ITEMS[a.out].e, x, by, 18);
    }
    nextHits.push({type:"animal", k, i, rect:[x - 18, y - a.size - 28, x + 18, y + 6], mv:"p:" + k});
  }
  drawFence(D, C); drawFence(C, B);
  drawSign(...iso(P.gx + P.w - .2, P.gy + P.h + .1), pen.list.length + "/" + a.max, a.e);
}

function drawTree(tr) {
  const [x, y] = iso(tr.gx, tr.gy), s = tr.s;
  ellipse(x + 4, y, 17 * s, 7 * s, "rgba(0,0,0,.16)");
  ctx.fillStyle = "#7B4F2A"; ctx.fillRect(x - 3 * s, y - 16 * s, 6 * s, 16 * s);
  if (tr.pine) {
    for (let k = 0; k < 3; k++) {
      const w = (19 - k * 4) * s, yy = y - (14 + k * 11) * s;
      fillPoly([[x - w, yy], [x + w, yy], [x, yy - 20 * s]], k % 2 ? "#3C8431" : "#347A2B");
    }
    return;
  }
  circle(x, y - 30 * s, 17 * s, "#3F8A2B"); circle(x - 10 * s, y - 23 * s, 12 * s, "#3F8A2B"); circle(x + 10 * s, y - 24 * s, 12 * s, "#3F8A2B");
  circle(x - 4 * s, y - 34 * s, 11 * s, "#57A83A"); circle(x + 6 * s, y - 27 * s, 8 * s, "#57A83A"); circle(x - 7 * s, y - 38 * s, 4 * s, "#86CF58");
}
