name: Sunny Acres art candidate
on:
  pull_request:
    paths:
      - 'farm3d/assets/**'
      - 'farm3d/tools/build-barn.mjs'
      - 'farm3d/tools/build-hands.py'
      - 'farm3d/tools/capture-hands-study.cjs'
      - 'farm3d/tools/capture-hands-game.cjs'
      - 'farm3d/tools/capture-barn-scene.cjs'
      - 'farm3d/tools/capture-cow-b1.cjs'
      - 'farm3d/evidence/cow-b1/**'
      - 'farm3d/art/COW_RECONSTRUCTION.md'
      - 'farm3d/lib/addons/loaders/**'
      - 'farm3d/lib/addons/utils/**'
      - 'farm3d/tests/barn-candidate.browser.cjs'
      - 'farm3d/tests/barn-scene.browser.cjs'
      - 'farm3d/tests/barn-validator.cjs'
      - 'farm3d/tests/hands-validator.cjs'
      - 'farm3d/tests/authored-hands.browser.cjs'
      - 'farm3d/tests/hands-production.browser.cjs'
      - 'farm3d/index.html'
      - 'farm3d/sw.js'
      - 'farm3d/tests/package*.json'
      - 'farm3d/art/barn-scene-candidate.js'
      - 'farm3d/art/authored-hands.js'
      - '.github/workflows/farm3d-art-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cow-b1-reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: farm3d/tests
      - run: npx playwright install --with-deps chromium
        working-directory: farm3d/tests
      - name: Verify proposed B1 envelope against frozen cow and capture matched references
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/cow-b1-reference"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/cow-b1-reference/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tools/capture-cow-b1.cjs'
      - name: Validate and project exact execution receipts
        id: public_receipts
        if: always()
        env:
          A52_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "farm3d/tests/helpers/a52-workflow-receipts.cjs" && test ! -L "farm3d/tests/helpers/a52-workflow-receipts.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = 2649609bb7a6127c32df3af25f9b11a00e428743b1f2dfc48a2ba745cda40919
          test -f "farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "farm3d/tests/helpers/a52-workflow-receipts.cjs" farm3d-art-candidate/cow-b1-reference "$RUNNER_TEMP/a52-ci-safe/cow-b1-reference" "$RUNNER_TEMP/a52-ci-public/cow-b1-reference" "$A52_CANDIDATE_HEAD"
      - name: Preserve execution receipts
        if: ${{ (always()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: cow-b1-reference-${{ github.run_attempt }}-execution-receipts-only
          path: ${{ runner.temp }}/a52-ci-public/cow-b1-reference/
          retention-days: 14
  barn-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: farm3d/tests
      - run: npx playwright install --with-deps chromium
        working-directory: farm3d/tests
      - name: Verify deterministic export and asset policy
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/barn-candidate"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/barn-candidate/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tools/build-barn.mjs
          git diff --exit-code -- farm3d/assets/barn/barn-candidate.glb
          node farm3d/tools/validate-asset.mjs farm3d/assets/barn/barn-candidate.glb farm3d/art/asset-contract.json barn-lod0
          node farm3d/tests/barn-validator.cjs
          '
      - name: Capture real scene and verify load/disposal
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/barn-candidate"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/barn-candidate/step-2.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/barn-candidate.browser.cjs'
      - name: Verify scene ownership, grass restoration and repeated disposal
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/barn-candidate"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/barn-candidate/step-3.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/barn-scene.browser.cjs'
      - name: Capture matched overview and Walk at full CSS drawing resolution
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/barn-candidate"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/barn-candidate/step-4.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tools/capture-barn-scene.cjs'
      - name: Validate and project exact execution receipts
        id: public_receipts
        if: always()
        env:
          A52_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "farm3d/tests/helpers/a52-workflow-receipts.cjs" && test ! -L "farm3d/tests/helpers/a52-workflow-receipts.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = 2649609bb7a6127c32df3af25f9b11a00e428743b1f2dfc48a2ba745cda40919
          test -f "farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "farm3d/tests/helpers/a52-workflow-receipts.cjs" farm3d-art-candidate/barn-candidate "$RUNNER_TEMP/a52-ci-safe/barn-candidate" "$RUNNER_TEMP/a52-ci-public/barn-candidate" "$A52_CANDIDATE_HEAD"
      - name: Preserve execution receipts
        if: ${{ (always()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: barn-candidate-${{ github.run_attempt }}-execution-receipts-only
          path: ${{ runner.temp }}/a52-ci-public/barn-candidate/
          retention-days: 14
  authored-hands:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
