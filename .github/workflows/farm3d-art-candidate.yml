name: Sunny Acres art candidate
on:
  pull_request:
    paths:
      - 'farm3d/assets/**'
      - 'farm3d/tools/build-barn.mjs'
      - 'farm3d/tools/build-hands.py'
      - 'farm3d/tools/capture-hands-study.cjs'
      - 'farm3d/tools/capture-hands-game.cjs'
      - 'farm3d/tools/capture-barn-scene.cjs'
      - 'farm3d/tools/capture-cow-b1.cjs'
      - 'farm3d/evidence/cow-b1/**'
      - 'farm3d/art/COW_RECONSTRUCTION.md'
      - 'farm3d/lib/addons/loaders/**'
      - 'farm3d/lib/addons/utils/**'
      - 'farm3d/tests/barn-candidate.browser.cjs'
      - 'farm3d/tests/barn-scene.browser.cjs'
      - 'farm3d/tests/barn-validator.cjs'
      - 'farm3d/tests/hands-validator.cjs'
      - 'farm3d/tests/authored-hands.browser.cjs'
      - 'farm3d/tests/hands-production.browser.cjs'
      - 'farm3d/index.html'
      - 'farm3d/sw.js'
      - 'farm3d/tests/package*.json'
      - 'farm3d/art/barn-scene-candidate.js'
      - 'farm3d/art/authored-hands.js'
      - '.github/workflows/farm3d-art-candidate.yml'
  workflow_dispatch:
    inputs:
      diagnostic_set:
        description: Existing art checks or one original chicken-care timing attempt
        type: choice
        required: true
        default: art
        options: [art, chicken-care-timing]
permissions:
  contents: read
jobs:
  cow-b1-reference:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic_set != 'chicken-care-timing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: farm3d/tests
      - run: npx playwright install --with-deps chromium
        working-directory: farm3d/tests
      - name: Verify proposed B1 envelope against frozen cow and capture matched references
        run: node farm3d/tools/capture-cow-b1.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cow-b1-reference-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/cow-b1/
          retention-days: 14
  barn-candidate:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic_set != 'chicken-care-timing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: farm3d/tests
      - run: npx playwright install --with-deps chromium
        working-directory: farm3d/tests
      - name: Verify deterministic export and asset policy
        run: |
          node farm3d/tools/build-barn.mjs
          git diff --exit-code -- farm3d/assets/barn/barn-candidate.glb
          node farm3d/tools/validate-asset.mjs farm3d/assets/barn/barn-candidate.glb farm3d/art/asset-contract.json barn-lod0
          node farm3d/tests/barn-validator.cjs
      - name: Capture real scene and verify load/disposal
        run: node farm3d/tests/barn-candidate.browser.cjs
      - name: Verify scene ownership, grass restoration and repeated disposal
        run: node farm3d/tests/barn-scene.browser.cjs
      - name: Capture matched overview and Walk at full CSS drawing resolution
        run: node farm3d/tools/capture-barn-scene.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: barn-candidate-${{ github.run_attempt }}
          path: |
            farm3d/tests/artifacts/barn*
          retention-days: 14
  authored-hands:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic_set != 'chicken-care-timing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: farm3d/tests
      - run: node browser-install-diagnostic.cjs
        env:
          INSTALL_RECEIPT: artifacts/authored-hands/browser-install.json
        working-directory: farm3d/tests
      - name: Validate the actual authored hand export and bone clips
        run: |
          node farm3d/tools/validate-asset.mjs farm3d/assets/hands/hands-candidate.glb farm3d/art/asset-contract.json hands
          node farm3d/tests/hands-validator.cjs
      - name: Capture all hand clips and verify clone ownership and cleanup
        run: node farm3d/tools/capture-hands-study.cjs
      - name: Verify the authored hand adapter in the isolated game
        run: node farm3d/tests/authored-hands.browser.cjs
      - name: Verify normal farms, load failures and actual offline cache migration
        run: node farm3d/tests/hands-production.browser.cjs
      - name: Capture full-resolution authored hands in the real farm
        run: node farm3d/tools/capture-hands-game.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: authored-hands-${{ github.run_attempt }}
          path: |
            farm3d/tests/artifacts/hands-study/
            farm3d/tests/artifacts/hands-game-captures/
            farm3d/tests/artifacts/authored-hands*
            farm3d/tests/artifacts/hands-production*
          retention-days: 14
      - name: Preserve sanitized hand installation timing only
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: authored-hands-timing-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/authored-hands/browser-install.json
          if-no-files-found: warn
          retention-days: 7

  chicken-care-timing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_set == 'chicken-care-timing' }}
    name: Original chicken care with sanitized timing (one attempt)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Fetch immutable base for real installed-worker update
        run: git fetch --depth 1 https://github.com/pederaus9-ux/Bugsy.git 756df378e7adbe20f34c204dc54172b1030e16bd
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: node browser-install-diagnostic.cjs
        env:
          INSTALL_RECEIPT: artifacts/chicken-pen/browser-install.json
      - name: Chicken care and interaction contracts
        id: chicken-contracts
        working-directory: farm3d/tests
        run: node --test chicken-pet-view.test.mjs chicken-care.test.mjs chicken-care-integration.test.mjs chicken-yard.test.mjs chicken-yard-interaction.test.mjs
      - name: Chicken stations and native touch
        working-directory: farm3d/tests
        run: node chicken-pen.browser.cjs
      - name: Preserve actual frames, videos, partial results and failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-chicken-pen-${{ github.run_attempt }}
          path: |
            farm3d/tests/artifacts/chicken-pen/
            farm3d/tests/artifacts/chicken-pen-update/
            farm3d/tests/artifacts/chicken-*.png
            farm3d/tests/artifacts/chicken-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Preserve sanitized installation and stage timing only
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: chicken-pen-timing-${{ github.run_attempt }}
          path: |
            farm3d/tests/artifacts/chicken-pen/browser-install.json
            farm3d/tests/artifacts/chicken-pen/timing.json
          if-no-files-found: warn
          retention-days: 7
