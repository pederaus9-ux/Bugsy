name: Sunny Acres exact-command companion evidence
on:
  push:
    branches: ['codex/a52-two-corner-ui-20261117']
permissions:
  contents: read
concurrency:
  group: a52-release-companion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  all_conflicts:
    name: "[all] Same-account conflicting saves (emulator)"
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/codex/a52-two-corner-ui-20261117' && ('workflow_dispatch' != 'workflow_dispatch' || 'all' == 'all') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/firebase/package-lock.json
      - name: Install isolated emulator and pinned browser dependencies
        working-directory: farm3d/firebase
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/firebase
        run: npx playwright install --with-deps chromium
      - name: Prepare exact Firebase emulator binaries without project execution
        run: node farm3d/tests/helpers/a52-emulator-bootstrap.cjs auth
      - name: Preserve both farms through stale-upload refusal and user choices
        working-directory: farm3d/firebase
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/conflicts"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/conflicts/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'npm run test:conflicts'
      - name: Validate and project exact execution receipts
        id: public_receipts
        if: ${{ !cancelled() }}
        env:
          A52_CANDIDATE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "farm3d/tests/helpers/a52-workflow-receipts.cjs" && test ! -L "farm3d/tests/helpers/a52-workflow-receipts.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = d391090a2ddcea94b72fb71ca5af2fb64a790577fee95294d6a7d8c9ca29dc4c
          test -f "farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "farm3d/tests/helpers/a52-workflow-receipts.cjs" farm3d-release-qualification/conflicts "$RUNNER_TEMP/a52-ci-safe/conflicts" "$RUNNER_TEMP/a52-ci-public/conflicts" "$A52_CANDIDATE_HEAD"
      - name: Save conflicting-save state, requests and failure evidence
        if: ${{ (!cancelled()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: companion-all-farm3d-release-conflicts-${{ github.run_attempt }}-execution-receipts-only
          path: ${{ runner.temp }}/a52-ci-public/conflicts/
          if-no-files-found: error
          retention-days: 14
  all_pen_cache:
    name: "[all] Targeted pen, restore guards and installed cache transitions"
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/codex/a52-two-corner-ui-20261117' && ('workflow_dispatch' == 'workflow_dispatch' && 'all' != 'affected-recovery' && 'all' != 'a35-fixtures-integrity') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch and verify immutable v74 input (A38 only)
        if: ${{ 'all' == 'a38-cache-only' }}
        run: |
          git fetch --no-tags --depth=1 origin 4e91a6628bb53b709b5ef643551651a44180ab94
          test "$(git rev-parse FETCH_HEAD)" = "4e91a6628bb53b709b5ef643551651a44180ab94"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/firebase/package-lock.json
      - name: Record exact source
        run: |
          mkdir -p artifacts/a29/pen-cache
          git rev-parse HEAD | tee artifacts/a29/pen-cache/source-sha.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install locked browser dependencies
        working-directory: farm3d/firebase
        run: npm ci --ignore-scripts
      - name: Install pinned Chromium and system dependencies
        working-directory: farm3d/firebase
        run: npx playwright install --with-deps chromium
      - name: Configure disposable browser paths
        run: |
          echo "PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/farm3d/firebase/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(node -e 'console.log(require("./farm3d/firebase/node_modules/playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Original selected 49 focused checks
        if: ${{ success() && 'all' != 'affected-cache-recovery' && 'all' != 'a38-cache-only' }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/pen_cache"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/pen_cache/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'set -o pipefail
          node --test farm3d/tests/restore-recovery.test.mjs farm3d/tests/restore-recovery-scope.test.mjs farm3d/tests/save-writer-compatibility.test.mjs farm3d/tests/ordinary-layout-transaction.test.mjs farm3d/tests/animal-pen-save.test.mjs farm3d/tests/remaining-care-integration.test.mjs farm3d/tests/versions.test.mjs farm3d/tests/sdk.test.mjs 2>&1 | tee artifacts/a29/pen-cache/focused.log
          '
      - name: Historical source resolver and corruption controls
        if: ${{ !cancelled() && 'all' != 'affected-cache-recovery' && 'all' != 'a38-cache-only' }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/pen_cache"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/pen_cache/step-2.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'set -o pipefail
          node --test farm3d/tests/qualification-source.test.cjs 2>&1 | tee artifacts/a29/pen-cache/source-controls.log
          '
      - name: Original installed v72 to v73 transition
        if: ${{ !cancelled() && 'all' != 'a38-cache-only' }}
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/a29/pen-cache/cache-v72-v73
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/pen_cache"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/pen_cache/step-3.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'set -o pipefail
          node farm3d/tests/animal-pen-cache-v72-to-v73.browser.cjs 2>&1 | tee artifacts/a29/pen-cache/cache-v72-v73.log
          '
      - name: Original installed v73 to current v74 transition
        if: ${{ !cancelled() && 'all' != 'a38-cache-only' }}
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/a29/pen-cache/cache-v73-v74
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/pen_cache"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/pen_cache/step-4.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'set -o pipefail
          node farm3d/tests/animal-pen-cache-v73-to-v74.browser.cjs 2>&1 | tee artifacts/a29/pen-cache/cache-v73-v74.log
          '
      - name: Installed v74 to v75 auth update (A38 only)
        if: ${{ !cancelled() && 'all' == 'a38-cache-only' }}
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/a29/pen-cache/cache-v74-v75
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/pen_cache"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/pen_cache/step-5.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/animal-pen-cache-v74-to-v75.browser.cjs'
      - name: Original gate relocation seed1 at120Hz three-night journey
        if: ${{ !cancelled() && 'all' != 'affected-cache-recovery' && 'all' != 'a38-cache-only' }}
        env:
          PEN_MATRIX_EDIT_CLASS: gate
          PEN_MATRIX_SEED: '1'
          PEN_MATRIX_RATE_HZ: '120'
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/a29/pen-cache/gate-1-120
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/pen_cache"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/pen_cache/step-6.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'set -o pipefail
          node farm3d/tests/animal-pen-three-night-extra-classes.browser.cjs 2>&1 | tee artifacts/a29/pen-cache/gate-1-120.log
          '
      - name: Validate and project exact execution receipts
        id: public_receipts
        if: always()
        env:
          A52_CANDIDATE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "farm3d/tests/helpers/a52-workflow-receipts.cjs" && test ! -L "farm3d/tests/helpers/a52-workflow-receipts.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = d391090a2ddcea94b72fb71ca5af2fb64a790577fee95294d6a7d8c9ca29dc4c
          test -f "farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "farm3d/tests/helpers/a52-workflow-receipts.cjs" farm3d-release-qualification/pen_cache "$RUNNER_TEMP/a52-ci-safe/pen_cache" "$RUNNER_TEMP/a52-ci-public/pen_cache" "$A52_CANDIDATE_HEAD"
      - name: Retain source, results and original failures
        if: ${{ (always()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: companion-all-farm3d-a29-pen-cache-${{ github.run_attempt }}-execution-receipts-only
          path: ${{ runner.temp }}/a52-ci-public/pen_cache/
          if-no-files-found: error
          retention-days: 14
  all_recovery_restore:
    name: "[all] Original recovery and interrupted manual restore (demo emulators)"
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/codex/a52-two-corner-ui-20261117' && ('workflow_dispatch' == 'workflow_dispatch' && 'all' != 'a35-fixtures-integrity' && 'all' != 'a38-cache-only') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/firebase/package-lock.json
      - name: Record exact source
        run: |
          mkdir -p artifacts/a29/recovery
          git rev-parse HEAD | tee artifacts/a29/recovery/source-sha.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install locked emulator and browser dependencies
        working-directory: farm3d/firebase
        run: npm ci --ignore-scripts
      - name: Install pinned Chromium and system dependencies
        working-directory: farm3d/firebase
        run: npx playwright install --with-deps chromium
      - name: Prepare exact Firebase emulator binaries without project execution
        run: node farm3d/tests/helpers/a52-emulator-bootstrap.cjs auth
      - name: Original 27 recovery checks with bounded quota diagnostic
        working-directory: farm3d/firebase
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/recovery_restore"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/recovery_restore/step-1.json" --timeout-ms 1500000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'set -o pipefail
          touch "$GITHUB_WORKSPACE/artifacts/a29/recovery/execution-start"
          npx firebase emulators:exec --only firestore,auth --project demo-sunny-acres "node tests/recovery.browser.cjs" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/a29/recovery/recovery-restore.log"
          '
      - name: Preserve recovery evidence before independent emulator reset
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/recovery_restore"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/recovery_restore/step-2.json" --timeout-ms 1500000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'mkdir -p artifacts/a29/recovery/original-recovery
          cp -a farm3d/firebase/artifacts/. artifacts/a29/recovery/original-recovery/
          for file in farm3d/firebase/*debug.log; do
            if test -f "$file"; then cp "$file" artifacts/a29/recovery/original-recovery/; fi
          done
          '
      - name: Three independent A28 manual-restore groups
        if: ${{ !cancelled() }}
        working-directory: farm3d/firebase
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/recovery_restore"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/recovery_restore/step-3.json" --timeout-ms 1500000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'set -o pipefail
          touch "$GITHUB_WORKSPACE/artifacts/a29/recovery/manual-execution-start"
          npx firebase emulators:exec --only firestore,auth --project demo-sunny-acres "node tests/manual-restore.browser.cjs" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/a29/recovery/manual-restore.log"
          '
      - name: Preserve fresh manual-restore receipts from disposable checkout
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/recovery_restore"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/recovery_restore/step-4.json" --timeout-ms 1500000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'source=farm3d/tests/evidence/pen-editing-implementation/task8-codex-restore-repair-20261025/emulator
          for file in manual-restore.json restored.png; do
            if test -f artifacts/a29/recovery/manual-execution-start && test "$source/$file" -nt artifacts/a29/recovery/manual-execution-start; then
              cp "$source/$file" "artifacts/a29/recovery/$file"
            else
              echo "No fresh $file receipt generated" >> artifacts/a29/recovery/missing-fresh-receipts.txt
            fi
          done
          '
      - name: Validate and project exact execution receipts
        id: public_receipts
        if: always()
        env:
          A52_CANDIDATE_HEAD: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "farm3d/tests/helpers/a52-workflow-receipts.cjs" && test ! -L "farm3d/tests/helpers/a52-workflow-receipts.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = d391090a2ddcea94b72fb71ca5af2fb64a790577fee95294d6a7d8c9ca29dc4c
          test -f "farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "farm3d/tests/helpers/a52-workflow-receipts.cjs" farm3d-release-qualification/recovery_restore "$RUNNER_TEMP/a52-ci-safe/recovery_restore" "$RUNNER_TEMP/a52-ci-public/recovery_restore" "$A52_CANDIDATE_HEAD"
      - name: Retain recovery outcomes and original failures
        if: ${{ (always()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: companion-all-farm3d-a29-recovery-${{ github.run_attempt }}-execution-receipts-only
          path: ${{ runner.temp }}/a52-ci-public/recovery_restore/
          if-no-files-found: error
          retention-days: 14
  a35_fixtures_integrity:
    name: "[a35-fixtures-integrity] Consolidated fixtures and supplemental fresh-context integrity"
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/codex/a52-two-corner-ui-20261117' && ('workflow_dispatch' == 'workflow_dispatch' && 'a35-fixtures-integrity' == 'a35-fixtures-integrity') }}
    needs: [all_conflicts, all_pen_cache, all_recovery_restore]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
