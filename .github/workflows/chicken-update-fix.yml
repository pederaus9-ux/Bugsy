name: Chicken update and idle correction
on:
  push:
    branches: [codex/chicken-update-fix-20261019]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: update-a
            script: chicken-pen-update.browser.cjs
          - label: update-b
            script: chicken-pen-update.browser.cjs
          - label: idle-return
            script: scene-polish.browser.cjs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: git fetch --depth=1 origin 756df378e7adbe20f34c204dc54172b1030e16bd
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install hosted Chromium
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Identity and surrounding contracts
        working-directory: farm3d/tests
        run: node --test worker-transition.test.cjs versions.test.mjs chicken-care.test.mjs chicken-care-integration.test.mjs chicken-yard.test.mjs chicken-yard-interaction.test.mjs player-motion.test.mjs player-arm-actions.test.mjs player-arm-contour.test.mjs player-arm-clearance.test.mjs player-arm-attachment.test.mjs player-arm-attachment-integration.test.mjs player-motion-fallback.test.mjs
      - name: Native correction qualification
        working-directory: farm3d/tests
        run: node ${{ matrix.script }}
      - name: Preserve partial results and native evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: correction-${{ matrix.label }}-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/
          retention-days: 7
