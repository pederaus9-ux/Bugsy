name: Sunny Acres release qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'farm3d/firebase/tests/conflicts.browser.cjs'
      - 'farm3d/firebase/tests/emu-harness.cjs'
      - 'farm3d/firebase/package*.json'
      - 'farm3d/firebase/firestore.rules'
      - 'farm3d/auth.js'
      - 'farm3d/game.js'
      - 'farm3d/index.html'
      - '.github/workflows/farm3d-release-qualification.yml'
  workflow_dispatch:
    inputs:
      qualification_set:
        description: Select all checks, cache/recovery, or the A31 recovery-only diagnostic
        type: choice
        required: true
        default: all
        options: [all, affected-cache-recovery, affected-recovery]
permissions:
  contents: read
concurrency:
  group: farm3d-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conflicts:
    name: Same-account conflicting saves (emulator)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.qualification_set == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/firebase/package-lock.json
      - name: Install isolated emulator and pinned browser dependencies
        working-directory: farm3d/firebase
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/firebase
        run: npx playwright install --with-deps chromium
      - name: Preserve both farms through stale-upload refusal and user choices
        working-directory: farm3d/firebase
        run: npm run test:conflicts
      - name: Save conflicting-save state, requests and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-release-conflicts-${{ github.run_attempt }}
          path: farm3d/firebase/artifacts/
          if-no-files-found: error
          retention-days: 14
  pen_cache:
    name: Targeted pen, restore guards and installed cache transitions
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_set != 'affected-recovery' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/firebase/package-lock.json
      - name: Record exact source
        run: |
          mkdir -p artifacts/a29/pen-cache
          git rev-parse HEAD | tee artifacts/a29/pen-cache/source-sha.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install locked browser dependencies
        working-directory: farm3d/firebase
        run: npm ci --ignore-scripts
      - name: Install pinned Chromium and system dependencies
        working-directory: farm3d/firebase
        run: npx playwright install --with-deps chromium
      - name: Configure disposable browser paths
        run: |
          echo "PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/farm3d/firebase/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(node -e 'console.log(require("./farm3d/firebase/node_modules/playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Original selected 49 focused checks
        if: ${{ success() && inputs.qualification_set != 'affected-cache-recovery' }}
        run: |
          set -o pipefail
          node --test farm3d/tests/restore-recovery.test.mjs farm3d/tests/restore-recovery-scope.test.mjs farm3d/tests/save-writer-compatibility.test.mjs farm3d/tests/ordinary-layout-transaction.test.mjs farm3d/tests/animal-pen-save.test.mjs farm3d/tests/remaining-care-integration.test.mjs farm3d/tests/versions.test.mjs farm3d/tests/sdk.test.mjs 2>&1 | tee artifacts/a29/pen-cache/focused.log
      - name: Historical source resolver and corruption controls
        if: ${{ !cancelled() && inputs.qualification_set != 'affected-cache-recovery' }}
        run: |
          set -o pipefail
          node --test farm3d/tests/qualification-source.test.cjs 2>&1 | tee artifacts/a29/pen-cache/source-controls.log
      - name: Original installed v72 to v73 transition
        if: ${{ !cancelled() }}
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/a29/pen-cache/cache-v72-v73
        run: |
          set -o pipefail
          node farm3d/tests/animal-pen-cache-v72-to-v73.browser.cjs 2>&1 | tee artifacts/a29/pen-cache/cache-v72-v73.log
      - name: Original installed v73 to current v74 transition
        if: ${{ !cancelled() }}
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/a29/pen-cache/cache-v73-v74
        run: |
          set -o pipefail
          node farm3d/tests/animal-pen-cache-v73-to-v74.browser.cjs 2>&1 | tee artifacts/a29/pen-cache/cache-v73-v74.log
      - name: Original gate relocation seed1 at120Hz three-night journey
        if: ${{ !cancelled() && inputs.qualification_set != 'affected-cache-recovery' }}
        env:
          PEN_MATRIX_EDIT_CLASS: gate
          PEN_MATRIX_SEED: '1'
          PEN_MATRIX_RATE_HZ: '120'
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/a29/pen-cache/gate-1-120
        run: |
          set -o pipefail
          node farm3d/tests/animal-pen-three-night-extra-classes.browser.cjs 2>&1 | tee artifacts/a29/pen-cache/gate-1-120.log
      - name: Retain source, results and original failures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-a29-pen-cache-${{ github.run_attempt }}
          path: artifacts/a29/pen-cache/
          if-no-files-found: error
          retention-days: 14
  recovery_restore:
    name: Original recovery and interrupted manual restore (demo emulators)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/firebase/package-lock.json
      - name: Record exact source
        run: |
          mkdir -p artifacts/a29/recovery
          git rev-parse HEAD | tee artifacts/a29/recovery/source-sha.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install locked emulator and browser dependencies
        working-directory: farm3d/firebase
        run: npm ci --ignore-scripts
      - name: Install pinned Chromium and system dependencies
        working-directory: farm3d/firebase
        run: npx playwright install --with-deps chromium
      - name: Original 27 recovery checks with bounded quota diagnostic
        working-directory: farm3d/firebase
        run: |
          set -o pipefail
          touch "$GITHUB_WORKSPACE/artifacts/a29/recovery/execution-start"
          npx firebase emulators:exec --only firestore,auth --project demo-sunny-acres "node tests/recovery.browser.cjs" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/a29/recovery/recovery-restore.log"
      - name: Preserve recovery evidence before independent emulator reset
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts/a29/recovery/original-recovery
          cp -a farm3d/firebase/artifacts/. artifacts/a29/recovery/original-recovery/
          for file in farm3d/firebase/*debug.log; do
            if test -f "$file"; then cp "$file" artifacts/a29/recovery/original-recovery/; fi
          done
      - name: Three independent A28 manual-restore groups
        if: ${{ !cancelled() }}
        working-directory: farm3d/firebase
        run: |
          set -o pipefail
          touch "$GITHUB_WORKSPACE/artifacts/a29/recovery/manual-execution-start"
          npx firebase emulators:exec --only firestore,auth --project demo-sunny-acres "node tests/manual-restore.browser.cjs" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/a29/recovery/manual-restore.log"
      - name: Preserve fresh manual-restore receipts from disposable checkout
        if: always()
        run: |
          source=farm3d/tests/evidence/pen-editing-implementation/task8-codex-restore-repair-20261025/emulator
          for file in manual-restore.json restored.png; do
            if test -f artifacts/a29/recovery/manual-execution-start && test "$source/$file" -nt artifacts/a29/recovery/manual-execution-start; then
              cp "$source/$file" "artifacts/a29/recovery/$file"
            else
              echo "No fresh $file receipt generated" >> artifacts/a29/recovery/missing-fresh-receipts.txt
            fi
          done
      - name: Retain recovery outcomes and original failures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-a29-recovery-${{ github.run_attempt }}
          path: |
            artifacts/a29/recovery/
            farm3d/firebase/artifacts/
            farm3d/firebase/*debug.log
          if-no-files-found: error
          retention-days: 14
