name: A53 bounded original save conflict diagnostic
on:
  push:
    branches: [codex/a53-conflict-progress-diagnostic-20261118]
permissions:
  contents: read
concurrency:
  group: a53-conflict-progress-${{ github.ref }}
  cancel-in-progress: false
jobs:
  conflicts:
    name: Same-account conflicting saves (emulator)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact source and inert observer controls
        run: |
          node farm3d/tests/helpers/a53-conflict-source.cjs "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/a53-conflict-safe" "$RUNNER_TEMP/a53-conflict-public"
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-conflict-safe/namespace.json" --timeout-ms 10000 --probe-only
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-conflict-safe/controls.json" --timeout-ms 180000 -- node --test farm3d/tests/a53-conflict-progress.test.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/firebase/package-lock.json
      - name: Install isolated emulator and pinned browser dependencies
        working-directory: farm3d/firebase
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/firebase
        run: npx playwright install --with-deps chromium
      - name: Prepare exact Firebase emulator binaries without project execution
        run: node farm3d/tests/helpers/a52-emulator-bootstrap.cjs auth
      - name: Preserve both farms through stale-upload refusal and user choices
        working-directory: farm3d/firebase
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/conflicts"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/conflicts/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'npm run test:conflicts'
      - name: Validate and project exact execution receipts
        id: public_receipts
        if: ${{ !cancelled() }}
        env:
          A52_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node farm3d/tests/helpers/a53-conflict-source.cjs "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "farm3d/tests/helpers/a52-workflow-receipts.cjs" && test ! -L "farm3d/tests/helpers/a52-workflow-receipts.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = d9e887bd1876f1ddbc5c3a12cf1d2aa6a103091caa12d53cc57d69561199e124
          test -f "farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "farm3d/tests/helpers/a52-workflow-receipts.cjs" farm3d-release-qualification/conflicts "$RUNNER_TEMP/a52-ci-safe/conflicts" "$RUNNER_TEMP/a52-ci-public/conflicts" "$A52_CANDIDATE_HEAD"
      - name: Save conflicting-save state, requests and failure evidence
        if: ${{ (!cancelled()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: a53-conflicts-original-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a52-ci-public/conflicts/
          if-no-files-found: error
          retention-days: 14
      - name: Validate bounded conflict phases and native failure
        id: conflict_projection
        if: ${{ !cancelled() }}
        run: |
          node farm3d/tests/helpers/a53-conflict-source.cjs "$GITHUB_SHA" "$RUNNER_TEMP/a53-conflict-public/identity.json"
          node farm3d/tests/helpers/a53-conflict-evidence.cjs "$RUNNER_TEMP/a53-conflict-progress/phase.json" "$RUNNER_TEMP/a52-ci-safe/conflicts/step-1.json" "$RUNNER_TEMP/a53-conflict-public/conflicts.json" "$GITHUB_SHA"
      - name: Upload finite conflict evidence only
        if: ${{ !cancelled() && steps.conflict_projection.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: a53-conflict-progress-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a53-conflict-public/
          if-no-files-found: error
          retention-days: 14
