name: A53 isolated cow release cache and save qualification
on:
  push:
    branches: [codex/a53-cow-recovery-release-20261117]
permissions:
  contents: read
concurrency:
  group: a53-cow-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch immutable historical package baseline
        run: git fetch --no-tags --depth=1 origin 2f9a8241b8230938dd816e1c0fac52551a263f69
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/firebase/package-lock.json
      - name: Verify reviewed bytes and unchanged protection
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 40a8fb8797989b2b45393d70368a00a01af9a289
          sha256sum -c farm3d/tests/fixtures/a53-release-files.sha256
          test "$(sha256sum farm3d/tests/helpers/ci-isolated-runner.cjs | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          mkdir -p "$RUNNER_TEMP/a53-cow-receipts" artifacts/a53-cow-release
      - name: Prove kernel isolation
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-cow-receipts/namespace.json" --timeout-ms 10000 --probe-only
      - name: Inert exact scope and finite evidence controls
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-cow-receipts/inert.json" --timeout-ms 180000 -- node --test farm3d/tests/a53-cow-recovery-scope.test.cjs farm3d/tests/a53-cow-release-evidence.test.cjs
      - name: New installed journey contract controls
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-cow-receipts/contracts.json" --timeout-ms 180000 -- node --test farm3d/tests/a52-installed-cow-cache.contract.test.cjs
      - name: Preserve historical source package and UI proofs
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-cow-receipts/source-package.json" --timeout-ms 180000 -- node farm3d/tests/pages-package.verify.cjs --source-only
      - name: Original save and cow regression assertions
        run: >-
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-cow-receipts/regressions.json" --timeout-ms 360000 --max-output-bytes 4194304 -- node --test
          farm3d/tests/restore-recovery.test.mjs farm3d/tests/restore-recovery-scope.test.mjs
          farm3d/tests/save-writer-compatibility.test.mjs farm3d/tests/ordinary-layout-transaction.test.mjs
          farm3d/tests/animal-pen-save.test.mjs farm3d/tests/cow-writer-compatibility.test.mjs
          farm3d/tests/cow-care-integration.test.mjs farm3d/tests/cow-personal-space.test.mjs
          farm3d/tests/cow-stale-bed-route.test.mjs farm3d/tests/cow-intermediate-rejoin.test.mjs
          farm3d/tests/animal-pen-cow-runtime.test.mjs farm3d/tests/animal-pen-cow-rebind.test.mjs
          farm3d/tests/animal-pen-cow-resume.test.mjs farm3d/tests/animal-pen-cow-contact-rebind.test.mjs
          farm3d/tests/animal-pen-cow-separation.test.mjs farm3d/tests/animal-pen-cow-support.test.mjs
          farm3d/tests/animal-pen-robot-arrival.test.mjs farm3d/tests/animal-pen-robot-phase.test.mjs
          farm3d/tests/versions.test.mjs
      - name: Install locked test browser dependencies
        working-directory: farm3d/firebase
        run: npm ci --ignore-scripts
      - name: Install pinned Chromium and system dependencies
        working-directory: farm3d/firebase
        run: npx playwright install --with-deps chromium
      - name: Configure disposable browser paths
        run: |
          echo "PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/farm3d/firebase/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(node -e 'console.log(require("./farm3d/firebase/node_modules/playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Exact v93 to v94 installed update offline and synthetic saved farm
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/a53-cow-release
        run: |
          sha256sum -c farm3d/tests/fixtures/a53-release-files.sha256
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-cow-receipts/installed.json" --timeout-ms 600000 --max-output-bytes 4194304 -- env A52_COW_RELEASE_BROWSER_APPROVED=1 node farm3d/tests/a52-installed-cow-cache.browser.cjs
      - name: Verify and project finite evidence only
        id: projection
        if: always()
        run: |
          sha256sum -c farm3d/tests/fixtures/a53-release-files.sha256
          git diff --quiet HEAD --
          git diff --cached --quiet --
          node farm3d/tests/helpers/a53-cow-release-evidence.cjs --source "$RUNNER_TEMP/a53-cow-receipts" --output "$RUNNER_TEMP/a53-cow-public" --head "$GITHUB_SHA" --root "$GITHUB_WORKSPACE" --result "$GITHUB_WORKSPACE/artifacts/a53-cow-release/a52-installed-cow-cache/results.json"
      - name: Retain bounded qualification receipts only
        if: ${{ always() && steps.projection.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: a53-cow-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a53-cow-public/
          if-no-files-found: error
          retention-days: 14
