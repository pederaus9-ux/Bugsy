name: Daytime cow mirror eligibility only
on:
  push:
    branches: [test/daytime-cow-mirror-probe-20261119]
permissions:
  contents: read
concurrency:
  group: daytime-cow-mirror-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  eligibility:
    if: github.repository == 'pederaus9-ux/Bugsy' && github.ref == 'refs/heads/test/daytime-cow-mirror-probe-20261119'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact shipped source and test-only path scope
        run: |
          base=9e6f2763dd7781b761ccaef2f2cfa680d57b4783
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base" HEAD | while IFS= read -r file; do
            case "$file" in
              .github/workflows/daytime-cow-mirror-eligibility.yml|farm3d/tests/daytime-cow-mirror-eligibility.browser.cjs|farm3d/tests/daytime-cow-mirror-eligibility.test.cjs|farm3d/tests/helpers/cow-distribution-observer.cjs|farm3d/tests/cow-distribution-observer.test.cjs) ;;
              *) exit 1;;
            esac
            test -f "$file" && test ! -L "$file" || exit 1
          done
          test "$(git rev-parse HEAD:farm3d/index.html)" = ae44d6ade0a2f4542d9431882dc0bd741f35f5ef
          test "$(git rev-parse HEAD:farm3d/sw.js)" = "$(git rev-parse "$base":farm3d/sw.js)"
          test "$(sha256sum farm3d/tests/helpers/ci-isolated-runner.cjs | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          echo "ELIGIBILITY_ROOT=$RUNNER_TEMP/daytime-eligibility" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/daytime-eligibility/control" "$RUNNER_TEMP/daytime-eligibility/instrumented"
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/daytime-eligibility/probe.receipt.json" --timeout-ms 10000 --probe-only
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/daytime-eligibility/accounting.receipt.json" --timeout-ms 20000 -- node --test farm3d/tests/cow-distribution-observer.test.cjs farm3d/tests/daytime-cow-mirror-eligibility.test.cjs
      - name: Install frozen dependencies without lifecycle scripts
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Preserve existing care and save controls
        run: |
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$ELIGIBILITY_ROOT/regressions.receipt.json" --timeout-ms 300000 -- node --test farm3d/tests/animal-pen-robot-arrival.test.mjs farm3d/tests/cow-care.test.mjs farm3d/tests/cow-yard.test.mjs farm3d/tests/cow-rest-pose.test.mjs farm3d/tests/animal-pen-save.test.mjs
      - name: Install Chromium (setup only)
        working-directory: farm3d/tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Observe uninstrumented shipped control under kernel isolation
        run: |
          TEST_ARTIFACTS="$ELIGIBILITY_ROOT/control" node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$ELIGIBILITY_ROOT/control.receipt.json" --timeout-ms 420000 -- node farm3d/tests/daytime-cow-mirror-eligibility.browser.cjs control
      - name: Observe wrapper eligibility under kernel isolation
        run: |
          TEST_ARTIFACTS="$ELIGIBILITY_ROOT/instrumented" node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$ELIGIBILITY_ROOT/instrumented.receipt.json" --timeout-ms 420000 -- node farm3d/tests/daytime-cow-mirror-eligibility.browser.cjs instrumented
      - name: Validate finite paired evidence and actual original baseline
        id: evidence
        if: ${{ !cancelled() }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const {validReceipt}=require('./farm3d/tests/helpers/ci-isolated-runner.cjs');
          const read=(p,cap)=>{const s=fs.lstatSync(p);assert(s.isFile()&&s.size>=2&&s.size<=cap);return JSON.parse(fs.readFileSync(p,'utf8'));};
          const root=process.env.ELIGIBILITY_ROOT,pub=path.join(root,'public');fs.mkdirSync(pub);
          const receipts={};for(const label of ['probe','accounting','regressions','control','instrumented']){const p=path.join(root,label+'.receipt.json');if(fs.existsSync(p)){const r=read(p,8192);assert(validReceipt(r));receipts[label]=r;}}
          fs.writeFileSync(path.join(pub,'receipts.json'),JSON.stringify(receipts),{flag:'wx'});
          for(const name of ['accounting','regressions','control','instrumented']){const r=receipts[name];assert(r?.status==='passed'&&r.isolationVerified&&r.commandStarted&&r.commandResultAvailable&&r.cleanupVerified&&r.exitCode===0,'eligibility execution incomplete');}
          const eligibilityKeys=['calls','eligible','skipped','actionable','worldFlip','worldSame','worldNeutral','screenFlip','screenSame','screenNeutral'];
          for(let a=0;a<4;a++)for(let b=0;b<4;b++)eligibilityKeys.push('clearance'+a+'to'+b);
          for(const axis of ['world','screen'])for(const a of ['L','N','R'])for(const b of ['L','N','R'])eligibilityKeys.push(axis+a+'to'+b);
          eligibilityKeys.sort();
          function validateEligibility(v){
           assert(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).sort().join(',')===eligibilityKeys.join(','));
           for(const k of eligibilityKeys)assert(Number.isSafeInteger(v[k])&&v[k]>=0&&v[k]<=100000);
           assert.equal(v.calls,v.eligible+v.skipped);
           assert.equal(v.eligible,eligibilityKeys.filter(k=>k.startsWith('clearance')).reduce((s,k)=>s+v[k],0));
           assert.equal(v.actionable,[1,2,3].reduce((s,k)=>s+v['clearance'+k+'to0'],0));
           for(const axis of ['world','screen']){
            assert.equal(v[axis+'Flip']+v[axis+'Same']+v[axis+'Neutral'],v.actionable);
            let sum=0,flip=0,same=0,neutral=0;
            for(const a of ['L','N','R'])for(const b of ['L','N','R']){const n=v[axis+a+'to'+b];sum+=n;if(a==='N'||b==='N')neutral+=n;else if(a===b)same+=n;else flip+=n;}
            assert.equal(sum,v.actionable);assert.equal(flip,v[axis+'Flip']);assert.equal(same,v[axis+'Same']);assert.equal(neutral,v[axis+'Neutral']);
           }
           return Object.fromEntries(eligibilityKeys.map(k=>[k,v[k]]));
          }
          const project = report => {
          const exact = (value, keys) => value && typeof value === 'object' &&
            !Array.isArray(value) && Object.keys(value).sort().join(',') === keys;
          if (!exact(report, 'cases,lane,schema,source') || report.schema !== 1 ||
              !Array.isArray(report.cases) || report.cases.length !== 6)
            throw Error('Invalid aggregate report');
          const occupancyKey = /^(?:early|day1|night1|day2|night2)\/(?:day|night)\/x[+-]\/z[+-]\/(?:right|left)\/(?:(?:ordinary|robot|drink|bed|feed|otherCare)\/cowSeconds|cowEncounter|unverifiedSocialArrival|gap0to1_5|gap1_5to2_5|gap2_5to4|gapOver4)$/;
          const phases = {early:40,day1:200,night1:120,day2:240,night2:120};
          const editFields = ['editAttempts','editDispatched','editValidated','editApplied','editChoice','editStage','editKind','editIssueMask'];
          const totals = ['ordinaryLowToHigh','ordinaryHighToLow','socialSelected','socialPlanned',
            'socialAbandoned','socialUnresolved','containmentViolations','frames'];
          const seen = new Set();
          const cases = report.cases.map(c => {
            if (!exact(c, 'counters,eligibility,herd,layout,proofs,seed,status') || ![1, 4242].includes(c.seed) ||
                ![2, 5].includes(c.herd) || !['default','moved'].includes(c.layout) ||
                !['pass','setup-refused'].includes(c.status) ||
                (c.layout === 'moved' && c.herd !== 5) ||
                (c.layout === 'default' && c.status !== 'pass') ||
                !Array.isArray(c.counters) || c.counters.length > 1024)
              throw Error('Invalid aggregate case');
            const id = [c.layout,c.herd,c.seed].join('/');
            if (seen.has(id)) throw Error('Duplicate aggregate case');
            seen.add(id);
            const keys = new Set();
            const legalKey = k => {
              if (k === 'initialLowX' || occupancyKey.test(k) || (c.layout === 'moved' && editFields.includes(k))) return true;
              const [phase, field, ...rest] = k.split('/');
              return !rest.length && Object.hasOwn(phases, phase) && totals.includes(field);
            };
            const counters = c.counters.map(pair => {
              if (!Array.isArray(pair) || pair.length !== 2 ||
                  typeof pair[0] !== 'string' || !legalKey(pair[0]) ||
                  !Number.isFinite(pair[1]) || pair[1] < 0 || pair[1] > 10000000 ||
                  keys.has(pair[0])) throw Error('Invalid aggregate counter');
              keys.add(pair[0]);
              return [pair[0], pair[1]];
            });
            const values = new Map(counters);
            if (c.layout === 'moved') {
              const edit = Object.fromEntries(editFields.map(key => [key,values.get(key)]));
              if (editFields.some(key => !Number.isSafeInteger(edit[key]) || edit[key] < 0 || edit[key] > (key === 'editIssueMask' ? 255 : 11)) ||
                  edit.editStage < 1 || edit.editStage > 5 || edit.editKind > 2 ||
                  edit.editKind !== (edit.editChoice === 0 ? 0 : edit.editChoice <= 8 ? 1 : 2) || edit.editDispatched > edit.editAttempts ||
                  edit.editValidated > edit.editDispatched || edit.editApplied > edit.editValidated ||
                  (c.status === 'pass' && (edit.editStage !== 5 || edit.editChoice < 1 || edit.editApplied !== 1)) ||
                  (c.status === 'setup-refused' && (edit.editStage === 5 || edit.editChoice !== 0 || edit.editApplied !== 0)))
                throw Error('Invalid move witness');
            }
            if (c.status === 'setup-refused') {
              if (values.size !== editFields.length) throw Error('Refused case contains observations');
            } else {
              const low = values.get('initialLowX');
              if (!Number.isSafeInteger(low) || low < 0 || low > c.herd) throw Error('Invalid startup count');
              for (const [phase, seconds] of Object.entries(phases)) {
                for (const key of totals)
                  if (!Number.isSafeInteger(values.get(phase+'/'+key))) throw Error('Missing phase count');
                if (values.get(phase+'/frames') !== 30*seconds) throw Error('Invalid measured frames');
                let cowSeconds = 0;
                for (const [key, value] of values) {
                  if (!key.startsWith(phase+'/') || !key.endsWith('/cowSeconds')) continue;
                  if (key.split('/')[1] !== (phase.startsWith('night') ? 'night' : 'day'))
                    throw Error('Mismatched phase');
                  cowSeconds += value;
                }
                if (Math.abs(cowSeconds - seconds*c.herd) > 0.0001) throw Error('Invalid measured cow-time');
              }
            }
            const proofPhases=['initial','early','day1','night1','day2','night2'];
          assert(Array.isArray(c.proofs)&&c.proofs.length===6&&c.status==='pass','all original fixtures must install');
          const proofs=c.proofs.map((p,i)=>{assert(exact(p,'phase,rngCalls,stateSha256')&&p.phase===proofPhases[i]&&Number.isSafeInteger(p.rngCalls)&&p.rngCalls>=0&&p.rngCalls<=10000000&&/^[a-f0-9]{64}$/.test(p.stateSha256));return {phase:p.phase,rngCalls:p.rngCalls,stateSha256:p.stateSha256};});
          const eligibility=c.eligibility===null?null:validateEligibility(c.eligibility);
          return {seed:c.seed,herd:c.herd,layout:c.layout,status:c.status,counters,proofs,eligibility};
          });
          return {schema:1,cases};
          };
          const expected={"default/2/1":"2c68af09322fa758ca3e0720b4236bcdaf9b353ad54e615d2b194537ee924ab4","default/5/1":"cf170d4477cab9e817429aa9f55178ab8bfb24d196b6e7c1723390171d4c81b6","moved/5/1":"33140ed1ff19b0ce3d72d82e48c9e71c944c3e89f3a1567db87b2bbaff559cd5","default/2/4242":"de8128bc840214a1590fce7a1d0363fa6d9313672d64ed066425bc6cad9bc007","default/5/4242":"1fc18e232636ead01ea98412d64caaaa316eefefaafa2fce70fefa97a6e26e84","moved/5/4242":"10cc5c93bcbb5ff11fc09404a879e6ce9b260fc9bda3de8f50cb9ba980893fb7"};
          const lanes={};
          for(const lane of ['control','instrumented']){
           const r=read(path.join(root,lane,'daytime-eligibility.json'),524288);
           assert(r.source==='9e6f2763dd7781b761ccaef2f2cfa680d57b4783'&&r.lane===lane);
           lanes[lane]=project(r);
          }
          let encounters=0,actionable=0;
          for(const [i,c] of lanes.control.cases.entries()){
           const other=lanes.instrumented.cases[i],key=[c.layout,c.herd,c.seed].join('/');
           assert.deepEqual([other.layout,other.herd,other.seed],[c.layout,c.herd,c.seed]);
           assert.deepEqual(c.counters,other.counters,'wrapper changed original measured behavior');
           assert.deepEqual(c.proofs,other.proofs,'wrapper changed phase RNG or measured runtime state');
           assert.equal(crypto.createHash('sha256').update(JSON.stringify(c.counters)).digest('hex'),expected[key],'retained main distribution/arrival baseline changed');
           assert.equal(c.eligibility,null);assert(other.eligibility);
           encounters+=c.counters.filter(([k])=>k.includes('/day/')&&k.endsWith('/cowEncounter')).reduce((s,[,v])=>s+v,0);
           actionable+=other.eligibility.actionable;
          }
          assert.equal(encounters,25,'original actual daytime arrivals');
          const out={schema:1,source:'9e6f2763dd7781b761ccaef2f2cfa680d57b4783',actualDaytimeArrivals:encounters,potentialLegalMirrors:actionable,decision:actionable?'opportunities-not-a-runtime-fix':'no-opportunities-stop',...lanes};
          fs.writeFileSync(path.join(pub,'daytime-eligibility.json'),JSON.stringify(out),{flag:'wx'});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'eligible=true\n');
          console.log('Eligibility evidence only: unchanged shipped behavior, no runtime change or release approval');
          NODE
      - name: Preserve finite isolation receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: daytime-eligibility-receipts-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daytime-eligibility/public/receipts.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve finite eligibility and unchanged-behavior proof
        if: steps.evidence.outputs.eligible == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: daytime-eligibility-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daytime-eligibility/public/daytime-eligibility.json
          if-no-files-found: error
          retention-days: 7
