name: A54 daytime cow meetings qualification
on:
  push:
    branches: [test/a54-daytime-cow-meetings]
permissions:
  contents: read
concurrency:
  group: a54-daytime-cow-meetings-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'pederaus9-ux/Bugsy' && github.ref == 'refs/heads/test/a54-daytime-cow-meetings'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Set disposable evidence directories
        run: |
          echo "LANE_ARTIFACTS=$RUNNER_TEMP/cow-distribution-result" >> "$GITHUB_ENV"
          echo "SAFE_RECEIPTS=$RUNNER_TEMP/cow-distribution-receipts" >> "$GITHUB_ENV"
          echo "PUBLIC_EVIDENCE=$RUNNER_TEMP/cow-distribution-public" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify pinned runtime, amended scope and kernel isolation
        shell: bash
        run: |
          base=9e6f2763dd7781b761ccaef2f2cfa680d57b4783
          runtimeSource=ab69da0bf2bf0dbd0819aa0118b2b21303c02a48
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$runtimeSource" HEAD
          git diff --name-only "$runtimeSource" HEAD | while IFS= read -r file; do
            case "$file" in
              .github/workflows/a54-social-qualification.yml|farm3d/tests/cow-distribution.browser.cjs) ;;
              *) printf 'Unexpected change from reviewed runtime: %s\n' "$file"; exit 1;;
            esac
            test -f "$file" && test ! -L "$file" || exit 1
          done
          for runtime in farm3d/index.html farm3d/sw.js; do
            test "$(git rev-parse "HEAD:$runtime")" = "$(git rev-parse "$runtimeSource:$runtime")"
          done
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base" HEAD | while IFS= read -r file; do
            case "$file" in
              .github/workflows/a54-social-qualification.yml|farm3d/index.html|farm3d/sw.js|farm3d/A54_DAYTIME_SOCIAL.md|farm3d/tests/a54-night-bed-step.test.cjs|farm3d/tests/a54-daytime-social-scope.test.cjs|farm3d/tests/fixtures/a54-daytime-social-scope.json|farm3d/tests/cow-distribution.browser.cjs|farm3d/tests/cow-distribution-observer.test.cjs|farm3d/tests/helpers/cow-distribution-observer.cjs) ;;
              *) printf 'Unexpected changed path: %s\n' "$file"; exit 1;;
            esac
            test -f "$file" && test ! -L "$file" || exit 1
          done
          test "$(git rev-parse "$base":farm3d/index.html)" = ae44d6ade0a2f4542d9431882dc0bd741f35f5ef
          test "$(sha256sum farm3d/tests/helpers/ci-isolated-runner.cjs | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          mkdir -p "$SAFE_RECEIPTS" "$LANE_ARTIFACTS/base" "$LANE_ARTIFACTS/candidate"
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$SAFE_RECEIPTS/probe.json" --timeout-ms 10000 --probe-only
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$SAFE_RECEIPTS/accounting.json" --timeout-ms 20000 -- node --test farm3d/tests/a54-night-bed-step.test.cjs farm3d/tests/cow-distribution-observer.test.cjs farm3d/tests/a54-daytime-social-scope.test.cjs
      - name: Install frozen test dependencies without lifecycle scripts
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Exercise unchanged gate, feeding and night behavior contracts
        run: |
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$SAFE_RECEIPTS/regressions.json" --timeout-ms 300000 -- node --test farm3d/tests/animal-pen-robot-arrival.test.mjs farm3d/tests/cow-care.test.mjs farm3d/tests/cow-yard.test.mjs farm3d/tests/cow-rest-pose.test.mjs farm3d/tests/animal-pen-save.test.mjs
      - name: Install Chromium (setup only)
        working-directory: farm3d/tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Observe exact base under kernel isolation
        id: base
        run: |
          TEST_ARTIFACTS="$LANE_ARTIFACTS/base" node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$SAFE_RECEIPTS/base.json" --timeout-ms 420000 -- node farm3d/tests/cow-distribution.browser.cjs base
      - name: Observe exact candidate under kernel isolation
        run: |
          TEST_ARTIFACTS="$LANE_ARTIFACTS/candidate" node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$SAFE_RECEIPTS/candidate.json" --timeout-ms 420000 -- node farm3d/tests/cow-distribution.browser.cjs candidate
      - name: Validate bounded aggregate result before publishing evidence
        id: evidence
        if: ${{ !cancelled() }}
        run: |
          test "$(sha256sum farm3d/tests/helpers/ci-isolated-runner.cjs | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          mkdir "$PUBLIC_EVIDENCE"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { validReceipt } = require('./farm3d/tests/helpers/ci-isolated-runner.cjs');
          const reads = (file, cap) => {
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.size < 2 || stat.size > cap) throw Error('Invalid evidence size or type');
            return JSON.parse(fs.readFileSync(file, 'utf8'));
          };
          const receipts = {};
          for (const name of ['probe', 'accounting', 'regressions', 'base', 'candidate']) {
            const file = path.join(process.env.SAFE_RECEIPTS, name + '.json');
            if (!fs.existsSync(file)) continue;
            const value = reads(file, 8192);
            if (!validReceipt(value)) throw Error('Invalid kernel receipt');
            receipts[name] = value;
          }
          if (!Object.keys(receipts).length) process.exit(0);
          fs.writeFileSync(path.join(process.env.PUBLIC_EVIDENCE, 'receipts.json'), JSON.stringify(receipts));
          const safe = r => r?.status === 'passed' && r.isolationVerified && r.commandStarted &&
            r.commandResultAvailable && r.cleanupVerified && r.exitCode === 0;
          if (!['accounting','regressions','base','candidate'].every(name => safe(receipts[name]))) process.exit(0);
          const project = report => {
          const exact = (value, keys) => value && typeof value === 'object' &&
            !Array.isArray(value) && Object.keys(value).sort().join(',') === keys;
          if (!exact(report, 'cases,schema') || report.schema !== 1 ||
              !Array.isArray(report.cases) || report.cases.length !== 6)
            throw Error('Invalid aggregate report');
          const occupancyKey = /^(?:early|day1|night1|day2|night2)\/(?:day|night)\/x[+-]\/z[+-]\/(?:right|left)\/(?:(?:ordinary|robot|drink|bed|feed|otherCare)\/cowSeconds|cowEncounter|unverifiedSocialArrival|gap0to1_5|gap1_5to2_5|gap2_5to4|gapOver4)$/;
          const phases = {early:40,day1:200,night1:120,day2:240,night2:120};
          const editFields = ['editAttempts','editDispatched','editValidated','editApplied','editChoice','editStage','editKind','editIssueMask'];
          const totals = ['ordinaryLowToHigh','ordinaryHighToLow','socialSelected','socialPlanned',
            'socialAbandoned','socialUnresolved','containmentViolations','containmentOutsideFrames','physicalBedArrivals','bedHoldAwayFrames','frames'];
          const seen = new Set();
          const cases = report.cases.map(c => {
            if (!exact(c, 'counters,herd,layout,seed,status') || ![1, 4242].includes(c.seed) ||
                ![2, 5].includes(c.herd) || !['default','moved'].includes(c.layout) ||
                !['pass','setup-refused'].includes(c.status) ||
                (c.layout === 'moved' && c.herd !== 5) ||
                (c.layout === 'default' && c.status !== 'pass') ||
                !Array.isArray(c.counters) || c.counters.length > 1024)
              throw Error('Invalid aggregate case');
            const id = [c.layout,c.herd,c.seed].join('/');
            if (seen.has(id)) throw Error('Duplicate aggregate case');
            seen.add(id);
            const keys = new Set();
            const legalKey = k => {
              if (k === 'initialLowX' || occupancyKey.test(k) || (c.layout === 'moved' && editFields.includes(k))) return true;
              const [phase, field, ...rest] = k.split('/');
              return !rest.length && Object.hasOwn(phases, phase) && totals.includes(field);
            };
            const counters = c.counters.map(pair => {
              if (!Array.isArray(pair) || pair.length !== 2 ||
                  typeof pair[0] !== 'string' || !legalKey(pair[0]) ||
                  !Number.isFinite(pair[1]) || pair[1] < 0 || pair[1] > 10000000 ||
                  keys.has(pair[0])) throw Error('Invalid aggregate counter');
              keys.add(pair[0]);
              return [pair[0], pair[1]];
            });
            const values = new Map(counters);
            if (c.layout === 'moved') {
              const edit = Object.fromEntries(editFields.map(key => [key,values.get(key)]));
              if (editFields.some(key => !Number.isSafeInteger(edit[key]) || edit[key] < 0 || edit[key] > (key === 'editIssueMask' ? 255 : 11)) ||
                  edit.editStage < 1 || edit.editStage > 5 || edit.editKind > 2 ||
                  edit.editKind !== (edit.editChoice === 0 ? 0 : edit.editChoice <= 8 ? 1 : 2) || edit.editDispatched > edit.editAttempts ||
                  edit.editValidated > edit.editDispatched || edit.editApplied > edit.editValidated ||
                  (c.status === 'pass' && (edit.editStage !== 5 || edit.editChoice < 1 || edit.editApplied !== 1)) ||
                  (c.status === 'setup-refused' && (edit.editStage === 5 || edit.editChoice !== 0 || edit.editApplied !== 0)))
                throw Error('Invalid move witness');
            }
            if (c.status === 'setup-refused') {
              if (values.size !== editFields.length) throw Error('Refused case contains observations');
            } else {
              const low = values.get('initialLowX');
              if (!Number.isSafeInteger(low) || low < 0 || low > c.herd) throw Error('Invalid startup count');
              for (const [phase, seconds] of Object.entries(phases)) {
                for (const key of totals)
                  if (!Number.isSafeInteger(values.get(phase+'/'+key))) throw Error('Missing phase count');
                if (values.get(phase+'/frames') !== 30*seconds) throw Error('Invalid measured frames');
                if (values.get(phase+'/physicalBedArrivals') > c.herd ||
                    values.get(phase+'/containmentOutsideFrames') > 30*seconds*c.herd ||
                    values.get(phase+'/bedHoldAwayFrames') > 30*seconds*c.herd) throw Error('Invalid physical counters');
                let cowSeconds = 0;
                for (const [key, value] of values) {
                  if (!key.startsWith(phase+'/') || !key.endsWith('/cowSeconds')) continue;
                  if (key.split('/')[1] !== (phase.startsWith('night') ? 'night' : 'day'))
                    throw Error('Mismatched phase');
                  cowSeconds += value;
                }
                if (Math.abs(cowSeconds - seconds*c.herd) > 0.0001) throw Error('Invalid measured cow-time');
              }
            }
            return {seed:c.seed, herd:c.herd, layout:c.layout, status:c.status, counters};
          });
          return {schema:1,cases};
          };
          const paired = {schema:1,baseSource:'9e6f2763dd7781b761ccaef2f2cfa680d57b4783',candidateSource:'ab69da0bf2bf0dbd0819aa0118b2b21303c02a48'};
          if (!/^[a-f0-9]{40}$/.test(paired.candidateSource)) throw Error('Invalid candidate identity');
          for (const lane of ['base','candidate'])
            paired[lane] = project(reads(path.join(process.env.LANE_ARTIFACTS,lane,'cow-distribution.json'), 524288));
          fs.writeFileSync(path.join(process.env.PUBLIC_EVIDENCE, 'cow-distribution.json'), JSON.stringify(paired));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'aggregate=true\n');
          NODE
      - name: Preserve finite kernel receipts only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: cow-distribution-receipts-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cow-distribution-public/receipts.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve finite aggregate observations
        if: steps.evidence.outputs.aggregate == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: cow-distribution-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cow-distribution-public/cow-distribution.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate bounded night boundary witnesses
        id: night_trace
        if: steps.evidence.outputs.aggregate == 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const check = (x, msg) => { if (!x) throw Error(msg); };
          const exact = (v, keys) => v && typeof v === 'object' &&
            !Array.isArray(v) && Object.keys(v).sort().join(',') === keys;
          const int = (v, lo, hi) => Number.isSafeInteger(v) && v >= lo && v <= hi;
          const sources = [
            ['base','9e6f2763dd7781b761ccaef2f2cfa680d57b4783'],
            ['candidate','ab69da0bf2bf0dbd0819aa0118b2b21303c02a48']
          ];
          const evidence = JSON.parse(fs.readFileSync(path.join(process.env.PUBLIC_EVIDENCE,'cow-distribution.json'),'utf8'));
          const phases = ['early','day1','night1','day2','night2'];
          const sample = v => {
            const bounds = [[1,3600],[0,3],[-128000,128000],[0,256000],[0,5],[0,6],[0,8],[0,10],
              [-256000,256000],[-256000,256000],[-256000,256000],[0,256000],[0,1]];
            check(Array.isArray(v) && v.length === bounds.length &&
              bounds.every(([lo,hi],i) => ((i === 8 || i === 9) && v[i] === null) || int(v[i],lo,hi)), 'Invalid trace sample');
            return v.slice();
          };
          const interval = v => {
            check(exact(v,'end,peak,recovery,start'), 'Invalid trace interval');
            const start = sample(v.start), end = sample(v.end), peak = sample(v.peak);
            const recovery = v.recovery === null ? null : sample(v.recovery);
            check(start[0] <= peak[0] && peak[0] <= end[0] &&
              (recovery === null ? end[0] === 3600 : recovery[0] === end[0]+1), 'Invalid trace ordering');
            return {start,end,peak,recovery};
          };
          const paired = {};
          for (const [lane,source] of sources) {
            const file = path.join(process.env.LANE_ARTIFACTS,lane,'cow-night-boundary-trace.json');
            const stat = fs.lstatSync(file);
            check(stat.isFile() && stat.size >= 2 && stat.size <= 65536, 'Invalid trace file');
            const r = JSON.parse(fs.readFileSync(file,'utf8'));
            check(exact(r,'cows,edgeCount,frames,phaseSamples,schema,source,thresholdMm') &&
              r.schema === 1 && r.source === source && r.frames === 3600 &&
              r.thresholdMm === -50 && r.edgeCount === 4 &&
              Array.isArray(r.phaseSamples) && r.phaseSamples.length === 5 &&
              r.phaseSamples.every(n => int(n,0,36000)) &&
              Array.isArray(r.cows) && r.cows.length === 5, 'Invalid trace header');
            const original = evidence[lane].cases.find(c => c.seed === 4242 && c.herd === 5 && c.layout === 'default');
            check(original?.status === 'pass', 'Trace identity missing from original evidence');
            const values = new Map(original.counters);
            check(phases.every((phase,i) => values.get(phase+'/containmentViolations') === r.phaseSamples[i]),
              'Trace phase samples do not reconcile');
            const cows = r.cows.map((c,cow) => {
              check(exact(c,'cow,first,intervals,last,nativeSamples,nightMinMm,outsideFrames,worst') &&
                c.cow === cow && int(c.outsideFrames,0,3600) && int(c.intervals,0,c.outsideFrames) &&
                int(c.nightMinMm,-128000,128000) && int(c.nativeSamples,0,120), 'Invalid cow trace counters');
              const {outsideFrames,intervals,nightMinMm,nativeSamples} = c;
              let first = null, last = null, worst = null;
              if (intervals === 0) {
                check(outsideFrames === 0 && nativeSamples === 0 &&
                  c.first === null && c.last === null && c.worst === null, 'Unexpected excursion evidence');
              } else {
                first = interval(c.first); last = interval(c.last); worst = interval(c.worst);
                check(first.start[0] <= worst.start[0] && worst.end[0] <= last.end[0], 'Unordered trace extrema');
              }
              return {cow,outsideFrames,intervals,nightMinMm,nativeSamples,first,last,worst};
            });
            check(cows.reduce((sum,c) => sum+c.nativeSamples,0) === r.phaseSamples[4], 'Night samples do not reconcile');
            paired[lane] = {schema:1,source,frames:3600,thresholdMm:-50,edgeCount:4,
              phaseSamples:r.phaseSamples.slice(),cows};
          }
          fs.writeFileSync(path.join(process.env.PUBLIC_EVIDENCE,'cow-night-boundary-trace.json'),
            JSON.stringify({schema:1,...paired}),{flag:'wx'});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'trace=true\n');
          NODE
      - name: Preserve finite night boundary witnesses
        if: steps.night_trace.outputs.trace == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: cow-night-boundary-trace-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cow-distribution-public/cow-night-boundary-trace.json
          if-no-files-found: error
          retention-days: 7

      - name: Require matched containment, real bed arrivals and retained daytime meetings
        if: ${{ !cancelled() }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const assert=require('node:assert/strict');
          // Immutable failed trace run 44433371602 is retained, never relabeled as passing.
          // This is an additional qualification of the first reviewed runtime correction.
          const prior={"base":{"default/2/1":{"earlyDaySha256":"64a25c3481a93b6b643051f4e5fb07051bab60bd07b702c0f811ec047e4ad5df","dayEncounters":1},"default/5/1":{"earlyDaySha256":"6642c5aadc61d3ad2e1c25667c1888196eb33136c9e1377c03c2ee1abfb3ea96","dayEncounters":11},"moved/5/1":{"earlyDaySha256":"a099ec158bcb9bdce85e9a2be1a8fad4443133215dd9baf4d34e97c745a29bde","dayEncounters":2},"default/2/4242":{"earlyDaySha256":"2643bfbbb9d97a020d35edbe8dff7ebeefefb1418ea6c8e36630684808487cb5","dayEncounters":1},"default/5/4242":{"earlyDaySha256":"ab8ce78a032ef22fd9a630fda026f337f1df584754a519af40e21ebc568ea5ae","dayEncounters":8},"moved/5/4242":{"earlyDaySha256":"6d5db3822b6bab1ee51e068b9f768b237761b1e9cf43e97c7695c5384a6a53bc","dayEncounters":2}},"candidate":{"default/2/1":{"earlyDaySha256":"60d1ad3fea65810aabc27c78af78a0559da3087d0157b7afe9738de293ec753f","dayEncounters":2},"default/5/1":{"earlyDaySha256":"208c98e864ce16026569d7cb8fb418553477ac9b1c17bf8efc9612b42459ac78","dayEncounters":12},"moved/5/1":{"earlyDaySha256":"66a66218538d66717264d70e645eab835d200fead2a1cc35014de413fcdd7e3d","dayEncounters":7},"default/2/4242":{"earlyDaySha256":"695dc835e350038ba92ebd4c86273dc0deb58e1cd0b8507c5f6d254f449c8e86","dayEncounters":2},"default/5/4242":{"earlyDaySha256":"c8ae261ceb01ecc81898f3fffcc58f2029cf653925ce471da58e39b64b9c2497","dayEncounters":7},"moved/5/4242":{"earlyDaySha256":"49470799c1de303bb2264aedd189e7ea2d97efc60c5605489026079fb124d4d1","dayEncounters":6}}};
          const load=name=>JSON.parse(fs.readFileSync(path.join(process.env.PUBLIC_EVIDENCE,name),'utf8'));
          const paired=load('cow-distribution.json'),trace=load('cow-night-boundary-trace.json');
          assert.equal(paired.candidateSource,'ab69da0bf2bf0dbd0819aa0118b2b21303c02a48');
          const phases=['early','day1','night1','day2','night2'];
          const newFields=new Set(['containmentOutsideFrames','physicalBedArrivals','bedHoldAwayFrames']);
          let baseMeetings=0,candidateMeetings=0;
          for(const [i,c] of paired.candidate.cases.entries()){
            const b=paired.base.cases[i],id=[c.layout,c.herd,c.seed].join('/');
            assert.deepEqual([b.layout,b.herd,b.seed],[c.layout,c.herd,c.seed],'matched fixture identities');
            assert.equal(b.status,'pass','base fixture must be installed');
            assert.equal(c.status,'pass','candidate fixture must be installed');
            const bv=new Map(b.counters),cv=new Map(c.counters);
            for(const key of ['initialLowX',...(c.layout==='moved'?['editChoice','editKind','editApplied']:[])])assert.equal(cv.get(key),bv.get(key),'matched fixture witness');
            for(const [lane,row] of [['base',b],['candidate',c]]){
              const original=row.counters.filter(([k])=>(k.startsWith('early/')||k.startsWith('day1/'))&&!newFields.has(k.split('/')[1]));
              const hash=crypto.createHash('sha256').update(JSON.stringify(original)).digest('hex');
              assert.equal(hash,prior[lane][id].earlyDaySha256,'unchanged pre-night observations from retained run');
            }
            for(const phase of phases){
              assert.equal(cv.get(phase+'/containmentViolations'),0,'original sampled containment');
              assert.equal(cv.get(phase+'/containmentOutsideFrames'),0,'every-update containment');
              assert.equal(cv.get(phase+'/bedHoldAwayFrames'),0,'no unphysical fully-weighted bed hold');
              assert.equal(cv.get(phase+'/physicalBedArrivals'),phase.startsWith('night')?c.herd:0,'each cow physically reaches its reserved bed before original deadline');
            }
            const count=row=>row.counters.filter(([k])=>k.includes('/day/')&&k.endsWith('/cowEncounter')).reduce((sum,[,v])=>sum+v,0);
            assert(count(c)>=prior.candidate[id].dayEncounters,'no per-fixture regression from pre-fix A54 physical daytime meetings');
            baseMeetings+=count(b);candidateMeetings+=count(c);
          }
          assert(candidateMeetings>=baseMeetings,'physical daytime meetings not below matched shipped base');
          assert.equal(trace.candidate.cows.reduce((sum,c)=>sum+c.outsideFrames,0),0,'original target night trace must now be contained');
          console.log('A54 matched containment, physical bed arrival and daytime meeting gates passed; not release or visual approval');
          NODE
  supplement:
    name: Supplemental 500s stock bed observation (not qualification)
    if: github.repository == 'pederaus9-ux/Bugsy' && github.ref == 'refs/heads/test/a54-daytime-cow-meetings'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify original RED job and observer remain intact
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          anchor=b8792f73d55ad847764980dec0239c7cc592f5dc
          git merge-base --is-ancestor "$anchor" HEAD
          git diff --name-only "$anchor" HEAD | while IFS= read -r file; do
            case "$file" in
              .github/workflows/a54-social-qualification.yml|farm3d/tests/cow-distribution.browser.cjs) ;;
              *) exit 1;;
            esac
            test -f "$file" && test ! -L "$file" || exit 1
          done
          node <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict');
          const anchor='b8792f73d55ad847764980dec0239c7cc592f5dc';
          const old=p=>cp.execFileSync('git',['show',anchor+':'+p],{encoding:'utf8',maxBuffer:1048576});
          const workflow='.github/workflows/a54-social-qualification.yml';
          const before=old(workflow),after=fs.readFileSync(workflow,'utf8');
          assert(after.startsWith(before));assert(after.slice(before.length).startsWith('  supplement:\n'));
          const observer='farm3d/tests/cow-distribution.browser.cjs';
          const original=old(observer),current=fs.readFileSync(observer,'utf8');
          const entry="main().catch(()=>{console.error('cow-distribution diagnostic failed before finite export');process.exitCode=1;});\n";
          assert(original.endsWith(entry));assert.equal(current.split('// A54_SUPPLEMENTAL_BEGIN:')[0],original.slice(0,-entry.length));
          NODE
          test "$(sha256sum farm3d/tests/helpers/ci-isolated-runner.cjs | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          echo "SUPPLEMENT_ROOT=$RUNNER_TEMP/a54-bed-supplement" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/a54-bed-supplement/main" "$RUNNER_TEMP/a54-bed-supplement/social" "$RUNNER_TEMP/a54-bed-supplement/fix"
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a54-bed-supplement/probe.receipt.json" --timeout-ms 10000 --probe-only
      - name: Install frozen dependencies without lifecycle scripts
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium (setup only)
        working-directory: farm3d/tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Observe exact main in disposable isolated guests
        run: |
          TEST_ARTIFACTS="$SUPPLEMENT_ROOT/main" node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$SUPPLEMENT_ROOT/main.receipt.json" --timeout-ms 420000 -- node -e "process.env.A54_SUPPLEMENTAL='1';process.env.A54_SUPPLEMENTAL_SOURCE='main';process.argv=['node','observer','candidate'];require('./farm3d/tests/cow-distribution.browser.cjs')"
      - name: Observe exact social-only in disposable isolated guests
        run: |
          TEST_ARTIFACTS="$SUPPLEMENT_ROOT/social" node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$SUPPLEMENT_ROOT/social.receipt.json" --timeout-ms 420000 -- node -e "process.env.A54_SUPPLEMENTAL='1';process.env.A54_SUPPLEMENTAL_SOURCE='social';process.argv=['node','observer','candidate'];require('./farm3d/tests/cow-distribution.browser.cjs')"
      - name: Observe exact correction in disposable isolated guests
        run: |
          TEST_ARTIFACTS="$SUPPLEMENT_ROOT/fix" node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$SUPPLEMENT_ROOT/fix.receipt.json" --timeout-ms 420000 -- node -e "process.env.A54_SUPPLEMENTAL='1';process.env.A54_SUPPLEMENTAL_SOURCE='fix';process.argv=['node','observer','candidate'];require('./farm3d/tests/cow-distribution.browser.cjs')"
      - name: Validate only finite supplemental evidence
        id: supplement_evidence
        if: ${{ !cancelled() }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const {validReceipt}=require('./farm3d/tests/helpers/ci-isolated-runner.cjs');
          const expected={"main":{"night1":{"priorSha256":"6642c5aadc61d3ad2e1c25667c1888196eb33136c9e1377c03c2ee1abfb3ea96","arrivals120":5,"outside120":0,"holdAway120":0},"night2":{"priorSha256":"a0dc2666cabacfc1aad69e624e712a69e4f68e92a9643d77206f8f54c2c6e029","arrivals120":5,"outside120":0,"holdAway120":0}},"fix":{"night1":{"priorSha256":"208c98e864ce16026569d7cb8fb418553477ac9b1c17bf8efc9612b42459ac78","arrivals120":3,"outside120":0,"holdAway120":0},"night2":{"priorSha256":"3dd8185440a813ba0eb5c76551f384f00faab0a3f353b0cc13727e8ee1a15815","arrivals120":2,"outside120":0,"holdAway120":0}},"social":{"night1":{"priorSha256":"208c98e864ce16026569d7cb8fb418553477ac9b1c17bf8efc9612b42459ac78","arrivals120":null,"outside120":null,"holdAway120":null},"night2":{"priorSha256":"3dd8185440a813ba0eb5c76551f384f00faab0a3f353b0cc13727e8ee1a15815","arrivals120":null,"outside120":null,"holdAway120":null}}};
          const sources={main:'9e6f2763dd7781b761ccaef2f2cfa680d57b4783',social:'39eac9ba486fa3929f6d1c238b0be86ba9da6220',fix:'ab69da0bf2bf0dbd0819aa0118b2b21303c02a48'};
          const exact=(o,k)=>o&&typeof o==='object'&&!Array.isArray(o)&&Object.keys(o).sort().join(',')===k;
          const read=(file,cap)=>{const s=fs.lstatSync(file);assert(s.isFile()&&s.size>=2&&s.size<=cap);return JSON.parse(fs.readFileSync(file,'utf8'));};
          const int=(v,max)=>Number.isSafeInteger(v)&&v>=0&&v<=max;
          const root=process.env.SUPPLEMENT_ROOT,pub=path.join(root,'public');fs.mkdirSync(pub);
          const receipts={};
          for(const lane of ['probe','main','social','fix']){
           const file=path.join(root,lane+'.receipt.json');if(!fs.existsSync(file))continue;
           const r=read(file,8192);assert(validReceipt(r));receipts[lane]=r;
          }
          fs.writeFileSync(path.join(pub,'receipts.json'),JSON.stringify(receipts),{flag:'wx'});
          for(const lane of ['main','social','fix']){const r=receipts[lane];assert(r?.status==='passed'&&r.isolationVerified&&r.commandStarted&&r.commandResultAvailable&&r.cleanupVerified&&r.exitCode===0,'supplemental execution incomplete');}
          const output={schema:1,originalRedRun:44459668779,diagnosticOnly:true,sources:[]};
          for(const label of ['main','social','fix']){
           const r=read(path.join(root,label,'cow-bed-supplement.json'),65536);
           assert(exact(r,'cases,label,schema,source')&&r.schema===1&&r.label===label&&r.source===sources[label]&&Array.isArray(r.cases)&&r.cases.length===2);
           const cases=r.cases.map((c,i)=>{
            const night=i?'night2':'night1',exp=expected[label][night];
            assert(exact(c,'cows,herd,layout,night,priorSha256,seed')&&c.seed===(i?4242:1)&&c.night===night&&c.herd===5&&c.layout==='default'&&c.priorSha256===exp.priorSha256&&Array.isArray(c.cows)&&c.cows.length===5,'chronology or fixture mismatch');
            const cows=c.cows.map((cow,ordinal)=>{
             assert(exact(cow,'checkpoints,cow')&&cow.cow===ordinal&&Array.isArray(cow.checkpoints)&&cow.checkpoints.length===4);
             let prior=null;
             const checkpoints=cow.checkpoints.map((v,j)=>{
              assert(exact(v,'bed,firstArrival,frame,gapMm,hold,holdAwayFrames,maxStationaryFrames,movingFrames,outsideFrames,physical,progressFrames,reservationArrived,reserved,stage,stationaryApproachFrames'));
              const frame=[3600,7200,10800,15000][j];assert(v.frame===frame);
              for(const key of ['bed','hold','physical','reserved','reservationArrived'])assert(int(v[key],1));
              assert(!v.reservationArrived||v.reserved);
              assert(int(v.stage,6)&&(v.gapMm===null||int(v.gapMm,256000)));
              for(const key of ['firstArrival','holdAwayFrames','maxStationaryFrames','movingFrames','outsideFrames','progressFrames','stationaryApproachFrames']){
               assert(int(v[key],frame));if(prior)assert(v[key]>=prior[key],'counter decreases');
              }
              assert(v.progressFrames<=v.movingFrames&&v.maxStationaryFrames<=v.stationaryApproachFrames);
              if(prior?.firstArrival)assert.equal(v.firstArrival,prior.firstArrival);
              if(v.physical)assert(v.bed===1&&v.hold===1&&v.reserved===1&&v.reservationArrived===1&&v.stage===3&&v.gapMm!==null&&v.gapMm<=50&&v.firstArrival>0);
              prior=v;return {...v};
             });
             return {cow:ordinal,checkpoints};
            });
            if(exp.arrivals120!==null){
             assert.equal(cows.filter(c=>c.checkpoints[0].firstArrival>0).length,exp.arrivals120,'120s result must match retained RED, not improve via chronology');
             assert.equal(cows.reduce((s,c)=>s+c.checkpoints[0].outsideFrames,0),exp.outside120);
             assert.equal(cows.reduce((s,c)=>s+c.checkpoints[0].holdAwayFrames,0),exp.holdAway120);
            }
            return {seed:c.seed,night,herd:5,layout:'default',priorSha256:c.priorSha256,cows};
           });
           output.sources.push({label,source:sources[label],cases});
          }
          fs.writeFileSync(path.join(pub,'cow-bed-supplement.json'),JSON.stringify(output),{flag:'wx'});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'supplement=true\n');
          console.log('500s supplemental evidence only; original 120s hard qualification remains RED');
          NODE
      - name: Preserve bounded supplemental isolation receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: a54-bed-supplement-receipts-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a54-bed-supplement/public/receipts.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve supplemental 500s observation, not a green replacement
        if: steps.supplement_evidence.outputs.supplement == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: a54-bed-supplement-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a54-bed-supplement/public/cow-bed-supplement.json
          if-no-files-found: error
          retention-days: 7
