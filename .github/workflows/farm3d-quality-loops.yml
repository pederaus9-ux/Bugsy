name: Sunny Acres bounded quality loops

# Owner-approved draft-PR validation. No timer, auto-fix, merge or deployment.
on:
  push:
    branches: [main]
    paths:
      - 'farm3d/**'
      - '.github/workflows/farm3d-quality-loops.yml'
  pull_request:
    branches: [main]
    paths:
      - 'farm3d/**'
      - '.github/workflows/farm3d-quality-loops.yml'
  workflow_dispatch:
    inputs:
      lanes:
        description: Comma-separated Node lane IDs, or all
        default: all
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: farm3d-quality-loops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify orchestration controls
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/node-evidence"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/node-evidence/step-1.json" --timeout-ms 2100000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node --test farm3d/tests/quality-loops.test.mjs farm3d/tests/quality-loop-dashboard.test.mjs farm3d/tests/quality-loop-baseline.test.mjs farm3d/tests/quality-loop-scorecard.test.mjs'
      - name: Find prior same-branch successful evidence
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          test -f "farm3d/tests/quality-loop-baseline.mjs" && test ! -L "farm3d/tests/quality-loop-baseline.mjs"
          test "$(sha256sum "farm3d/tests/quality-loop-baseline.mjs" | cut -d ' ' -f1)" = 6ef23a29b0049380faff3f4b14c0ca216fdddf365fdc6d6061b01ce10bd7d4da
          node farm3d/tests/quality-loop-baseline.mjs
      - name: Download selected prior evidence
        if: steps.baseline.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact_id }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: farm3d/tests/artifacts/quality-loop-baseline
          merge-multiple: true
      - name: Run bounded Node lanes
        env:
          QUALITY_LANES: ${{ inputs.lanes || 'all' }}
          QUALITY_BASELINE_HEAD: ${{ steps.baseline.outputs.head_sha }}
          QUALITY_BASELINE_RUN: ${{ steps.baseline.outputs.run_id }}
          QUALITY_BASELINE_ARTIFACT: ${{ steps.baseline.outputs.artifact_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/node-evidence"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/node-evidence/step-2.json" --timeout-ms 2100000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'if [ "$QUALITY_LANES" = "all" ]; then
            node farm3d/tests/quality-loops.mjs --budget-minutes 30 --baseline-directory farm3d/tests/artifacts/quality-loop-baseline
          else
            node farm3d/tests/quality-loops.mjs --budget-minutes 30 --lanes "$QUALITY_LANES" --baseline-directory farm3d/tests/artifacts/quality-loop-baseline
          fi
          '
      - name: Publish evidence scorecard
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/node-evidence"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/node-evidence/step-3.json" --timeout-ms 2100000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/quality-loop-scorecard.mjs'
      - name: Project finite quality report without raw diagnostics
        id: public_quality
        if: always()
        run: |
          test -f "farm3d/tests/helpers/a52-quality-projection.cjs" && test ! -L "farm3d/tests/helpers/a52-quality-projection.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-quality-projection.cjs" | cut -d ' ' -f1)" = 9d12926af3a499c3bb7b7b1bac0ec03bdd9cdea0c311c81a7360d2710b2708c8
          test -f "farm3d/tests/quality-loops.json" && test ! -L "farm3d/tests/quality-loops.json"
          test "$(sha256sum "farm3d/tests/quality-loops.json" | cut -d ' ' -f1)" = cb295313e3b7788f5dd6a63f92c09799a09f1523dacf8fa736ae62485434331d
          node farm3d/tests/helpers/a52-quality-projection.cjs --source farm3d/tests/artifacts/quality-loops --output "$RUNNER_TEMP/a52-public-quality"
      - name: Publish validated public scorecard separately
        if: ${{ always() && steps.public_quality.outcome == 'success' }}
        env:
          A52_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -f "farm3d/tests/helpers/a52-quality-summary.cjs" && test ! -L "farm3d/tests/helpers/a52-quality-summary.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-quality-summary.cjs" | cut -d ' ' -f1)" = 97450cf3a5a8f949b3554fd35f69b98b0a91a21cec70b537cf5e78bd56524ae6
          test -f "farm3d/tests/helpers/a52-quality-projection.cjs" && test ! -L "farm3d/tests/helpers/a52-quality-projection.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-quality-projection.cjs" | cut -d ' ' -f1)" = 9d12926af3a499c3bb7b7b1bac0ec03bdd9cdea0c311c81a7360d2710b2708c8
          test -f "farm3d/tests/quality-loops.json" && test ! -L "farm3d/tests/quality-loops.json"
          test "$(sha256sum "farm3d/tests/quality-loops.json" | cut -d ' ' -f1)" = cb295313e3b7788f5dd6a63f92c09799a09f1523dacf8fa736ae62485434331d
          test -f "farm3d/tests/quality-loop-scorecard.mjs" && test ! -L "farm3d/tests/quality-loop-scorecard.mjs"
          test "$(sha256sum "farm3d/tests/quality-loop-scorecard.mjs" | cut -d ' ' -f1)" = 7a6e7925feeb220829da598ebecf9d02e9098df61848c7888a7c98b8da16425f
          test -f "farm3d/tests/quality-loop-cases.mjs" && test ! -L "farm3d/tests/quality-loop-cases.mjs"
          test "$(sha256sum "farm3d/tests/quality-loop-cases.mjs" | cut -d ' ' -f1)" = d71c95dc225a02d986f6be86f09edcf2509019e12f5b906e1c5e0010b4dfe118
          node farm3d/tests/helpers/a52-quality-summary.cjs --source "$RUNNER_TEMP/a52-public-quality"
      - name: Validate and project exact execution receipts
        id: public_receipts
        if: always()
        env:
          A52_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "farm3d/tests/helpers/a52-workflow-receipts.cjs" && test ! -L "farm3d/tests/helpers/a52-workflow-receipts.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = 95ddea4bb15d3a21c9160f586f37e98cf207a66b34479901273f8e9e9e52878a
          test -f "farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "farm3d/tests/helpers/a52-workflow-receipts.cjs" farm3d-quality-loops/node-evidence "$RUNNER_TEMP/a52-ci-safe/node-evidence" "$RUNNER_TEMP/a52-ci-public/node-evidence" "$A52_CANDIDATE_HEAD"
      - name: Preserve projected baseline report including failed lane results
        if: ${{ always() && steps.public_quality.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: game-quality-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a52-public-quality/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve all results, including failures
        if: ${{ (always()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: a52-quality-isolation-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a52-ci-public/node-evidence/
          if-no-files-found: warn
          retention-days: 14
