name: Sunny Acres bounded quality loops

# Owner-approved draft-PR validation. No timer, auto-fix, merge or deployment.
on:
  push:
    branches: [main]
    paths:
      - 'farm3d/**'
      - '.github/workflows/farm3d-quality-loops.yml'
  pull_request:
    branches: [main]
    paths:
      - 'farm3d/**'
      - '.github/workflows/farm3d-quality-loops.yml'
  workflow_dispatch:
    inputs:
      lanes:
        description: Comma-separated Node lane IDs, or all
        default: all
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: farm3d-quality-loops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify orchestration controls
        run: node --test farm3d/tests/quality-loops.test.mjs farm3d/tests/quality-loop-dashboard.test.mjs farm3d/tests/quality-loop-baseline.test.mjs farm3d/tests/quality-loop-scorecard.test.mjs
      - name: Find prior same-branch successful evidence
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node farm3d/tests/quality-loop-baseline.mjs
      - name: Download selected prior evidence
        if: steps.baseline.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact_id }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: farm3d/tests/artifacts/quality-loop-baseline
          merge-multiple: true
      - name: Run bounded Node lanes
        env:
          QUALITY_LANES: ${{ inputs.lanes || 'all' }}
          QUALITY_BASELINE_HEAD: ${{ steps.baseline.outputs.head_sha }}
          QUALITY_BASELINE_RUN: ${{ steps.baseline.outputs.run_id }}
          QUALITY_BASELINE_ARTIFACT: ${{ steps.baseline.outputs.artifact_id }}
        run: |
          if [ "$QUALITY_LANES" = "all" ]; then
            node farm3d/tests/quality-loops.mjs --budget-minutes 30 --baseline-directory farm3d/tests/artifacts/quality-loop-baseline
          else
            node farm3d/tests/quality-loops.mjs --budget-minutes 30 --lanes "$QUALITY_LANES" --baseline-directory farm3d/tests/artifacts/quality-loop-baseline
          fi
      - name: Publish evidence scorecard
        if: always()
        run: node farm3d/tests/quality-loop-scorecard.mjs
      - name: Preserve all results, including failures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: game-quality-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/quality-loops/
          if-no-files-found: warn
          retention-days: 14
