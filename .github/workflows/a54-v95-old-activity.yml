name: A54 isolated one-shot v95 original-tab passive activity trace
on:
  push:
    branches: [test/a54-v95-old-activity-20261123]
permissions:
  contents: read
jobs:
  frozen-installed-upgrade:
    if: github.repository == 'pederaus9-ux/Bugsy' && github.ref == 'refs/heads/test/a54-v95-old-activity-20261123' && github.event.created && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        arm: [keep_old]
    env:
      A54_ARM: ${{ matrix.arm }}
    runs-on: ubuntu-22.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Freeze test-only head and verify authentic bytes
        run: |
          set -euo pipefail
          parent=9af5899a6cd525b1c9b4897e17048bed4102db93
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $parent"
          test "$(git rev-parse "$parent^{tree}")" = d3c81a1d4f3c70af0fe119a6d01b8944649d21ad
          expected="$(printf '%s\n' $'A\t.github/workflows/a54-v95-old-activity.yml' $'M\tfarm3d/tests/a54-installed-v95-public.browser.cjs')"
          test "$(git diff --no-renames --name-status "$parent" HEAD)" = "$expected"
          test "$(sha256sum farm3d/tests/a54-installed-v95-public.browser.cjs | cut -d ' ' -f1)" = 269130692326631ede472cc66463ba89e2c4a58f35952d9ec758225740f2af97
          test "$(sha256sum farm3d/tests/helpers/ci-isolated-runner.cjs | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          test "$(sha256sum farm3d/tests/package-lock.json | cut -d ' ' -f1)" = 13982f6213329cb300942a4ea86a76f2f0a794e2e87f40357299e96272cf7f68
          test "$(sha256sum farm3d/tests/fixtures/a54-installed-v95-public.json | cut -d ' ' -f1)" = 9d6d435970562cc5f82540dc08b5f8619deed271614d7fe352f7814eaf2e6d72
          node farm3d/tests/a54-installed-v95-public.browser.cjs --verify-only
          root="$RUNNER_TEMP/a54-installed-v95-public"
          mkdir "$root"
          printf 'A54_OUTPUT=%s\n' "$root" >> "$GITHUB_ENV"
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$root/probe.json" --timeout-ms 10000 --probe-only
      - name: Install same frozen browser test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium (setup only)
        working-directory: farm3d/tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify browser-owned installed takeover and offline reload
        run: |
          TEST_ARTIFACTS="$A54_OUTPUT" node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$A54_OUTPUT/browser.json" --timeout-ms 510000 -- node farm3d/tests/a54-installed-v95-public.browser.cjs --isolated-browser "$A54_ARM"
      - name: Validate finite receipts and publish only verified synthetic aggregate
        if: ${{ !cancelled() && env.A54_OUTPUT != '' }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const {validReceipt}=require('./farm3d/tests/helpers/ci-isolated-runner.cjs');
          const root=process.env.A54_OUTPUT,out=path.join(root,'public');fs.mkdirSync(out);
          const read=f=>{const x=path.join(root,f),s=fs.lstatSync(x);assert(s.isFile()&&s.size<=8192);return JSON.parse(fs.readFileSync(x,'utf8'));};
          const statuses={};
          for(const f of ['probe','browser'])if(fs.existsSync(path.join(root,f+'.json'))){
            const r=read(f+'.json');assert(validReceipt(r));statuses[f]={status:r.status,isolationVerified:r.isolationVerified,cleanupVerified:r.cleanupVerified,commandStarted:r.commandStarted,commandResultAvailable:r.commandResultAvailable,exitCode:r.exitCode};
          }
          fs.writeFileSync(path.join(out,'receipts.json'),JSON.stringify(statuses)+'\n',{flag:'wx'});
          if(!fs.existsSync(path.join(root,'result.json')))throw Error('No browser aggregate');
          const d=read('result.json');
          assert(process.env.A54_ARM==='keep_old'&&d.arm===process.env.A54_ARM);
          const bools=['oldInstall','redundantWorker','oldOfflineAfterFailure','sameTabTakeover','lateModuleExact','offlineOldTab','offlineNewTab','offlineReload','savePreserved'];
          const keys=new Set(['schema','arm','status','stage','hashes','automaticHttpsRegistration','failedPrecacheRequests','finalServerRequests','offlineCheckpoint','freshDocument','v94OfflineCheckpoint','v94OriginArrivals','hostCapture','oldActivity',...bools]);
          assert(Object.keys(d).every(k=>keys.has(k))&&d.schema===1&&['PASS','FAIL'].includes(d.status)&&d.automaticHttpsRegistration===false);
          assert(['prepare','network','sandbox','old_install','failed_precache','takeover','offline','complete','cleanup'].includes(d.stage));
          const steps=[
           ...['old_tab'].flatMap(p=>['navigate','response','document_hash','service_worker','game_ready','cache','save'].map(s=>p+'_'+s)),
           'new_tab_create',
           ...['new_tab'].flatMap(p=>['navigate','response','document_hash','service_worker','game_ready','cache','save'].map(s=>p+'_'+s)),
           'reload_navigate','reload_response','reload_document_hash','reload_game_ready','reload_save','zero_server_requests','complete'
          ];
          function validateCheckpoint(d){
           const k=d.offlineCheckpoint;
           if(d.stage==='complete'||d.status==='PASS')assert(d.stage==='complete'&&d.status==='PASS'&&d.lateModuleExact===true&&k==='complete');
           else if(d.stage==='offline'&&d.lateModuleExact===true)assert(steps.includes(k)&&k!=='complete');
           else if(d.stage==='cleanup'&&d.lateModuleExact===true)assert(steps.includes(k));
           else assert.equal(k,undefined);
          }
          validateCheckpoint(d);
          const wantV94=d.status==='FAIL'&&['failed_precache','cleanup'].includes(d.stage)&&d.redundantWorker===true&&d.oldOfflineAfterFailure===undefined;
          assert.equal(Object.hasOwn(d,'v94OfflineCheckpoint'),wantV94);
          if(wantV94)assert(d.oldInstall===true&&d.failedPrecacheRequests>=1&&d.freshDocument===undefined&&['offline_toggle','navigate','response','document','worker','ready','save_view','save_equal','origin_count'].includes(d.v94OfflineCheckpoint));
          function validV94OriginArrivalTrace(rows){
           return Array.isArray(rows)&&rows.length===3&&rows.every(x=>x&&
            Object.keys(x).sort().join(',')==='delta,kinds'&&[0,1,2].includes(x.delta)&&
            Number.isInteger(x.kinds)&&x.kinds>=0&&x.kinds<=15&&
            (x.delta===0?x.kinds===0:x.delta===1?x.kinds!==0&&(x.kinds&(x.kinds-1))===0:x.kinds!==0));
          }
          const wantArrivals=wantV94&&d.v94OfflineCheckpoint==='origin_count';
          assert.equal(Object.hasOwn(d,'v94OriginArrivals'),wantArrivals);
          if(wantArrivals)assert(validV94OriginArrivalTrace(d.v94OriginArrivals)&&d.v94OriginArrivals.some(x=>x.delta!==0));
          function validOverlay(x){
           const bin=n=>Number.isInteger(n)&&n>=1&&n<=6;
           if(!x||Object.keys(x).sort().join(',')!=='drawing,fade,ok,removed,replaced,sample,seen,state'||
            !bin(x.sample)||!['absent','zero','nonzero'].includes(x.state)||typeof x.replaced!=='boolean')return false;
           for(const k of ['seen','fade','removed','drawing','ok'])if(x[k]!==null&&(!bin(x[k])||x[k]>x.sample))return false;
           if(x.seen===null&&(x.fade!==null||x.removed!==null||x.replaced||x.state!=='absent'))return false;
           if((x.fade!==null&&x.fade<x.seen)||(x.removed!==null&&x.removed<x.seen))return false;
           return !(x.drawing!==null&&x.ok!==null&&x.ok<x.drawing);
          }
          function validFreshDocumentObservation(x){
           return x&&Object.keys(x).sort().join(',')==='boot,debug,firstError,loading,overlay,ready,visibility,writeTap'&&validOverlay(x.overlay)&&
            x.loading===(x.overlay.state!=='absent')&&
            ['ready','debug','loading','writeTap'].every(k=>typeof x[k]==='boolean')&&
            Number.isInteger(x.boot)&&x.boot>=0&&x.boot<=17&&(x.writeTap||x.boot===0)&&
            ['visible','hidden','prerender','other'].includes(x.visibility)&&
            ['none','script_error','script_resource','other_resource','promise_rejection','webgl_creation','webgl_lost'].includes(x.firstError);
          }
          const wantFresh=d.status==='FAIL'&&['offline','cleanup'].includes(d.stage)&&d.offlineCheckpoint==='new_tab_game_ready';
          assert.equal(Object.hasOwn(d,'freshDocument'),wantFresh);
          if(wantFresh)assert(d.freshDocument===null||validFreshDocumentObservation(d.freshDocument));
          const hostKeys=['installed','seen','drawing','ok','fade','removed','replaced'];
          const snapshotStates=['deadline','observer_missing','invalid_shape','evaluation_rejected','ok'];
          function validHostCapture(x,fresh){
           return x&&Object.keys(x).sort().join(',')==='milestones,snapshot'&&
            snapshotStates.includes(x.snapshot)&&(x.snapshot==='ok')===(fresh!==null)&&
            x.milestones&&typeof x.milestones==='object'&&!Array.isArray(x.milestones)&&
            Object.entries(x.milestones).every(([k,v])=>hostKeys.includes(k)&&Number.isInteger(v)&&v>=1&&v<=6);
          }
          assert.equal(Object.hasOwn(d,'hostCapture'),wantFresh);
          if(wantFresh)assert(validHostCapture(d.hostCapture,d.freshDocument));
          function validOldActivity(x){
           const states=['visible_focused','visible_unfocused','hidden_focused','hidden_unfocused','other','unavailable'];
           return x&&Object.keys(x).sort().join(',')==='begin,delta,later'&&states.includes(x.begin)&&states.includes(x.later)&&
            ['none','one','many','unavailable'].includes(x.delta)&&
            ((x.begin==='unavailable'||x.later==='unavailable')?x.delta==='unavailable':true);
          }
          assert.equal(Object.hasOwn(d,'oldActivity'),wantFresh);
          if(wantFresh)assert(validOldActivity(d.oldActivity));
          const manifest=require('./farm3d/tests/fixtures/a54-installed-v95-public.json');
          const before=['farm3d/index.html','farm3d/sw.js'].map(f=>manifest.files[f].beforeSha256),after=['farm3d/index.html','farm3d/sw.js'].map(f=>manifest.files[f].afterSha256);
          assert.deepEqual(d.hashes,{v94:before,v95:after});
          for(const b of bools)assert(d[b]===undefined||d[b]===true);
          assert(d.failedPrecacheRequests===undefined||(Number.isInteger(d.failedPrecacheRequests)&&d.failedPrecacheRequests>=1&&d.failedPrecacheRequests<=100));
          assert(d.finalServerRequests===undefined||d.finalServerRequests===0);
          assert(statuses.probe?.isolationVerified&&statuses.probe.cleanupVerified&&!statuses.probe.commandStarted&&statuses.probe.status==='passed');
          assert(statuses.browser?.isolationVerified&&statuses.browser.cleanupVerified&&statuses.browser.commandStarted&&statuses.browser.commandResultAvailable);
          fs.writeFileSync(path.join(out,'qualification.json'),JSON.stringify(d)+'\n',{flag:'wx'});
          assert(d.status==='PASS'&&d.stage==='complete'&&bools.every(b=>d[b]===true)&&d.failedPrecacheRequests>=1&&d.finalServerRequests===0);
          assert(statuses.browser.status==='passed'&&statuses.browser.exitCode===0);
          NODE
      - name: Retain bounded qualification evidence
        if: ${{ !cancelled() && env.A54_OUTPUT != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: a54-v95-old-activity-${{ matrix.arm }}-${{ github.sha }}
          path: ${{ runner.temp }}/a54-installed-v95-public/public/*.json
          if-no-files-found: error
          retention-days: 7
