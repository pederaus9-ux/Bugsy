name: Fixture-only daytime mirror qualification
on:
  push:
    branches: [test/daytime-cow-mirror-probe-20261119]
permissions:
  contents: read
concurrency:
  group: daytime-mirror-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification:
    if: github.repository == 'pederaus9-ux/Bugsy' && github.ref == 'refs/heads/test/daytime-cow-mirror-probe-20261119'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify test-only checkout and prepare exact disposable fixture tree
        run: |
          base=9e6f2763dd7781b761ccaef2f2cfa680d57b4783
          tree=ba02621a9d9805c4fcf9d017be5921e2955fa517
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base" HEAD | while IFS= read -r file; do
            case "$file" in
              .github/workflows/daytime-cow-mirror-eligibility.yml|farm3d/tests/daytime-cow-mirror-eligibility.browser.cjs|farm3d/tests/daytime-cow-mirror-eligibility.test.cjs|farm3d/tests/helpers/cow-distribution-observer.cjs|farm3d/tests/cow-distribution-observer.test.cjs|.github/workflows/daytime-cow-mirror-qualification.yml|farm3d/tests/daytime-cow-mirror-qualification.browser.cjs|farm3d/tests/daytime-cow-mirror-qualification.test.cjs|farm3d/tests/helpers/cow-day-mirror-source-fixture.cjs|farm3d/tests/cow-day-mirror-source-fixture.test.cjs) ;;
              *) exit 1;;
            esac
            test -f "$file" && test ! -L "$file" || exit 1
          done
          test "$(git rev-parse HEAD:farm3d/index.html)" = ae44d6ade0a2f4542d9431882dc0bd741f35f5ef
          test "$(git rev-parse HEAD:farm3d/sw.js)" = "$(git rev-parse "$base":farm3d/sw.js)"
          test "$(sha256sum farm3d/tests/helpers/cow-day-mirror-source-fixture.cjs | cut -d ' ' -f1)" = 0ef56d556bb56beba0c167ce12bc9b48327d6bb61ec6e4fb6341414f1ce6b1dd
          test "$(sha256sum farm3d/tests/helpers/ci-isolated-runner.cjs | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          test "$(node farm3d/tests/helpers/cow-day-mirror-source-fixture.cjs --prepare)" = "$tree"
          test "$(git diff --name-only "$base" "$tree")" = farm3d/index.html
          test "$(git rev-parse "$tree":farm3d/index.html)" = e70d576d1286fbb265e5ce6990608db9c568f04c
          echo "QUALIFICATION_ROOT=$RUNNER_TEMP/daytime-mirror-qualification" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/daytime-mirror-qualification/base" "$RUNNER_TEMP/daytime-mirror-qualification/candidate"
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/daytime-mirror-qualification/probe.receipt.json" --timeout-ms 10000 --probe-only
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/daytime-mirror-qualification/verify.receipt.json" --timeout-ms 20000 -- node farm3d/tests/helpers/cow-day-mirror-source-fixture.cjs --verify
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/daytime-mirror-qualification/accounting.receipt.json" --timeout-ms 20000 -- node --test farm3d/tests/cow-distribution-observer.test.cjs farm3d/tests/daytime-cow-mirror-eligibility.test.cjs farm3d/tests/daytime-cow-mirror-qualification.test.cjs farm3d/tests/cow-day-mirror-source-fixture.test.cjs
      - name: Install frozen dependencies without lifecycle scripts
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Materialize exact candidate tree privately for source-reading regressions
        run: |
          candidate="$RUNNER_TEMP/daytime-candidate-checks"
          mkdir "$candidate"
          git archive ba02621a9d9805c4fcf9d017be5921e2955fa517 | tar -x -C "$candidate"
          echo "CANDIDATE_CHECKS=$candidate" >> "$GITHUB_ENV"
          test "$(sha256sum "$candidate/farm3d/index.html" | cut -d ' ' -f1)" = c3124b2679e0a49183d22607f32122986453a5c306a475ea7667c5efc3ca0f23
          (cd "$candidate" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/daytime-candidate-files.sha256"
          (cd "$candidate" && find . -printf '%y %p\n' | sort) > "$RUNNER_TEMP/daytime-candidate-paths.txt"
          git diff --quiet && git diff --cached --quiet
      - name: Preserve all 41 existing shipped care and save controls
        run: |
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$QUALIFICATION_ROOT/regressions.receipt.json" --timeout-ms 300000 -- node --test farm3d/tests/animal-pen-robot-arrival.test.mjs farm3d/tests/cow-care.test.mjs farm3d/tests/cow-yard.test.mjs farm3d/tests/cow-rest-pose.test.mjs farm3d/tests/animal-pen-save.test.mjs
      - name: Run the same 41 unchanged controls against candidate source
        run: |
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$QUALIFICATION_ROOT/candidate-regressions.receipt.json" --timeout-ms 300000 -- node --test "$CANDIDATE_CHECKS/farm3d/tests/animal-pen-robot-arrival.test.mjs" "$CANDIDATE_CHECKS/farm3d/tests/cow-care.test.mjs" "$CANDIDATE_CHECKS/farm3d/tests/cow-yard.test.mjs" "$CANDIDATE_CHECKS/farm3d/tests/cow-rest-pose.test.mjs" "$CANDIDATE_CHECKS/farm3d/tests/animal-pen-save.test.mjs"
      - name: Verify private candidate manifest and shipped worktree remain unchanged
        if: ${{ !cancelled() }}
        run: |
          (cd "$CANDIDATE_CHECKS" && sha256sum --check --status "$RUNNER_TEMP/daytime-candidate-files.sha256")
          (cd "$CANDIDATE_CHECKS" && find . -printf '%y %p\n' | sort) > "$RUNNER_TEMP/daytime-candidate-paths-after.txt"
          cmp "$RUNNER_TEMP/daytime-candidate-paths.txt" "$RUNNER_TEMP/daytime-candidate-paths-after.txt"
          test "$(sha256sum farm3d/index.html | cut -d ' ' -f1)" = 6ed974f5d0571ef070d50fa81d0f30c8b840f5f283e5a75e46fc8d424225131b
          git diff --quiet && git diff --cached --quiet
      - name: Install Chromium (setup only)
        working-directory: farm3d/tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Observe exact shipped base under kernel isolation
        run: |
          TEST_ARTIFACTS="$QUALIFICATION_ROOT/base" node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$QUALIFICATION_ROOT/base.receipt.json" --timeout-ms 420000 -- node farm3d/tests/daytime-cow-mirror-qualification.browser.cjs base
      - name: Observe exact synthetic candidate tree under kernel isolation
        run: |
          TEST_ARTIFACTS="$QUALIFICATION_ROOT/candidate" node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$QUALIFICATION_ROOT/candidate.receipt.json" --timeout-ms 420000 -- node farm3d/tests/daytime-cow-mirror-qualification.browser.cjs candidate
      - name: Validate and retain finite paired metrics before hard verdict
        id: evidence
        if: ${{ !cancelled() }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const {validReceipt}=require('./farm3d/tests/helpers/ci-isolated-runner.cjs');
          const read=(p,cap)=>{const s=fs.lstatSync(p);assert(s.isFile()&&s.size>=2&&s.size<=cap);return JSON.parse(fs.readFileSync(p,'utf8'));};
          const root=process.env.QUALIFICATION_ROOT,pub=path.join(root,'public');fs.mkdirSync(pub);
          const receipts={};for(const label of ['probe','accounting','regressions','candidate-regressions','verify','base','candidate']){const p=path.join(root,label+'.receipt.json');if(fs.existsSync(p)){const r=read(p,8192);assert(validReceipt(r));receipts[label]=r;}}
          fs.writeFileSync(path.join(pub,'receipts.json'),JSON.stringify(receipts),{flag:'wx'});
          for(const label of ['accounting','regressions','candidate-regressions','verify','base','candidate']){const r=receipts[label];assert(r?.status==='passed'&&r.isolationVerified&&r.commandStarted&&r.commandResultAvailable&&r.cleanupVerified&&r.exitCode===0,'qualification execution incomplete');}
          const meetingKeys=['attempts','repeatedBeforeConfirmation','confirmed','confirmedAttempt','unmatchedConfirmation','worldL','worldR','screenL','screenR','distinctDirectedPairs','distinctUnorderedPairs','repeatConfirmedPairs','worldDistinctL','worldDistinctR','screenDistinctL','screenDistinctR'].sort();
          function validateMeetings(m,herd,counters){
           assert(m&&typeof m==='object'&&!Array.isArray(m)&&Object.keys(m).sort().join(',')===meetingKeys.join(','));
           for(const key of meetingKeys)assert(Number.isSafeInteger(m[key])&&m[key]>=0&&m[key]<=1000000);
           assert(m.repeatedBeforeConfirmation<=m.attempts&&m.confirmedAttempt<=m.attempts&&m.confirmedAttempt+m.unmatchedConfirmation===m.confirmed);
           assert(m.distinctUnorderedPairs<=herd*(herd-1)/2&&m.distinctDirectedPairs<=herd*(herd-1));
           assert(m.distinctUnorderedPairs<=m.distinctDirectedPairs&&m.distinctDirectedPairs<=m.confirmed&&m.repeatConfirmedPairs===m.confirmed-m.distinctUnorderedPairs);
           const events=counters.filter(([k])=>k.includes('/day/')&&k.endsWith('/cowEncounter'));
           assert.equal(m.confirmed,events.reduce((s,[,v])=>s+v,0),'independent physical meeting ledger must equal original observer');
           for(const [axis,left,right,ltest,rtest] of [['world','worldL','worldR','/x-/','/x+/'],['screen','screenL','screenR','/left/','/right/']]){
            assert.equal(m[left],events.filter(([k])=>k.includes(ltest)).reduce((s,[,v])=>s+v,0));
            assert.equal(m[right],events.filter(([k])=>k.includes(rtest)).reduce((s,[,v])=>s+v,0));
            assert(m[axis+'DistinctL']<=m.distinctUnorderedPairs&&m[axis+'DistinctR']<=m.distinctUnorderedPairs&&m[axis+'DistinctL']<=m[left]&&m[axis+'DistinctR']<=m[right]);
           }
           return Object.fromEntries(meetingKeys.map(k=>[k,m[k]]));
          }
          const project = report => {
          const exact = (value, keys) => value && typeof value === 'object' &&
            !Array.isArray(value) && Object.keys(value).sort().join(',') === keys;
          if (!exact(report, 'cases,lane,schema,source') || report.schema !== 1 ||
              !Array.isArray(report.cases) || report.cases.length !== 6)
            throw Error('Invalid aggregate report');
          const occupancyKey = /^(?:early|day1|night1|day2|night2)\/(?:day|night)\/x[+-]\/z[+-]\/(?:right|left)\/(?:(?:ordinary|robot|drink|bed|feed|otherCare)\/cowSeconds|cowEncounter|unverifiedSocialArrival|gap0to1_5|gap1_5to2_5|gap2_5to4|gapOver4)$/;
          const phases = {early:40,day1:200,night1:120,day2:240,night2:120};
          const editFields = ['editAttempts','editDispatched','editValidated','editApplied','editChoice','editStage','editKind','editIssueMask'];
          const totals = ['ordinaryLowToHigh','ordinaryHighToLow','socialSelected','socialPlanned',
            'socialAbandoned','socialUnresolved','containmentViolations','containmentOutsideFrames','physicalBedArrivals','bedHoldAwayFrames','frames'];
          const seen = new Set();
          const cases = report.cases.map(c => {
            if (!exact(c, 'counters,herd,layout,meetings,seed,status') || ![1, 4242].includes(c.seed) ||
                ![2, 5].includes(c.herd) || !['default','moved'].includes(c.layout) ||
                !['pass','setup-refused'].includes(c.status) ||
                (c.layout === 'moved' && c.herd !== 5) ||
                (c.layout === 'default' && c.status !== 'pass') ||
                !Array.isArray(c.counters) || c.counters.length > 1024)
              throw Error('Invalid aggregate case');
            const id = [c.layout,c.herd,c.seed].join('/');
            if (seen.has(id)) throw Error('Duplicate aggregate case');
            seen.add(id);
            const keys = new Set();
            const legalKey = k => {
              if (k === 'initialLowX' || occupancyKey.test(k) || (c.layout === 'moved' && editFields.includes(k))) return true;
              const [phase, field, ...rest] = k.split('/');
              return !rest.length && Object.hasOwn(phases, phase) && totals.includes(field);
            };
            const counters = c.counters.map(pair => {
              if (!Array.isArray(pair) || pair.length !== 2 ||
                  typeof pair[0] !== 'string' || !legalKey(pair[0]) ||
                  !Number.isFinite(pair[1]) || pair[1] < 0 || pair[1] > 10000000 ||
                  keys.has(pair[0])) throw Error('Invalid aggregate counter');
              keys.add(pair[0]);
              return [pair[0], pair[1]];
            });
            const values = new Map(counters);
            if (c.layout === 'moved') {
              const edit = Object.fromEntries(editFields.map(key => [key,values.get(key)]));
              if (editFields.some(key => !Number.isSafeInteger(edit[key]) || edit[key] < 0 || edit[key] > (key === 'editIssueMask' ? 255 : 11)) ||
                  edit.editStage < 1 || edit.editStage > 5 || edit.editKind > 2 ||
                  edit.editKind !== (edit.editChoice === 0 ? 0 : edit.editChoice <= 8 ? 1 : 2) || edit.editDispatched > edit.editAttempts ||
                  edit.editValidated > edit.editDispatched || edit.editApplied > edit.editValidated ||
                  (c.status === 'pass' && (edit.editStage !== 5 || edit.editChoice < 1 || edit.editApplied !== 1)) ||
                  (c.status === 'setup-refused' && (edit.editStage === 5 || edit.editChoice !== 0 || edit.editApplied !== 0)))
                throw Error('Invalid move witness');
            }
            if (c.status === 'setup-refused') {
              if (values.size !== editFields.length) throw Error('Refused case contains observations');
            } else {
              const low = values.get('initialLowX');
              if (!Number.isSafeInteger(low) || low < 0 || low > c.herd) throw Error('Invalid startup count');
              for (const [phase, seconds] of Object.entries(phases)) {
                for (const key of totals)
                  if (!Number.isSafeInteger(values.get(phase+'/'+key))) throw Error('Missing phase count');
                if (values.get(phase+'/frames') !== 30*seconds) throw Error('Invalid measured frames');
                if (values.get(phase+'/physicalBedArrivals') > c.herd ||
                    values.get(phase+'/containmentOutsideFrames') > 30*seconds*c.herd ||
                    values.get(phase+'/bedHoldAwayFrames') > 30*seconds*c.herd) throw Error('Invalid physical counters');
                let cowSeconds = 0;
                for (const [key, value] of values) {
                  if (!key.startsWith(phase+'/') || !key.endsWith('/cowSeconds')) continue;
                  if (key.split('/')[1] !== (phase.startsWith('night') ? 'night' : 'day'))
                    throw Error('Mismatched phase');
                  cowSeconds += value;
                }
                if (Math.abs(cowSeconds - seconds*c.herd) > 0.0001) throw Error('Invalid measured cow-time');
              }
            }
            assert.equal(c.status,'pass','all original fixtures must install');
          const meetings=validateMeetings(c.meetings,c.herd,counters);
          return {seed:c.seed,herd:c.herd,layout:c.layout,status:c.status,counters,meetings};
          });
          return {schema:1,cases};
          };
          const expected={"default/2/1":"b25e60f9f34d2c98e115080e7882d07a0e9c6c556845b63a41189c5efcb5b88f","default/5/1":"963924da78c619237d9a302f3929066d52d740d29af9b85a7238fc3bc3b319ef","moved/5/1":"bd5f99fb75faa04041ae0b9ebc51ad86a54a12c69c57b9b70799323fedb6de7b","default/2/4242":"6bde36999896f6cc40b13d87f5e41ce7bd2773116cdc471c68815205839aa732","default/5/4242":"1d6d71299f7891b23ecc6f18d2b486a0e588313379508875015dba6011995ef7","moved/5/4242":"c30f3438c38f3d7091377c45902c6bf245a0cd995b45a4a4831b31eafb999d59"},pins={base:'9e6f2763dd7781b761ccaef2f2cfa680d57b4783',candidate:'ba02621a9d9805c4fcf9d017be5921e2955fa517'},lanes={};
          for(const lane of ['base','candidate']){const r=read(path.join(root,lane,'daytime-mirror-qualification.json'),524288);assert(r.source===pins[lane]&&r.lane===lane);lanes[lane]=project(r);}
          const groups={};for(const lane of ['base','candidate']){groups[lane]={};for(const group of ['stock','edited','all'])groups[lane][group]=Object.fromEntries(meetingKeys.map(k=>[k,0]));}
          const deltas=[];
          for(const [i,b] of lanes.base.cases.entries()){
           const c=lanes.candidate.cases[i],key=[b.layout,b.herd,b.seed].join('/');
           assert.deepEqual([c.layout,c.herd,c.seed],[b.layout,b.herd,b.seed]);
           assert.equal(crypto.createHash('sha256').update(JSON.stringify(b.counters)).digest('hex'),expected[key],'exact retained main baseline');
           const bv=new Map(b.counters),cv=new Map(c.counters);
           for(const k of ['initialLowX',...(b.layout==='moved'?['editChoice','editKind','editApplied']:[])])assert.equal(bv.get(k),cv.get(k),'matched fixture');
           for(const lane of ['base','candidate'])for(const group of [b.layout==='default'?'stock':'edited','all'])for(const k of meetingKeys)groups[lane][group][k]+=lanes[lane].cases[i].meetings[k];
           deltas.push({layout:b.layout,herd:b.herd,seed:b.seed,delta:Object.fromEntries(meetingKeys.map(k=>[k,c.meetings[k]-b.meetings[k]]))});
          }
          assert.equal(groups.base.stock.confirmed,21);assert.equal(groups.base.all.confirmed,25);
          assert.equal(groups.base.stock.worldL,14);assert.equal(groups.base.stock.worldR,7);
          const out={schema:1,baseSource:pins.base,candidateTree:pins.candidate,groups,deltas,...lanes};
          fs.writeFileSync(path.join(pub,'daytime-mirror-qualification.json'),JSON.stringify(out),{flag:'wx'});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'qualification=true\n');
          NODE
      - name: Preserve finite isolation receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: daytime-mirror-qualification-receipts-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daytime-mirror-qualification/public/receipts.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve all six finite comparisons even if acceptance is red
        if: steps.evidence.outputs.qualification == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: daytime-mirror-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daytime-mirror-qualification/public/daytime-mirror-qualification.json
          if-no-files-found: error
          retention-days: 7
      - name: Require containment, original120s beds and genuine stock spatial gain
        if: ${{ !cancelled() }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync(path.join(process.env.QUALIFICATION_ROOT,'public/daytime-mirror-qualification.json'),'utf8'));
          for(const c of r.candidate.cases){
           const v=new Map(c.counters);
           for(const phase of ['early','day1','night1','day2','night2']){
            assert.equal(v.get(phase+'/containmentViolations'),0,'original sampled containment');
            assert.equal(v.get(phase+'/containmentOutsideFrames'),0,'every-frame containment');
            assert.equal(v.get(phase+'/bedHoldAwayFrames'),0,'no invalid fully weighted bed hold');
            assert.equal(v.get(phase+'/physicalBedArrivals'),phase.startsWith('night')?c.herd:0,'all real reserved bed arrivals by original120s deadline');
           }
           assert.equal(c.meetings.unmatchedConfirmation,0,'labels or unmatched attempts cannot count improvement');
          }
          const b=r.groups.base,c=r.groups.candidate;
          assert(c.stock.confirmed>=b.stock.confirmed&&c.all.confirmed>=b.all.confirmed,'no stock or combined loss in actual physical meetings');
          assert(c.stock.worldR>=b.stock.worldR+1,'previously minority stock world half gains at least one actual meeting');
          assert(Math.min(c.stock.worldL,c.stock.worldR)>=Math.min(b.stock.worldL,b.stock.worldR)+1,'no swapped imbalance');
          assert(Math.min(c.stock.worldDistinctL,c.stock.worldDistinctR)>=Math.min(b.stock.worldDistinctL,b.stock.worldDistinctR)+1,'spatial gain must include distinct per-fixture pair-side coverage, not repeats');
          console.log('Fixture-only candidate passed bounded comparison; not release, visual or deployment approval');
          NODE
