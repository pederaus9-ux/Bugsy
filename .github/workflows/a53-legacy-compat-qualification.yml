name: A53 exact legacy compatibility and full release qualification
on:
  push:
    branches: [codex/a53-legacy-compat-qualification-20261117]
permissions:
  contents: read
concurrency:
  group: a53-legacy-cow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch immutable historical package baseline
        run: git fetch --no-tags --depth=1 origin 2f9a8241b8230938dd816e1c0fac52551a263f69
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/firebase/package-lock.json
      - name: Verify reviewed bytes and unchanged protection
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = ced176bbcdd79a884caf972371686b2c6fb50d80
          sha256sum -c farm3d/tests/fixtures/a53-legacy-source-files.sha256
          node -e "require('./farm3d/tests/helpers/a53-regression-evidence.cjs').verifySource(process.cwd(),process.env.GITHUB_SHA)"
          test "$(sha256sum farm3d/tests/helpers/ci-isolated-runner.cjs | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          mkdir -p "$RUNNER_TEMP/a53-diagnostic-receipts" artifacts/a53-regression-diagnostic
      - name: Prove kernel isolation
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-diagnostic-receipts/namespace.json" --timeout-ms 10000 --probe-only
      - name: Finite diagnostic reporter and collector controls
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-diagnostic-receipts/controls.json" --timeout-ms 180000 -- node --test farm3d/tests/a53-regression-diagnostic.test.cjs
      - name: All save and cow assertions with explicitly corrected legal-start positive fixture
        run: >-
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-diagnostic-receipts/regressions.json" --timeout-ms 360000 --max-output-bytes 4194304 -- node --test --test-reporter=./farm3d/tests/helpers/a53-regression-reporter.cjs
          farm3d/tests/restore-recovery.test.mjs farm3d/tests/restore-recovery-scope.test.mjs
          farm3d/tests/save-writer-compatibility.test.mjs farm3d/tests/ordinary-layout-transaction.test.mjs
          farm3d/tests/animal-pen-save.test.mjs farm3d/tests/cow-writer-compatibility.test.mjs
          farm3d/tests/cow-care-integration.test.mjs farm3d/tests/cow-personal-space.test.mjs
          farm3d/tests/cow-stale-bed-route.test.mjs farm3d/tests/cow-intermediate-rejoin.test.mjs
          farm3d/tests/animal-pen-cow-runtime.test.mjs farm3d/tests/animal-pen-cow-rebind.test.mjs
          farm3d/tests/animal-pen-cow-resume.test.mjs farm3d/tests/animal-pen-cow-contact-rebind.test.mjs
          farm3d/tests/animal-pen-cow-separation.test.mjs farm3d/tests/animal-pen-cow-support.test.mjs
          farm3d/tests/animal-pen-robot-arrival.test.mjs farm3d/tests/animal-pen-robot-phase.test.mjs
          farm3d/tests/versions.test.mjs
          farm3d/tests/cow-legal-opposed-rejoin.test.mjs farm3d/tests/cow-legal-opposed-rejoin-v2.test.mjs
          farm3d/tests/cow-recorded-preentry.test.cjs
          farm3d/tests/a53-rejoin-fixture-lineage.test.cjs
      - name: Verify preservation and export bounded failure witnesses
        id: projection
        if: always()
        run: |
          sha256sum -c farm3d/tests/fixtures/a53-legacy-source-files.sha256
          node -e "require('./farm3d/tests/helpers/a53-regression-evidence.cjs').verifySource(process.cwd(),process.env.GITHUB_SHA)"
          git diff --quiet HEAD --
          git diff --cached --quiet --
          node farm3d/tests/helpers/a53-regression-evidence.cjs --source "$RUNNER_TEMP/a53-diagnostic-receipts" --output "$RUNNER_TEMP/a53-diagnostic-public" --root "$GITHUB_WORKSPACE" --head "$GITHUB_SHA"
      - name: Retain finite failure witnesses only
        if: ${{ always() && steps.projection.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: a53-legacy-regressions-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a53-diagnostic-public/
          if-no-files-found: error
          retention-days: 14
  offline_save:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch immutable historical package baseline
        run: git fetch --no-tags --depth=1 origin 2f9a8241b8230938dd816e1c0fac52551a263f69
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/firebase/package-lock.json
      - name: Verify reviewed bytes and unchanged protection
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = ced176bbcdd79a884caf972371686b2c6fb50d80
          sha256sum -c farm3d/tests/fixtures/a53-legacy-source-files.sha256
          node -e "require('./farm3d/tests/helpers/a53-regression-evidence.cjs').verifySource(process.cwd(),process.env.GITHUB_SHA)"
          test "$(sha256sum farm3d/tests/helpers/ci-isolated-runner.cjs | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          mkdir -p "$RUNNER_TEMP/a53-cow-receipts" artifacts/a53-cow-release
      - name: Prove kernel isolation
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-cow-receipts/namespace.json" --timeout-ms 10000 --probe-only
      - name: Inert exact scope and finite evidence controls
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-cow-receipts/inert.json" --timeout-ms 180000 -- node --test farm3d/tests/a53-cow-recovery-scope.test.cjs farm3d/tests/a53-final-scope.test.cjs farm3d/tests/a53-cow-release-evidence.test.cjs
      - name: New installed journey contract controls
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-cow-receipts/contracts.json" --timeout-ms 180000 -- node --test farm3d/tests/a53-installed-cow-cache.contract.test.cjs
      - name: Preserve historical source package and UI proofs
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-cow-receipts/source-package.json" --timeout-ms 180000 -- node farm3d/tests/pages-package.verify.cjs --source-only
      - name: Install locked test browser dependencies
        working-directory: farm3d/firebase
        run: npm ci --ignore-scripts
      - name: Install pinned Chromium and system dependencies
        working-directory: farm3d/firebase
        run: npx playwright install --with-deps chromium
      - name: Configure disposable browser paths
        run: |
          echo "PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/farm3d/firebase/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(node -e 'console.log(require("./farm3d/firebase/node_modules/playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Exact v93 to v94 installed update offline and synthetic saved farm
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/a53-cow-release
        run: |
          sha256sum -c farm3d/tests/fixtures/a53-legacy-source-files.sha256
          node -e "require('./farm3d/tests/helpers/a53-regression-evidence.cjs').verifySource(process.cwd(),process.env.GITHUB_SHA)"
          node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-cow-receipts/installed.json" --timeout-ms 600000 --max-output-bytes 4194304 -- env A52_COW_RELEASE_BROWSER_APPROVED=1 node farm3d/tests/a52-installed-cow-cache.browser.cjs
      - name: Verify and project finite evidence only
        id: projection
        if: always()
        run: |
          sha256sum -c farm3d/tests/fixtures/a53-legacy-source-files.sha256
          node -e "require('./farm3d/tests/helpers/a53-regression-evidence.cjs').verifySource(process.cwd(),process.env.GITHUB_SHA)"
          git diff --quiet HEAD --
          git diff --cached --quiet --
          node farm3d/tests/helpers/a53-cow-release-evidence.cjs --source "$RUNNER_TEMP/a53-cow-receipts" --output "$RUNNER_TEMP/a53-cow-public" --head "$GITHUB_SHA" --root "$GITHUB_WORKSPACE" --result "$GITHUB_WORKSPACE/artifacts/a53-cow-release/a52-installed-cow-cache/results.json"
      - name: Retain bounded qualification receipts only
        if: ${{ always() && steps.projection.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: a53-legacy-offline-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a53-cow-public/
          if-no-files-found: error
          retention-days: 14
  package:
    name: Independent actual Pages output, not baseline regression clearance
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch immutable historical package baseline
        run: git fetch --no-tags --depth=1 origin 2f9a8241b8230938dd816e1c0fac52551a263f69
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify unchanged source and package helpers
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = ced176bbcdd79a884caf972371686b2c6fb50d80
          sha256sum -c farm3d/tests/fixtures/a53-legacy-source-files.sha256
          node -e "require('./farm3d/tests/helpers/a53-regression-evidence.cjs').verifySource(process.cwd(),process.env.GITHUB_SHA)"
          test "$(sha256sum farm3d/tests/helpers/ci-isolated-runner.cjs | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          test "$(sha256sum farm3d/tests/helpers/a52-jekyll-build.cjs | cut -d ' ' -f1)" = 1fa99e2be1a1a660429328f18954b595a5ba0929782945ab9422eb7f7588e946
          test "$(sha256sum farm3d/tests/helpers/a52-workflow-receipts.cjs | cut -d ' ' -f1)" = d9e887bd1876f1ddbc5c3a12cf1d2aa6a103091caa12d53cc57d69561199e124
          mkdir -p "$RUNNER_TEMP/a53-package-safe" "$RUNNER_TEMP/a53-package-public"
      - name: Protected historical source and UI verification
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-package-safe/step-1.json" --timeout-ms 180000 -- node farm3d/tests/pages-package.verify.cjs --source-only
      - name: Original official isolated Jekyll toolchain
        run: node farm3d/tests/helpers/a52-jekyll-build.cjs "$GITHUB_WORKSPACE" "$GITHUB_SHA" "$RUNNER_TEMP/a53-package-safe/jekyll-build.json"
      - name: Verify actual built output and dependency bytes
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-package-safe/step-2.json" --timeout-ms 180000 -- node farm3d/tests/pages-package.verify.cjs --output _site
      - name: Preserve finite original package receipts and actual source identity
        id: projection
        if: always()
        run: |
          sha256sum -c farm3d/tests/fixtures/a53-legacy-source-files.sha256
          node -e "require('./farm3d/tests/helpers/a53-regression-evidence.cjs').verifySource(process.cwd(),process.env.GITHUB_SHA)"
          git diff --quiet HEAD --
          git diff --cached --quiet --
          test "$(sha256sum farm3d/tests/helpers/a52-workflow-receipts.cjs | cut -d ' ' -f1)" = d9e887bd1876f1ddbc5c3a12cf1d2aa6a103091caa12d53cc57d69561199e124
          node farm3d/tests/helpers/a52-workflow-receipts.cjs pages-package-validation/package "$RUNNER_TEMP/a53-package-safe" "$RUNNER_TEMP/a53-package-public/package" "$GITHUB_SHA"
      - name: Upload finite actual package receipts only
        if: ${{ always() && steps.projection.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: a53-legacy-package-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a53-package-public/package/
          if-no-files-found: error
          retention-days: 14

  legacy:
    name: Original legacy ${{ matrix.case }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        case: [core_game, characters, field, quality_scope, chicken, market]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch immutable historical package baseline
        run: git fetch --no-tags --depth=1 origin 2f9a8241b8230938dd816e1c0fac52551a263f69
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Verify exact reviewed source and unchanged isolation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = ced176bbcdd79a884caf972371686b2c6fb50d80
          sha256sum -c farm3d/tests/fixtures/a53-legacy-source-files.sha256
          node -e "require('./farm3d/tests/helpers/a53-regression-evidence.cjs').verifySource(process.cwd(),process.env.GITHUB_SHA)"
          test "$(sha256sum farm3d/tests/helpers/ci-isolated-runner.cjs | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          mkdir -p "$RUNNER_TEMP/a53-legacy-safe" "$RUNNER_TEMP/a53-legacy-public" artifacts/a53-legacy/${{ matrix.case }}
      - name: Prove unchanged kernel isolation
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-legacy-safe/namespace.json" --timeout-ms 10000 --probe-only
      - name: Inert compatibility and finite evidence controls
        run: node farm3d/tests/helpers/ci-isolated-runner.cjs --receipt "$RUNNER_TEMP/a53-legacy-safe/controls.json" --timeout-ms 180000 -- node --test farm3d/tests/a53-legacy-evidence.test.cjs farm3d/tests/a53-browser-cache-compatibility.test.cjs
      - name: Install locked test browser dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install pinned Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Configure disposable browser paths
        run: |
          echo "PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/farm3d/tests/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(node -e 'console.log(require("./farm3d/tests/node_modules/playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Original complete command, not a selected-test subset
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/a53-legacy/${{ matrix.case }}
        run: |
          runner="$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          case '${{ matrix.case }}' in
            core_game)
              cd farm3d/tests
              node "$runner" --receipt "$RUNNER_TEMP/a53-legacy-safe/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'npm run test:core:game'
              ;;
            characters)
              cd farm3d/tests
              node "$runner" --receipt "$RUNNER_TEMP/a53-legacy-safe/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'npm run test:core:characters'
              ;;
            field)
              node "$runner" --receipt "$RUNNER_TEMP/a53-legacy-safe/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- node --test farm3d/tests/field-rollback-scope.test.mjs farm3d/tests/plot-support.test.mjs farm3d/tests/field-support-scope.test.mjs farm3d/tests/workshop-site.test.mjs farm3d/tests/animal-pen-save.test.mjs farm3d/tests/animal-pen-validation.test.mjs farm3d/tests/restore-recovery.test.mjs farm3d/tests/player-arm-attachment-integration.test.mjs
              ;;
            quality_scope)
              node "$runner" --receipt "$RUNNER_TEMP/a53-legacy-safe/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- node --test farm3d/tests/sound-scope.test.mjs farm3d/tests/perf-scope.test.mjs farm3d/tests/a52-regression-registration.test.cjs
              ;;
            chicken)
              cd farm3d/tests
              node "$runner" --receipt "$RUNNER_TEMP/a53-legacy-safe/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node --test versions.test.mjs && node chicken-pen-update.browser.cjs'
              ;;
            market)
              node "$runner" --receipt "$RUNNER_TEMP/a53-legacy-safe/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- node --test farm3d/tests/market-sales.test.mjs farm3d/tests/versions.test.mjs
              node "$runner" --receipt "$RUNNER_TEMP/a53-legacy-safe/step-2.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- node farm3d/tests/market-sales.browser.cjs
              ;;
            *) exit 64;;
          esac
      - name: Preserve exact source and project finite evidence only
        id: legacy_projection
        if: always()
        run: |
          sha256sum -c farm3d/tests/fixtures/a53-legacy-source-files.sha256
          node -e "require('./farm3d/tests/helpers/a53-regression-evidence.cjs').verifySource(process.cwd(),process.env.GITHUB_SHA)"
          node farm3d/tests/helpers/a53-legacy-evidence.cjs "$GITHUB_SHA" '${{ matrix.case }}' "$RUNNER_TEMP/a53-legacy-safe" "$RUNNER_TEMP/a53-legacy-public/execution"
          if [ '${{ matrix.case }}' = chicken ]; then
            node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/a53-legacy-safe/step-1.json'));if(r.status==='passed'&&!fs.existsSync(process.env.RUNNER_TEMP+'/a53-chicken-update/phase.json'))throw Error('Successful chicken command missing phase proof');"
          fi
          if [ '${{ matrix.case }}' = chicken ] && [ -f "$RUNNER_TEMP/a53-chicken-update/phase.json" ]; then
            node farm3d/tests/helpers/a53-chicken-update-diagnostic.cjs "$RUNNER_TEMP/a53-chicken-update/phase.json" "$RUNNER_TEMP/a53-legacy-safe/step-1.json" "$RUNNER_TEMP/a53-legacy-public/chicken-diagnostic.json" "$GITHUB_SHA"
          fi
          if [ '${{ matrix.case }}' = market ]; then
            mkdir "$RUNNER_TEMP/a53-market-safe"
            for name in step-1.json step-2.json; do
              if [ -f "$RUNNER_TEMP/a53-legacy-safe/$name" ]; then cp "$RUNNER_TEMP/a53-legacy-safe/$name" "$RUNNER_TEMP/a53-market-safe/$name"; fi
            done
            if [ -f "$RUNNER_TEMP/a52-ci-safe/market-sales/diagnostic.json" ]; then cp "$RUNNER_TEMP/a52-ci-safe/market-sales/diagnostic.json" "$RUNNER_TEMP/a53-market-safe/diagnostic.json"; fi
            node farm3d/tests/helpers/a52-workflow-receipts.cjs farm3d-regression/market-sales "$RUNNER_TEMP/a53-market-safe" "$RUNNER_TEMP/a53-legacy-public/market" "$GITHUB_SHA"
          fi
      - name: Upload only bounded receipts and phase enums
        if: ${{ always() && steps.legacy_projection.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: a53-legacy-${{ matrix.case }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a53-legacy-public/
          if-no-files-found: error
          retention-days: 14
