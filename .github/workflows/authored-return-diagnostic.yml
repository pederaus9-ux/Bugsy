name: Authored return failure snapshot
on:
  push:
    branches: [diagnostic/authored-return-20261019]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Original preceding export validation
        run: |
          node farm3d/tools/validate-asset.mjs farm3d/assets/hands/hands-candidate.glb farm3d/art/asset-contract.json hands
          node farm3d/tests/hands-validator.cjs
      - name: Original preceding hand study
        run: node farm3d/tools/capture-hands-study.cjs
      - name: Unchanged authored test; snapshot only after a failure
        working-directory: farm3d/tests
        run: node --require ./authored-failure-snapshot.cjs authored-hands.browser.cjs
      - name: Original following normal-farm and offline checks
        run: node farm3d/tests/hands-production.browser.cjs
      - name: Original following in-game captures
        run: node farm3d/tools/capture-hands-game.cjs
      - name: Preserve original result and failure state
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: authored-return-snapshot-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/
          retention-days: 14
