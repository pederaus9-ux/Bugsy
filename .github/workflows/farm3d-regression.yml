        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "farm3d/tests/helpers/a52-workflow-receipts.cjs" && test ! -L "farm3d/tests/helpers/a52-workflow-receipts.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = b4980e09b3691446144de4fe36aaaa6d6e9380fb463bf3df675b82042a109d4f
          test -f "farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "farm3d/tests/helpers/a52-workflow-receipts.cjs" farm3d-regression/market-sales "$RUNNER_TEMP/a52-ci-safe/market-sales" "$RUNNER_TEMP/a52-ci-public/market-sales" "$A52_CANDIDATE_HEAD"
      - name: Preserve actual previews, partial results and failure traces
        if: ${{ (always()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: market-sales-${{ github.run_attempt }}-execution-receipts-only
          path: ${{ runner.temp }}/a52-ci-public/market-sales/
          if-no-files-found: error
          retention-days: 14
