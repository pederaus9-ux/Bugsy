name: Sunny Acres 3D regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'farm3d/**'
      - '.github/workflows/farm3d-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farm3d-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  utility-lights:
    name: Farm Utility real lighting + native touch + offline saves
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: farm3d/tests
      - run: npx playwright install --with-deps chromium
        working-directory: farm3d/tests
      - name: Utility ownership, geometry, light budget and cache contracts
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/utility-lights"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/utility-lights/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node --test farm3d/tests/save-writer-compatibility.test.mjs farm3d/tests/utility-lights.test.mjs farm3d/tests/decor-models.test.mjs farm3d/tests/decor-save.test.mjs farm3d/tests/holiday-decor.test.mjs farm3d/tests/holiday-clearings.test.mjs farm3d/tests/versions.test.mjs'
      - name: Real illuminated farm, trusted input, GPU ownership and installed51to52 update
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/utility-lights"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/utility-lights/step-2.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/utility-lights.browser.cjs'
      - name: Validate and project exact execution receipts
        id: public_receipts
        if: always()
        env:
          A52_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "farm3d/tests/helpers/a52-workflow-receipts.cjs" && test ! -L "farm3d/tests/helpers/a52-workflow-receipts.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = b4980e09b3691446144de4fe36aaaa6d6e9380fb463bf3df675b82042a109d4f
          test -f "farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "farm3d/tests/helpers/a52-workflow-receipts.cjs" farm3d-regression/utility-lights "$RUNNER_TEMP/a52-ci-safe/utility-lights" "$RUNNER_TEMP/a52-ci-public/utility-lights" "$A52_CANDIDATE_HEAD"
      - name: Preserve actual night captures, partial results and failure traces
        if: ${{ (always()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: utility-lights-${{ github.run_attempt }}-execution-receipts-only
          path: ${{ runner.temp }}/a52-ci-public/utility-lights/
          if-no-files-found: error
          retention-days: 14
