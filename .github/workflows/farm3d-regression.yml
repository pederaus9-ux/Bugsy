name: Sunny Acres 3D regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'farm3d/**'
      - '.github/workflows/farm3d-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farm3d-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  utility-lights:
    name: Farm Utility real lighting + native touch + offline saves
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: farm3d/tests
      - run: npx playwright install --with-deps chromium
        working-directory: farm3d/tests
      - name: Utility ownership, geometry, light budget and cache contracts
        run: node --test farm3d/tests/save-writer-compatibility.test.mjs farm3d/tests/utility-lights.test.mjs farm3d/tests/decor-models.test.mjs farm3d/tests/decor-save.test.mjs farm3d/tests/holiday-decor.test.mjs farm3d/tests/holiday-clearings.test.mjs farm3d/tests/versions.test.mjs
      - name: Real illuminated farm, trusted input, GPU ownership and installed51to52 update
        run: node farm3d/tests/utility-lights.browser.cjs
      - name: Preserve actual night captures, partial results and failure traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: utility-lights-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/utility-*
          if-no-files-found: error
          retention-days: 14
  market-sales:
    name: Market Sales + six-hour quotes + offline saves
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: farm3d/tests
      - run: npx playwright install --with-deps chromium
        working-directory: farm3d/tests
      - name: Price, stock, quality, stale-confirmation and read-only contracts
        run: node --test farm3d/tests/market-sales.test.mjs farm3d/tests/versions.test.mjs
      - name: Native sales at390/844/1280 and actual49-to50 installed offline update
        run: node farm3d/tests/market-sales.browser.cjs
      - name: Preserve actual previews, partial results and failure traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: market-sales-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/market-sales*
          if-no-files-found: error
          retention-days: 14
  decor-catalog:
    name: All54 decor coverage +31 solid models + native saves
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: farm3d/tests
      - run: npx playwright install --with-deps chromium
        working-directory: farm3d/tests
      - name: Geometry, fixed orientation, all54 save IDs and grass contracts
        run: node --test farm3d/tests/decor-models.test.mjs farm3d/tests/decor-save.test.mjs farm3d/tests/holiday-decor.test.mjs farm3d/tests/holiday-clearings.test.mjs farm3d/tests/versions.test.mjs
      - name: Actual31model gallery, native buy/move/save and real50to51 offline update
        run: node farm3d/tests/decor-catalog.browser.cjs
      - name: Retain real captures, partial results and failure traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: decor-catalog-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/decor-*
          retention-days: 14
  holiday-decor:
    name: Solid holiday decorations + orientation + saves
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: farm3d/tests
      - run: npx playwright install --with-deps chromium
        working-directory: farm3d/tests
      - name: Solid geometry, complete silhouettes and disposal contracts
        run: node --test farm3d/tests/holiday-decor.test.mjs farm3d/tests/holiday-clearings.test.mjs farm3d/tests/versions.test.mjs
      - name: Matched old/new orbit, actual guest placement/reload and full-resolution captures
        run: node farm3d/tests/holiday-decor.browser.cjs
      - name: Preserve actual renders, partial results and failure traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: holiday-depth-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/holiday*
          retention-days: 14
  regression:
    name: Farm3D regression (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [node, browser]
    env:
      FARM3D_CORE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Run regression suite
        working-directory: farm3d/tests
        run: npm run test:core:game
      - name: Save screenshots, failure traces and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-regression-${{ matrix.group }}-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  characters-polish:
    name: Farmer + first-person + visual polish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Run unchanged character checks and new scene checks
        working-directory: farm3d/tests
        run: npm run test:core:characters
      - name: Save screenshots, failure traces and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-characters-polish-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  animal-visuals:
    name: Six-species animal visual review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Review all six species, poses, live layouts and rendering budget
        working-directory: farm3d/tests
        run: npm run test:animals
      - name: Save animal screenshots, failure traces and measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-animal-visuals-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  saves:
    name: Old saves + save measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Old-save fixtures, risk probes and measurements
        working-directory: farm3d/tests
        run: npm run test:saves
      - name: Save results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-saves-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  analytics:
    name: Anonymous analytics + owner dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Report bounds, privacy, real game hooks and dashboard filters
        working-directory: farm3d/tests
        run: npm run test:analytics
      - name: Save analytics screenshots and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-analytics-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  accessibility:
    name: Mobile accessibility + motion + focus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Phone targets, panel fit, motion, auth focus and hidden rendering
        working-directory: farm3d/tests
        run: npm run test:accessibility
      - name: Save accessibility screenshots and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-accessibility-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  firebase-rules:
    name: Firestore rules + economy functions + game flows + save recovery (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/firebase/package-lock.json
      - name: Install isolated rules-test dependencies
        working-directory: farm3d/firebase
        run: npm ci --ignore-scripts
      - name: Install Cloud Functions dependencies (run only in the Functions emulator)
        working-directory: farm3d/firebase/functions
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/firebase
        run: npx playwright install --with-deps chromium
      - name: Rules, economy functions, real game flows and save recovery against the Firestore + Auth + Functions emulators
        working-directory: farm3d/firebase
        run: npm test
      - name: Exact production SDK browser modules and blocked-storage sign-in boot
        working-directory: farm3d/tests
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/farm3d/firebase/node_modules/playwright
        run: node --test sdk.test.mjs && node sdk.browser.cjs
      - name: Save flow results and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-firebase-${{ github.run_attempt }}
          path: |
            farm3d/firebase/artifacts/
            farm3d/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  seed-selection:
    name: Seed selection + repeated walking planting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Seed equipment, repeated planting and unchanged save data
        working-directory: farm3d/tests
        run: npm run test:planting
      - name: Save actual game screenshots, failure traces and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-seed-selection-${{ github.run_attempt }}
          path: |
            farm3d/tests/artifacts/seed-selection/
            farm3d/tests/artifacts/seed-selection*.png
            farm3d/tests/artifacts/seed-selection*.zip
          if-no-files-found: error
          retention-days: 14

  chicken-pen:
    name: Chicken pen + care + native touch
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Fetch immutable base for real installed-worker update
        run: git fetch --depth 1 https://github.com/pederaus9-ux/Bugsy.git 756df378e7adbe20f34c204dc54172b1030e16bd
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Chicken care and interaction contracts
        id: chicken-contracts
        working-directory: farm3d/tests
        run: node --test chicken-pet-view.test.mjs chicken-care.test.mjs chicken-care-integration.test.mjs chicken-yard.test.mjs chicken-yard-interaction.test.mjs
      - name: Chicken stations and native touch
        working-directory: farm3d/tests
        run: node chicken-pen.browser.cjs
      - name: Preserve actual frames, videos, partial results and failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-chicken-pen-${{ github.run_attempt }}
          path: |
            farm3d/tests/artifacts/chicken-pen/
            farm3d/tests/artifacts/chicken-pen-update/
            farm3d/tests/artifacts/chicken-*.png
            farm3d/tests/artifacts/chicken-*.zip
          if-no-files-found: error
          retention-days: 14

  chicken-update:
    name: Chicken installed update +30-bird offline save
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Fetch immutable installed base
        run: git fetch --depth 1 https://github.com/pederaus9-ux/Bugsy.git 756df378e7adbe20f34c204dc54172b1030e16bd
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Chicken installed update +30-bird offline save
        working-directory: farm3d/tests
        run: node --test versions.test.mjs && node chicken-pen-update.browser.cjs
      - name: Preserve frames, video, partial results and failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-chicken-update-${{ github.run_attempt }}
          path: |
            farm3d/tests/artifacts/chicken-pen-update/
            farm3d/tests/artifacts/chicken-*.png
            farm3d/tests/artifacts/chicken-*.zip
          if-no-files-found: error
          retention-days: 14

  chicken-flock30:
    name: Thirty-chicken full-flock touch (${{ matrix.width }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        width: [844, 390]
    env:
      FLOCK_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        if: ${{ matrix.width != 844 }}
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Diagnose pinned Chromium installation phases (844 only)
        if: ${{ matrix.width == 844 }}
        working-directory: farm3d/tests
        run: node browser-install-diagnostic.cjs
      - name: Thirty-chicken full-flock touch + game evidence
        working-directory: farm3d/tests
        run: node --test chicken-care.test.mjs chicken-care-integration.test.mjs chicken-yard.test.mjs chicken-yard-interaction.test.mjs && node chicken-flock30.browser.cjs
      - name: Preserve frames, video, partial results and failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-chicken-flock30-${{ matrix.width }}-${{ github.run_attempt }}
          path: |
            farm3d/tests/artifacts/chicken-flock30/
            farm3d/tests/artifacts/chicken-*.png
            farm3d/tests/artifacts/chicken-*.zip
          if-no-files-found: error
          retention-days: 14
