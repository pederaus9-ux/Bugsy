      - name: Save screenshots, failure traces and results
        if: ${{ (!cancelled()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-regression-${{ matrix.group }}-${{ github.run_attempt }}-execution-receipts-only
