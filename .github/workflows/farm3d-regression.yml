  regression:
    name: Farm3D regression (${{ matrix.group }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [node, browser]
    env:
      FARM3D_CORE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Run regression suite
        working-directory: farm3d/tests
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/regression"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
