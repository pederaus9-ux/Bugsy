name: Sunny Acres 3D regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'farm3d/**'
      - '.github/workflows/farm3d-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farm3d-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Farm3D regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install isolated test dependencies
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Run regression suite
        working-directory: farm3d/tests
        run: npm test
      - name: Save screenshots, failure traces and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: farm3d-regression-${{ github.run_attempt }}
          path: farm3d/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7
