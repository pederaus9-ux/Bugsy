name: Field terrain support qualification
on:
  pull_request:
    branches: [main]
    paths: ['farm3d/**', '.github/workflows/field-support-qualification.yml']
  push:
    branches: [main]
    paths: ['farm3d/plot-support.js', 'farm3d/index.html', 'farm3d/sw.js', '.github/workflows/field-support-qualification.yml']
permissions:
  contents: read
concurrency:
  group: field-support-${{ github.ref }}
  cancel-in-progress: true
jobs:
  field:
    name: Historical field v76 source, native crops and preserved upgrades (0d0542b)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: 0d0542bf93e4e010b5543e81a40fae4bca2dd5f9
          fetch-depth: 0
      - name: Provision exact candidate boundary without changing historical checkout
        env:
          CI_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CI_CANDIDATE_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$CI_CANDIDATE_HEAD"
          runner=farm3d/tests/helpers/ci-isolated-runner.cjs
          git --no-lazy-fetch -c protocol.allow=never show "$CI_CANDIDATE_HEAD:$runner" > "$RUNNER_TEMP/ci-isolated-runner.cjs"
          test "$(git hash-object "$RUNNER_TEMP/ci-isolated-runner.cjs")" = "$(git rev-parse "$CI_CANDIDATE_HEAD:$runner")"
          git --no-lazy-fetch -c protocol.allow=never show "$CI_CANDIDATE_HEAD:farm3d/tests/helpers/a52-workflow-receipts.cjs" > "$RUNNER_TEMP/a52-workflow-receipts.cjs"
          test "$(git rev-parse HEAD)" = "0d0542bf93e4e010b5543e81a40fae4bca2dd5f9"
          git fetch --no-tags --depth=1 origin 4e91a6628bb53b709b5ef643551651a44180ab94
          test "$(git rev-parse FETCH_HEAD)" = "4e91a6628bb53b709b5ef643551651a44180ab94"
      - name: Identify immutable historical source separately from candidate
        run: |
          test "$(git rev-parse HEAD)" = "0d0542bf93e4e010b5543e81a40fae4bca2dd5f9"
          printf '{"testedSource":"%s","candidate":"%s","coverage":"historical-field-v76"}\n' "$(git rev-parse HEAD)" "${{ github.event.pull_request.head.sha || github.sha }}" > "$RUNNER_TEMP/field-source.json"
      - name: Fetch and verify accepted v75 source without changing checkout
        run: |
          git fetch --no-tags --depth=1 origin ac4c438bc9cfe76f266e56a5687e4eb0ebc4958b
          test "$(git rev-parse FETCH_HEAD)" = "ac4c438bc9cfe76f266e56a5687e4eb0ebc4958b"
          test "$(git rev-parse HEAD)" = "0d0542bf93e4e010b5543e81a40fae4bca2dd5f9"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install locked browser tools
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install pinned sandboxed Chromium
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Use isolated browser executable
        run: echo "CHROME_PATH=$(node -e 'console.log(require("./farm3d/tests/node_modules/playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Footprint, historical reconstruction, save and support contracts
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/field"
          test -f "$RUNNER_TEMP/ci-isolated-runner.cjs" && test ! -L "$RUNNER_TEMP/ci-isolated-runner.cjs"
          test "$(sha256sum "$RUNNER_TEMP/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$RUNNER_TEMP/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/field/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node --test farm3d/tests/plot-support.test.mjs farm3d/tests/field-support-scope.test.mjs farm3d/tests/workshop-site.test.mjs farm3d/tests/animal-pen-save.test.mjs farm3d/tests/animal-pen-validation.test.mjs farm3d/tests/restore-recovery.test.mjs farm3d/tests/player-arm-attachment-integration.test.mjs'
      - name: Native guest selection, planting, reload, harvest and reload
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/field/native
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/field"
          test -f "$RUNNER_TEMP/ci-isolated-runner.cjs" && test ! -L "$RUNNER_TEMP/ci-isolated-runner.cjs"
          test "$(sha256sum "$RUNNER_TEMP/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$RUNNER_TEMP/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/field/step-2.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/plot-support.browser.cjs'
      - name: Independent installed v75-to-v76 online and offline upgrade
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/field/cache-v75-v76
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/field"
          test -f "$RUNNER_TEMP/ci-isolated-runner.cjs" && test ! -L "$RUNNER_TEMP/ci-isolated-runner.cjs"
          test "$(sha256sum "$RUNNER_TEMP/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$RUNNER_TEMP/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/field/step-3.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/field-support-cache.browser.cjs'
      - name: Preserved historical v73-to-v75 journey
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/field/cache-v73-v75
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/field"
          test -f "$RUNNER_TEMP/ci-isolated-runner.cjs" && test ! -L "$RUNNER_TEMP/ci-isolated-runner.cjs"
          test "$(sha256sum "$RUNNER_TEMP/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$RUNNER_TEMP/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/field/step-4.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/animal-pen-cache-v73-to-v74.browser.cjs'
      - name: Preserved historical v74-to-v75 journey
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/field/cache-v74-v75
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/field"
          test -f "$RUNNER_TEMP/ci-isolated-runner.cjs" && test ! -L "$RUNNER_TEMP/ci-isolated-runner.cjs"
          test "$(sha256sum "$RUNNER_TEMP/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$RUNNER_TEMP/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/field/step-5.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/animal-pen-cache-v74-to-v75.browser.cjs
          '
      - name: Validate and project exact execution receipts
        id: public_receipts
        if: ${{ !cancelled() }}
        env:
          A52_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "$RUNNER_TEMP/a52-workflow-receipts.cjs" && test ! -L "$RUNNER_TEMP/a52-workflow-receipts.cjs"
          test "$(sha256sum "$RUNNER_TEMP/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = 95ddea4bb15d3a21c9160f586f37e98cf207a66b34479901273f8e9e9e52878a
          test -f "$RUNNER_TEMP/ci-isolated-runner.cjs" && test ! -L "$RUNNER_TEMP/ci-isolated-runner.cjs"
          test "$(sha256sum "$RUNNER_TEMP/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$RUNNER_TEMP/a52-workflow-receipts.cjs" field-support-qualification/field "$RUNNER_TEMP/a52-ci-safe/field" "$RUNNER_TEMP/a52-ci-public/field" "$A52_CANDIDATE_HEAD"
      - name: Preserve bounded field outcomes
        if: ${{ (!cancelled()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: field-support-${{ github.run_attempt }}-execution-receipts-only
          path: ${{ runner.temp }}/a52-ci-public/field/
          if-no-files-found: error
          retention-days: 14

  rollback:
    name: Current field rollback, exact saved crops and v76-to-v77 offline update
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify candidate and immutable rollback inputs without changing checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch --no-tags --depth=1 origin ac4c438bc9cfe76f266e56a5687e4eb0ebc4958b
          test "$(git rev-parse FETCH_HEAD)" = "ac4c438bc9cfe76f266e56a5687e4eb0ebc4958b"
          git fetch --no-tags --depth=1 origin 0d0542bf93e4e010b5543e81a40fae4bca2dd5f9
          test "$(git rev-parse FETCH_HEAD)" = "0d0542bf93e4e010b5543e81a40fae4bca2dd5f9"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: farm3d/tests/package-lock.json
      - name: Install locked browser tools
        working-directory: farm3d/tests
        run: npm ci --ignore-scripts
      - name: Install pinned sandboxed Chromium
        working-directory: farm3d/tests
        run: npx playwright install --with-deps chromium
      - name: Use isolated browser executable
        run: echo "CHROME_PATH=$(node -e 'console.log(require("./farm3d/tests/node_modules/playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Exact rollback, historical reconstruction, save and support contracts
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/rollback"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/rollback/step-1.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node --test farm3d/tests/field-rollback-scope.test.mjs farm3d/tests/plot-support.test.mjs farm3d/tests/field-support-scope.test.mjs farm3d/tests/workshop-site.test.mjs farm3d/tests/animal-pen-save.test.mjs farm3d/tests/animal-pen-validation.test.mjs farm3d/tests/restore-recovery.test.mjs farm3d/tests/player-arm-attachment-integration.test.mjs'
      - name: Installed v76-to-v77 online and offline rollback preserves exact farm
        env:
          TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/rollback/cache-v76-v77
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/rollback"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/rollback/step-2.json" --timeout-ms 1200000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/field-rollback-cache.browser.cjs'
      - name: Validate and project exact execution receipts
        id: public_receipts
        if: ${{ !cancelled() }}
        env:
          A52_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "farm3d/tests/helpers/a52-workflow-receipts.cjs" && test ! -L "farm3d/tests/helpers/a52-workflow-receipts.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = 95ddea4bb15d3a21c9160f586f37e98cf207a66b34479901273f8e9e9e52878a
          test -f "farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "farm3d/tests/helpers/a52-workflow-receipts.cjs" field-support-qualification/rollback "$RUNNER_TEMP/a52-ci-safe/rollback" "$RUNNER_TEMP/a52-ci-public/rollback" "$A52_CANDIDATE_HEAD"
      - name: Preserve bounded rollback outcomes
        if: ${{ (!cancelled()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: field-rollback-${{ github.run_attempt }}-execution-receipts-only
          path: ${{ runner.temp }}/a52-ci-public/rollback/
          if-no-files-found: error
          retention-days: 14
