name: Pages package validation
on:
  pull_request:
    branches: [main]
    paths:
      - '_config.yml'
      - 'farm3d/**'
      - '.github/workflows/pages-package-validation.yml'
permissions:
  contents: read
concurrency:
  group: pages-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Pages-compatible build and runtime package
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch immutable evidence baseline
        run: git fetch --no-tags --depth=1 origin 2f9a8241b8230938dd816e1c0fac52551a263f69
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify source contract and deliberate failure controls
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/package"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/package/step-1.json" --timeout-ms 900000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/pages-package.verify.cjs --source-only'
      - name: Build using the official GitHub Pages toolchain
        env:
          A52_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/package"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/a52-jekyll-build.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/a52-jekyll-build.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/a52-jekyll-build.cjs" | cut -d ' ' -f1)" = 1fa99e2be1a1a660429328f18954b595a5ba0929782945ab9422eb7f7588e946
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/a52-jekyll-build.cjs" "$GITHUB_WORKSPACE" "$A52_BUILD_REVISION" "$RUNNER_TEMP/a52-ci-safe/package/jekyll-build.json"
      - name: Verify actual output, game bytes and dependency paths
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-safe/package"
          test -f "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          node "$GITHUB_WORKSPACE/farm3d/tests/helpers/ci-isolated-runner.cjs" --receipt "$RUNNER_TEMP/a52-ci-safe/package/step-2.json" --timeout-ms 900000 --max-output-bytes 16777216 -- bash --noprofile --norc -e -o pipefail -c 'node farm3d/tests/pages-package.verify.cjs --output _site --report "$RUNNER_TEMP/pages-package.json"'
      - name: Validate and project exact execution receipts
        id: public_receipts
        if: ${{ !cancelled() }}
        env:
          A52_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/a52-ci-public"
          test -f "farm3d/tests/helpers/a52-workflow-receipts.cjs" && test ! -L "farm3d/tests/helpers/a52-workflow-receipts.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-workflow-receipts.cjs" | cut -d ' ' -f1)" = d9e887bd1876f1ddbc5c3a12cf1d2aa6a103091caa12d53cc57d69561199e124
          test -f "farm3d/tests/helpers/ci-isolated-runner.cjs" && test ! -L "farm3d/tests/helpers/ci-isolated-runner.cjs"
          test "$(sha256sum "farm3d/tests/helpers/ci-isolated-runner.cjs" | cut -d ' ' -f1)" = cdb1d4ad2da88964c10053ce34bfd3e269cb929fecb7e4d6314a864154c9656a
          test -f "farm3d/tests/helpers/a52-jekyll-build.cjs" && test ! -L "farm3d/tests/helpers/a52-jekyll-build.cjs"
          test "$(sha256sum "farm3d/tests/helpers/a52-jekyll-build.cjs" | cut -d ' ' -f1)" = 1fa99e2be1a1a660429328f18954b595a5ba0929782945ab9422eb7f7588e946
          node "farm3d/tests/helpers/a52-workflow-receipts.cjs" pages-package-validation/package "$RUNNER_TEMP/a52-ci-safe/package" "$RUNNER_TEMP/a52-ci-public/package" "$A52_CANDIDATE_HEAD"
      - name: Retain small package receipt
        if: ${{ (!cancelled()) && steps.public_receipts.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: pages-package-${{ github.run_attempt }}-execution-receipts-only
          path: ${{ runner.temp }}/a52-ci-public/package/
          if-no-files-found: error
          retention-days: 14
