<!doctype html><html><head><style>html,body{margin:0;background:#000;overflow:hidden}</style></head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {Reflector} from 'three/addons/objects/Reflector.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const W = 1600, H = 900;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020302);
const pmrem = new THREE.PMREMGenerator(renderer);
// dark studio: a few soft light strips instead of RoomEnvironment's bright boxes
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x050505);
const strip = (w, h, col, pos, rotY) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: col, side: THREE.DoubleSide}));
  m.position.copy(pos); m.rotation.y = rotY || 0; m.lookAt(0, 0, 0); envScene.add(m);
};
strip(14, 1.2, new THREE.Color(1.4, 1.3, 1.1), new THREE.Vector3(0, 9, 0));
strip(10, 0.6, new THREE.Color(1.2, 0.85, 0.25), new THREE.Vector3(-8, 3, -4));
strip(10, 0.6, new THREE.Color(0.6, 1.1, 0.25), new THREE.Vector3(8, 3, 4));
strip(8, 0.5, new THREE.Color(0.9, 0.9, 0.85), new THREE.Vector3(0, 4, -9));
scene.environment = pmrem.fromScene(envScene, 0.02).texture;
scene.environmentIntensity = 0.8;

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);

// lights: warm key, cool rim, soft top
const key = new THREE.DirectionalLight(0xfff1d6, 1.1); key.position.set(-4, 5, -3); scene.add(key);
const rim = new THREE.DirectionalLight(0xfff0d0, 0.5); rim.position.set(4, 3, 4); scene.add(rim);
scene.add(new THREE.HemisphereLight(0x606060, 0x000000, 1.2));

// mirror floor, dimmed by a translucent black sheet
const mirror = new Reflector(new THREE.PlaneGeometry(40, 40), {textureWidth: W, textureHeight: H, color: 0x6a6a6a});
mirror.rotation.x = -Math.PI / 2; scene.add(mirror);
const dim = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
  new THREE.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: 0.55}));
dim.rotation.x = -Math.PI / 2; dim.position.y = 0.002; scene.add(dim);
// neon floor ring
const ring = new THREE.Mesh(new THREE.RingGeometry(3.05, 3.12, 128),
  new THREE.MeshBasicMaterial({color: new THREE.Color(1.6, 1.1, 0.2)}));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.004; scene.add(ring);

const tl = new THREE.TextureLoader();
const load = u => new Promise(r => tl.load(u, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; r(t); }));
const texP = await load('paint.png');

// ---- livery material: look up the Mustang GT4 template directly.
// Template layout (pixels): left side upright along the bottom (nose left),
// right side mirrored at y' = 2366 - y, top view in the middle row (nose left,
// car-left toward larger y), rear panel + bumper at the far right.
function liveryMaterial(box) {
  const m = new THREE.MeshPhysicalMaterial({color: 0xffffff, metalness: 0.05, roughness: 0.3,
    clearcoat: 1.0, clearcoatRoughness: 0.14});
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, {tP: {value: texP}, bMin: {value: box.min}, bMax: {value: box.max}});
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vObjPos; varying vec3 vObjN;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObjPos = (modelMatrix * vec4(position, 1.0)).xyz; vObjN = normalize(mat3(modelMatrix) * normal);');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vObjPos; varying vec3 vObjN;
        uniform sampler2D tP; uniform vec3 bMin, bMax;
        vec3 px(vec2 p) { return texture2D(tP, vec2(p.x / 2048.0, 1.0 - p.y / 2048.0)).rgb; }
        float remap(float v, float a, float b, float c, float d) { return mix(c, d, clamp((v - a) / (b - a), 0.0, 1.0)); }
        // height on the car -> template row of the left side panel
        float sideRow(float y) {
          if (y < 0.86) return remap(y, 0.18, 0.86, 1985.0, 1600.0);
          return remap(y, 0.86, 1.24, 1600.0, 1445.0);
        }
        vec3 livery(out float glow) {
          vec3 n = normalize(vObjN);
          float t = (vObjPos.z - bMin.z) / (bMax.z - bMin.z);             // 0 = nose
          float half_ = max(bMax.x, -bMin.x);
          float xs = vObjPos.x / half_;                                    // -1 car left .. 1 right
          // sides
          float sx = 250.0 + t * 1740.0;
          float sy = sideRow(vObjPos.y);
          vec3 side = n.x < 0.0 ? px(vec2(sx, sy)) : px(vec2(sx, 2366.0 - sy));
          // top: hood | roof | decklid, each centred on row 1192
          float z = vObjPos.z, tx, hw;
          if (z < -0.75)      { tx = remap(z, -2.27, -0.75, 110.0, 755.0);  hw = 360.0; }
          else if (z < -0.25) { tx = remap(z, -0.75, -0.25, 755.0, 760.0);  hw = 360.0; }
          else if (z < 0.62)  { tx = remap(z, -0.25, 0.62, 985.0, 1395.0);  hw = 305.0; }
          else                { tx = remap(z, 0.62, 2.1, 1430.0, 1690.0);   hw = 285.0; }
          vec3 top = px(vec2(tx, 1192.0 - xs * hw));
          // front / rear faces
          vec3 face = n.z > 0.0
            ? (vObjPos.y > 0.55 ? px(vec2(remap(vObjPos.y, 1.0, 0.55, 1735.0, 1875.0), 1190.0 - xs * 280.0))
                                : px(vec2(remap(vObjPos.y, 0.55, 0.2, 1910.0, 2010.0), 1190.0 - xs * 300.0)))
            : px(vec2(remap(vObjPos.y, 0.9, 0.2, 260.0, 105.0), 1192.0 + xs * 340.0));
          vec3 w = pow(abs(n), vec3(4.0));
          w /= (w.x + w.y + w.z + 1e-4);
          vec3 c = side * w.x + top * w.y + face * w.z;
          float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b));
          glow = smoothstep(0.55, 0.95, mx) * smoothstep(0.15, 0.5, mx - mn);
          return c;
        }`)
      .replace('#include <map_fragment>', `float glowAmt; vec3 liv = livery(glowAmt);
        diffuseColor.rgb = liv;`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += pow(liv, vec3(2.2)) * (glowAmt * 1.2 + 0.35);`);
  };
  return m;
}

const loader = new GLTFLoader();
const draco = new DRACOLoader(); draco.setDecoderPath('./node_modules/three/examples/jsm/libs/draco/gltf/');
loader.setDRACOLoader(draco);
const gltf = await loader.loadAsync('ferrari.glb');
const car = gltf.scene;
scene.add(car);

const bodyBox = new THREE.Box3();
car.updateMatrixWorld(true);
car.traverse(o => { if (o.isMesh && o.name === 'body') bodyBox.setFromObject(o); });

const gold = new THREE.MeshPhysicalMaterial({color: 0xd8a018, metalness: 1, roughness: 0.25});
const blackGloss = new THREE.MeshPhysicalMaterial({color: 0x050505, metalness: 0.2, roughness: 0.3, clearcoat: 1});
const gunmetal = new THREE.MeshPhysicalMaterial({color: 0x15161a, metalness: 1, roughness: 0.35});
const glass = new THREE.MeshPhysicalMaterial({color: 0x050706, metalness: 0.2, roughness: 0.14,
  transmission: 0.0, transparent: true, opacity: 0.88});
car.traverse(o => {
  if (!o.isMesh) return;
  const n = o.material.name;
  if (o.name === 'body') o.material = liveryMaterial(bodyBox);
  else if (n === 'Ferrari_Yellow') o.material = gold;
  else if (n === 'Glass_Gray') o.material = glass;
  else if (n === 'metal_chrome' || n === 'metal_gray') o.material = /rim|wheel/.test(o.name) ? gunmetal : blackGloss;
  else if (n === 'plastic_gray') o.material = blackGloss;
  else if (n === 'Tires') o.material = new THREE.MeshStandardMaterial({color: 0x0b0b0b, roughness: 0.85});
  else if (/Interior|Leather|Carpet|Carbon/.test(n)) o.material = new THREE.MeshStandardMaterial({color: 0x0d0d0d, roughness: 0.7});
  else if (/Taillight/.test(n)) o.material = new THREE.MeshStandardMaterial({color: 0x300000, emissive: 0xff1010, emissiveIntensity: 0.5});
  else if (/Projector|LED/.test(n)) o.material = new THREE.MeshStandardMaterial({color: 0x333322, roughness: 0.4});
});

// ---- hardtop: the model is a Spider, so close the cabin into a coupe
function roofY(z) {           // crown height along the car
  const k = (z + 0.25) / 0.87;
  return 1.215 + 0.045 * Math.sin(Math.PI * Math.min(1, k * 1.25)) - 0.075 * Math.max(0, k - 0.6) / 0.4;
}
function roofGeometry(nz = 60, nx = 40) {
  const pos = [], idx = [];
  for (let i = 0; i <= nz; i++) {
    const z = -0.25 + 0.87 * i / nz;
    for (let j = 0; j <= nx; j++) {
      const u = -1 + 2 * j / nx, x = 0.64 * u;
      pos.push(x, roofY(z) - 0.11 * u * u, z);
    }
  }
  for (let i = 0; i < nz; i++) for (let j = 0; j < nx; j++) {
    const a = i * (nx + 1) + j, b = a + nx + 1;
    idx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const roof = new THREE.Mesh(roofGeometry(), liveryMaterial(bodyBox));
roof.material.side = THREE.DoubleSide;
scene.add(roof);
// tinted side glass from the roof edge down to the beltline
function sideGlass(sgn) {
  const pos = [], idx = [], n = 30;
  for (let i = 0; i <= n; i++) {
    const z = -0.62 + 1.3 * i / n;
    const zr = Math.min(0.62, Math.max(-0.25, z));
    const topY = z < -0.25 ? 0.9 + (roofY(-0.25) - 0.11 - 0.9) * (z + 0.62) / 0.37 : z > 0.62 ? 0.9 + (roofY(0.62) - 0.11 - 0.9) * (0.68 - z) / 0.06 : roofY(zr) - 0.11;
    pos.push(sgn * 0.64, Math.max(0.9, topY), z, sgn * 0.8, 0.88, z);
  }
  for (let i = 0; i < n; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const sideGlassMat = new THREE.MeshPhysicalMaterial({color: 0x040505, metalness: 0.3, roughness: 0.03, side: THREE.DoubleSide});
scene.add(new THREE.Mesh(sideGlass(1), sideGlassMat), new THREE.Mesh(sideGlass(-1), sideGlassMat));

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.55, 0.4, 0.85));
composer.addPass(new OutputPass());

// ---- GT wing: plate + stands, rear face shows the wing lettering from the paint
{
  const plateMat = new THREE.MeshPhysicalMaterial({color: 0x060606, metalness: 0.3, roughness: 0.35, clearcoat: 1});
  const txt = texP.clone(); txt.needsUpdate = true;
  txt.repeat.set((600 - 55) / 2048, (470 - 375) / 2048);
  txt.offset.set(55 / 2048, 1 - 470 / 2048);
  const faceMat = new THREE.MeshPhysicalMaterial({map: txt, emissiveMap: txt, emissive: 0xffffff,
    emissiveIntensity: 0.35, metalness: 0.2, roughness: 0.3, clearcoat: 1});
  const wing = new THREE.Group();
  const plate = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.03, 0.34), plateMat);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.155), faceMat);
  face.position.set(0, 0.07, 0.175);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.16, 0.012), plateMat);
  lip.position.set(0, 0.07, 0.168);
  wing.add(plate, lip, face);
  for (const s of [-1, 1]) {
    const ep = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.26, 0.46), plateMat);
    ep.position.set(s * 0.94, 0.02, 0.02); wing.add(ep);
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.34, 0.1), plateMat);
    post.position.set(s * 0.45, -0.18, -0.02); wing.add(post);
  }
  wing.position.set(0, 1.3, 1.95);
  scene.add(wing);
}

window.shot = (px, py, pz, tx, ty, tz, fov, ux, uy, uz) => {
  camera.fov = fov || 30; camera.updateProjectionMatrix();
  camera.up.set(ux ?? 0, uy ?? 1, uz ?? 0);
  camera.position.set(px, py, pz); camera.lookAt(tx, ty, tz);
  composer.render();
  return renderer.domElement.toDataURL('image/png');
};
window.READY = true;
</script></body></html>
