<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sunny Acres · 3D cow preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dce9cb;color:#29442e;font:16px system-ui;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}header,footer{position:absolute;z-index:2;left:0;right:0;background:#fffaf0ed;padding:8px max(12px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:10px}header{top:0}footer{bottom:0}h1{margin:0;font-size:18px}p{margin:0;font-size:13px}nav{display:flex;gap:6px}button,a{min-height:44px;font:inherit;border:1px solid #8ea384;border-radius:12px;padding:7px 14px;background:#fffaf0;color:#29442e;cursor:pointer}button[aria-pressed=true]{background:#486d44;color:white}a{text-decoration:none;display:flex;align-items:center;font-size:13px}#status{position:absolute;top:45%;text-align:center;width:100%;pointer-events:none}@media(max-height:410px){header,footer{padding-top:4px;padding-bottom:4px}h1{font-size:15px}button{padding:5px 10px}p{font-size:12px}}@media(max-width:550px){header,footer{flex-wrap:wrap}h1{font-size:15px}p{display:none}nav{gap:4px}button{padding:5px 10px}}
</style></head><body>
<header><div><h1>Sunny Acres · 3D cow preview</h1><p>Drag to look from every angle. Watch the head, ears and feet.</p></div><button id="reset">Reset view</button></header>
<div id="status" role="status">Getting Bessie ready…</div>
<footer><nav aria-label="Cow movement"><button data-mode="idle" aria-pressed="true">Stand</button><button data-mode="walk" aria-pressed="false">Walk</button><button data-mode="run" aria-pressed="false">Run</button><button data-mode="eat" aria-pressed="false">Graze</button></nav><a href="./?testfarm&amp;characters3d&amp;loco&amp;perf">Try on the farm</a></footer>
<script type="module">
import * as THREE from './lib/three.module.min.js';
import {createCow3D,updateCow3D,COW_GAIT} from './cow3d.js?v=5';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd0e8ee);scene.fog=new THREE.Fog(0xd0e8ee,20,45);
scene.add(new THREE.HemisphereLight(0xeaf6ff,0x687448,2));
const sun=new THREE.DirectionalLight(0xfff4df,3);sun.position.set(-5,8,-6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.normalBias=.018;Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10});scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshStandardMaterial({color:0x91ac72,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// Sparse meadow markers make planted feet and actual travel easy to judge.
const markers=new THREE.InstancedMesh(new THREE.CircleGeometry(.065,8),new THREE.MeshStandardMaterial({color:0xc3bc8c,roughness:1}),121),matrix=new THREE.Matrix4();
let i=0;for(let x=-10;x<=10;x+=2)for(let z=-10;z<=10;z+=2){matrix.makeRotationX(-Math.PI/2);matrix.setPosition(x,.004,z);markers.setMatrixAt(i++,matrix);}markers.receiveShadow=true;scene.add(markers);
const cow=createCow3D(1.7,3,0,3.4);scene.add(cow.g);
const camera=new THREE.PerspectiveCamera(40,1,.05,60);let mode='idle',speed=0,arc=0,time=0,last=0,yaw=.6,pitch=.25,dist=4.6,drag=null;
function choose(value){mode=value;for(const b of document.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b.dataset.mode===mode));}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>choose(b.dataset.mode));
document.querySelector('#reset').onclick=()=>{yaw=.6;pitch=.25;dist=4.6;draw();};
function draw(){const p=cow.g.position,cp=Math.cos(pitch);camera.position.set(p.x+Math.sin(yaw)*dist*cp,.85+Math.sin(pitch)*dist,p.z-Math.cos(yaw)*dist*cp);camera.lookAt(p.x,.85,p.z);renderer.render(scene,camera);}
function step(dt){
  time+=dt;const want=mode==='walk'?COW_GAIT.walk:mode==='run'?COW_GAIT.run:0;speed+=(want-speed)*(1-Math.exp(-dt*5));
  const ox=cow.g.position.x,oz=cow.g.position.z;arc+=speed*dt/3;cow.g.position.set(Math.cos(arc)*3,0,-Math.sin(arc)*3);
  updateCow3D(cow,cow.g.position.x-ox,cow.g.position.z-oz,dt,time,mode==='eat'?'eating':'idle');draw();
}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();draw();}addEventListener('resize',resize);
const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;yaw-=(e.clientX-drag.x)*.009;pitch=Math.max(-.08,Math.min(.9,pitch+(e.clientY-drag.y)*.007));drag.x=e.clientX;drag.y=e.clientY;draw();});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(2.7,Math.min(8,dist+e.deltaY*.004));draw();},{passive:false});
const manual=new URLSearchParams(location.search).has('capture');
function loop(now){if(!document.hidden&&!manual)step(Math.min(.05,last?(now-last)/1000:1/60));last=now;requestAnimationFrame(loop);}addEventListener('visibilitychange',()=>last=0);
resize();document.querySelector('#status').hidden=true;
// Debug references for deterministic pose tests and preview recordings only.
if(new URLSearchParams(location.search).has('debug'))window.cowPreview={cow,renderer,scene,camera,step,choose,draw,setView:(y,p=.25,d=4.6)=>{yaw=y;pitch=p;dist=d;draw();}};
requestAnimationFrame(loop);
</script></body></html>
