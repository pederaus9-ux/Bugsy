<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Barn Lighting Test</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9cc3e6;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 10px}
  .bar button{border:2px solid #fff;border-radius:18px;padding:8px 12px;font-weight:700;font-size:14px;color:#fff;background:rgba(40,30,15,.6);backdrop-filter:blur(4px)}
  .bar button.on{background:rgba(214,120,30,.9)}
  .paint{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 96px);display:flex;flex-direction:column;gap:8px;background:rgba(40,30,15,.62);backdrop-filter:blur(6px);
    border:2px solid #fff;border-radius:16px;padding:10px;color:#fff;font-weight:700;font-size:12px;max-width:170px}
  .paint .row{display:flex;flex-wrap:wrap;gap:6px}
  .paint .sw{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.7);padding:0}
  .paint .sw.on{outline:3px solid #ffb443;outline-offset:1px}
  .paint summary{cursor:pointer;list-style:none}
  [hidden]{display:none!important}
  .acard{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);max-width:460px;margin:0 auto;display:grid;grid-template-columns:72px 1fr;gap:4px 12px;
    background:rgba(250,244,228,.96);border:3px solid #8a5a2b;border-radius:18px;padding:10px 12px;color:#3d2a14;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .acard img{width:72px;height:72px;object-fit:contain;grid-row:span 2}
  .acInfo b{font-size:19px;display:block}
  .acInfo span{font-size:12px;font-weight:700;opacity:.7}
  .acInfo p{margin:3px 0 0;font-size:13px}
  .acBtns{grid-column:1 / -1;display:flex;gap:8px;justify-content:flex-end}
  .acBtns button{border:0;border-radius:12px;padding:8px 12px;font-weight:800;background:#6cbf4a;color:#fff}
  .acBtns #acClose{background:#d9c9a6;color:#3d2a14}
  .hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);left:0;right:0;transition:opacity .6s;pointer-events:none;text-align:center;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  /* economy HUD, the same look as the 2D game */
  :root{--wood-dk:#6E3D18; --fun:"Lilita One","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif}
  .out{color:#fff;text-shadow:0 2px 0 var(--wood-dk),2px 0 0 var(--wood-dk),-2px 0 0 var(--wood-dk),0 -2px 0 var(--wood-dk),1.5px 1.5px 0 var(--wood-dk),-1.5px 1.5px 0 var(--wood-dk),1.5px -1.5px 0 var(--wood-dk),-1.5px -1.5px 0 var(--wood-dk)}
  .hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
  .hud > *{pointer-events:auto}
  .lvlbox{display:flex;align-items:center}
  .star{width:56px;height:56px;position:relative;z-index:1;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .star svg{position:absolute;inset:0}
  .star b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fun);font-weight:400;font-size:21px;padding-top:4px}
  .xpbar{margin-left:-16px;width:118px;height:24px;background:rgba(70,35,10,.6);border:3px solid #fff;border-radius:0 13px 13px 0;position:relative;overflow:hidden}
  .xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#9BE36E,#4FAE2E);transition:width .4s}
  .xpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fun);font-size:13px;padding-left:10px}
  .money{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

  @keyframes bump{40%{transform:scale(1.25)}}
  .bump{animation:bump .35s ease-out}
  /* farming: seed tray, field card, barn, floating rewards */
  .tray{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);max-width:560px;margin:0 auto;z-index:6;
    background:rgba(250,244,228,.97);border:3px solid #8a5a2b;border-radius:18px;padding:8px 10px 10px;color:#3d2a14;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .tray h3{margin:0 0 6px;font:400 17px var(--fun);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tray h3 small{font:700 12px system-ui,sans-serif;opacity:.7}
  .tray .x{border:0;border-radius:10px;background:#d9c9a6;color:#3d2a14;font-weight:800;padding:4px 10px}

  .seed{flex:none;width:74px;border:2px solid #e2cfa4;border-radius:14px;background:#fff8e6;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;color:#3d2a14}

  .seed b{font-size:12px} .seed small{font-size:11px;font-weight:700;opacity:.75}
  .seed.on{border-color:#e98a1b;background:#ffe3b0;box-shadow:0 0 0 2px #e98a1b inset}
  .seed.locked{opacity:.45;filter:grayscale(1)}
  .items{display:flex;flex-wrap:wrap;gap:6px}
  .items span{background:#fff8e6;border:2px solid #e2cfa4;border-radius:12px;padding:3px 8px;font-weight:800;font-size:14px}
  .cap{height:8px;border-radius:5px;background:#e8dcc0;overflow:hidden;margin:4px 0 8px}.cap i{display:block;height:100%;background:#6cbf4a}.cap.full i{background:#e8513c}
  .fin{border:0;border-radius:12px;padding:8px 12px;font-weight:800;background:#48b4f0;color:#fff}
  .dock3{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:5}
  .dock3 button{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF2C4,#F2BF4B);border:4px solid #fff;font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .fx{position:fixed;z-index:6;pointer-events:none;font:400 22px var(--fun);transform:translate(-50%,-50%);animation:rise 1.1s ease-out forwards}
  @keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 84px);transform:translateX(-50%);z-index:6;font-family:var(--fun);font-size:20px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
</style>

<script type="module">
import * as THREE from "./lib/three.module.min.js";
import { EffectComposer } from "./lib/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "./lib/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "./lib/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "./lib/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "./lib/addons/postprocessing/ShaderPass.js";

const qs = new URLSearchParams(location.search);
// animal pictures live next to the 2D game in the repo, or beside the page when published on its own
const ART = document.querySelector('meta[name="art-path"]')?.content || "./art/";

// ---------------- renderer ----------------
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance", preserveDrawingBuffer:qs.has("shot")});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(innerWidth < innerHeight ? 50 : 38, innerWidth / innerHeight, 0.1, 600);

// ---------------- shared "weather" uniforms every material listens to ----------------
// Snow settles on upward-facing surfaces; rain darkens things and makes them glossy.
const WX = {uSnow:{value:0}, uWet:{value:0}};
function weatherShader(sh) {
  sh.uniforms.uSnow = WX.uSnow; sh.uniforms.uWet = WX.uWet;
  sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vWN; varying vec3 vWP;")
    .replace("#include <beginnormal_vertex>", `#include <beginnormal_vertex>
      #ifdef USE_INSTANCING
        vWN = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * objectNormal);
      #else
        vWN = normalize(mat3(modelMatrix) * objectNormal);
      #endif`)
    .replace("#include <worldpos_vertex>", `#include <worldpos_vertex>
      #ifdef USE_INSTANCING
        vWP = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
      #else
        vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;
      #endif`);
  sh.fragmentShader = sh.fragmentShader.replace("#include <common>", `#include <common>
    varying vec3 vWN; varying vec3 vWP; uniform float uSnow; uniform float uWet;
    float hsh(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(hsh(i), hsh(i+vec2(1,0)), f.x), mix(hsh(i+vec2(0,1)), hsh(i+vec2(1,1)), f.x), f.y); }`)
    .replace("#include <map_fragment>", `#include <map_fragment>
    float snowAmt = uSnow * smoothstep(0.3, 0.6, vWN.y + (vnoise(vWP.xz * 6.0) - 0.5) * 0.12 + (vnoise(vWP.xz * .8) - 0.5) * 0.08);
    diffuseColor.rgb *= mix(1.0, 0.62, uWet * (1.0 - snowAmt));
    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.93, 0.96, 1.0), snowAmt);`)
    .replace("#include <roughnessmap_fragment>", `#include <roughnessmap_fragment>
    roughnessFactor = mix(roughnessFactor, 0.18, uWet * 0.85 * (1.0 - snowAmt));
    roughnessFactor = mix(roughnessFactor, 0.7, snowAmt);`);
}
function weatherize(mat) { mat.onBeforeCompile = weatherShader; return mat; }

// Leaves and grass: light shines through them when the sun is behind (like real foliage),
// and their normals point outward from the plant instead of flipping per card, so a tree reads as one soft volume.
const LIT = {uSunDir:{value:new THREE.Vector3(0, 1, 0)}, uSunCol:{value:new THREE.Color()}};
function foliageShader(sh, trans = 1) {
  weatherShader(sh);
  Object.assign(sh.uniforms, LIT, {uTrans:{value:trans}});
  sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nuniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uTrans;")
    .replace("#include <normal_fragment_begin>", "float faceDirection = gl_FrontFacing ? 1.0 : -1.0;\nvec3 normal = normalize(vNormal);\nvec3 nonPerturbedNormal = normal;")
    .replace("#include <lights_fragment_end>", `#include <lights_fragment_end>
      vec3 Vw = normalize(vWP - cameraPosition);
      float back = pow(max(dot(Vw, normalize(uSunDir)), 0.0), 4.0);
      reflectedLight.indirectDiffuse += diffuseColor.rgb * uSunCol * (back * 0.9 + 0.1) * uTrans;`);
}
function foliage(mat, trans = 1, extra) { mat.onBeforeCompile = (sh) => { foliageShader(sh, trans); if (extra) extra(sh); }; return mat; }
let texturesReady = false; THREE.DefaultLoadingManager.onLoad = () => { texturesReady = true; };
const TL = new THREE.TextureLoader();
function photo(path, rep, color = true) {
  const t = TL.load(path); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(...rep);
  if (color) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const TEX = document.querySelector('meta[name="tex-path"]')?.content || "tex/";
const leafTex = photo(TEX + "leaves.webp"), barkTex = photo(TEX + "bark.jpg", [1, 3]);

// ---------------- procedural textures (drawn once, tiled) ----------------
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function canvas(n) { const c = document.createElement("canvas"); c.width = c.height = n; return [c, c.getContext("2d")]; }
function tex(c, color, rep = [1, 1]) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// turns a grayscale height canvas into a normal map
function normalFrom(hc, strength = 2) {
  const n = hc.width, src = hc.getContext("2d").getImageData(0, 0, n, n).data;
  const [c, x] = canvas(n), out = x.createImageData(n, n), H = (i, j) => src[(((j + n) % n) * n + ((i + n) % n)) * 4] / 255;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const dx = (H(i + 1, j) - H(i - 1, j)) * strength, dy = (H(i, j + 1) - H(i, j - 1)) * strength;
    const l = Math.hypot(dx, dy, 1), k = (j * n + i) * 4;
    out.data[k] = (-dx / l * .5 + .5) * 255; out.data[k + 1] = (dy / l * .5 + .5) * 255; out.data[k + 2] = (1 / l * .5 + .5) * 255; out.data[k + 3] = 255;
  }
  x.putImageData(out, 0, 0);
  return c;
}
function planks(base, seed, worn = .5) { // vertical painted barn boards
  const n = 512, [c, x] = canvas(n), [h, hx] = canvas(n), R = rng(seed), w = 64;
  hx.fillStyle = "#808080"; hx.fillRect(0, 0, n, n);
  for (let p = 0; p < n / w; p++) {
    const l = (R() - .5) * 18;
    x.fillStyle = `hsl(${base[0]},${base[1]}%,${base[2] + l * .35}%)`; x.fillRect(p * w, 0, w, n);
    for (let g = 0; g < 26; g++) { // wood grain
      const gx = p * w + R() * w; x.strokeStyle = `rgba(0,0,0,${.03 + R() * .06})`; x.lineWidth = .6 + R() * 1.4;
      x.beginPath(); x.moveTo(gx, 0); for (let y = 0; y <= n; y += 32) x.lineTo(gx + Math.sin(y * .02 + g) * 2.5, y); x.stroke();
      hx.strokeStyle = `rgba(0,0,0,${.05 + R() * .08})`; hx.lineWidth = x.lineWidth; hx.beginPath(); hx.moveTo(gx, 0); hx.lineTo(gx, n); hx.stroke();
    }
    if (R() < .45) { const ky = R() * n, kx = p * w + 10 + R() * (w - 20); x.fillStyle = "rgba(40,20,5,.35)"; x.beginPath(); x.ellipse(kx, ky, 4, 7, 0, 0, 7); x.fill(); }
    x.fillStyle = "rgba(20,10,5,.75)"; x.fillRect(p * w, 0, 3, n); hx.fillStyle = "#1a1a1a"; hx.fillRect(p * w, 0, 3, n);
    x.fillStyle = "rgba(255,255,255,.08)"; x.fillRect(p * w + 3, 0, 2, n);
  }
  for (let i = 0; i < 900 * worn; i++) { x.fillStyle = `rgba(${R() < .5 ? "235,225,205" : "60,40,25"},${R() * .18})`; x.fillRect(R() * n, R() * n, 1 + R() * 4, 1 + R() * 10); }
  return [c, normalFrom(h, 3)];
}
function shingles(seed, base = [30, 12, 28]) {
  const n = 512, [c, x] = canvas(n), [h, hx] = canvas(n), R = rng(seed), rh = 32, tw = 44;
  for (let r = 0; r < n / rh; r++) for (let t = -1; t < n / tw + 1; t++) {
    const ox = t * tw + (r % 2) * tw / 2 + (R() - .5) * 4, y = r * rh, v = R();
    x.fillStyle = `hsl(${base[0] - 5 + v * 12},${base[1] - 4 + v * 8}%,${base[2] - 6 + v * 14}%)`; x.fillRect(ox, y, tw - 2, rh);
    const g = hx.createLinearGradient(0, y, 0, y + rh); g.addColorStop(0, "#303030"); g.addColorStop(1, "#d0d0d0");
    hx.fillStyle = g; hx.fillRect(ox, y, tw - 2, rh);
    x.fillStyle = "rgba(0,0,0,.45)"; x.fillRect(ox, y + rh - 3, tw - 2, 3);
    for (let s = 0; s < 30; s++) { x.fillStyle = `rgba(${R() < .5 ? 255 : 0},${R() < .5 ? 255 : 0},${R() < .5 ? 255 : 0},.06)`; x.fillRect(ox + R() * tw, y + R() * rh, 2, 2); }
  }
  return [c, normalFrom(h, 4)];
}
function stones(seed) {
  const n = 512, [c, x] = canvas(n), [h, hx] = canvas(n), R = rng(seed);
  x.fillStyle = "#6f675c"; x.fillRect(0, 0, n, n); hx.fillStyle = "#202020"; hx.fillRect(0, 0, n, n);
  for (let i = 0; i < 190; i++) {
    const cx = R() * n, cy = R() * n, rx = 18 + R() * 26, ry = 12 + R() * 16, l = 48 + R() * 22;
    for (const [ox, oy] of [[0, 0], [n, 0], [-n, 0], [0, n], [0, -n]]) {
      const g = x.createRadialGradient(cx + ox - rx * .3, cy + oy - ry * .4, 2, cx + ox, cy + oy, rx);
      g.addColorStop(0, `hsl(35,${8 + R() * 10}%,${l + 10}%)`); g.addColorStop(1, `hsl(30,8%,${l - 12}%)`);
      x.fillStyle = g; x.beginPath(); x.ellipse(cx + ox, cy + oy, rx, ry, R(), 0, 7); x.fill();
      const hg = hx.createRadialGradient(cx + ox, cy + oy, 1, cx + ox, cy + oy, rx); hg.addColorStop(0, "#fff"); hg.addColorStop(1, "#555");
      hx.fillStyle = hg; hx.beginPath(); hx.ellipse(cx + ox, cy + oy, rx, ry, 0, 0, 7); hx.fill();
    }
  }
  return [c, normalFrom(h, 3)];
}
function grass(seed) {
  const n = 1024, [c, x] = canvas(n), R = rng(seed);
  x.fillStyle = "#5d8c32"; x.fillRect(0, 0, n, n);
  for (let i = 0; i < 60; i++) { // soft color patches
    const cx = R() * n, cy = R() * n, r = 60 + R() * 160, hue = 75 + R() * 25;
    for (const [ox, oy] of [[0, 0], [n, 0], [-n, 0], [0, n], [0, -n]]) {
      const g = x.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, r);
      g.addColorStop(0, `hsla(${hue},${40 + R() * 20}%,${30 + R() * 14}%,.35)`); g.addColorStop(1, "hsla(90,40%,35%,0)");
      x.fillStyle = g; x.fillRect(cx + ox - r, cy + oy - r, r * 2, r * 2);
    }
  }
  x.lineCap = "round";
  for (let i = 0; i < 26000; i++) { // blades
    const px = R() * n, py = R() * n, len = 4 + R() * 9, a = -Math.PI / 2 + (R() - .5) * .9;
    x.strokeStyle = `hsl(${70 + R() * 35},${35 + R() * 35}%,${22 + R() * 30}%)`; x.lineWidth = .8 + R() * 1.1;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len); x.stroke();
  }
  return c;
}

  g.position.set(FIELD_C.x + lx * Math.cos(FIELD_ROT) + lz * Math.sin(FIELD_ROT), 0, FIELD_C.z - lx * Math.sin(FIELD_ROT) + lz * Math.cos(FIELD_ROT)); g.rotation.y = FIELD_ROT;
  g.add(box(2.2, .12, 2.2, M.tilled, 0, .04, 0, .5));
  for (const z of [-.7, 0, .7]) { const row = new THREE.Mesh(furrowGeo, M.tilled); row.position.set(0, .1, z); row.castShadow = row.receiveShadow = true; g.add(row); } // rounded, mounded rows
  contact(g.position.x, g.position.z, 3.2, 3.2);
  const plants = new THREE.Group(); plants.position.y = .2; g.add(plants);
  g.userData.plot = i; scene.add(g);

});
// (re)build the plants in a field for its crop: instanced leaves in three rows plus a few produce sprites that appear as it ripens
function buildPlants(i) {

  if (P.mesh) { P.plants.remove(P.mesh); P.mesh.dispose(); P.mesh = null; }

  if (!crop) return;
  const L = CROPS[crop].look, [, gh] = CROP_SHAPES[L.shape], R = rng(31 + i * 7 + crop.length), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color();
  const mesh = new THREE.InstancedMesh(cropGeo[L.shape], P.mat, L.n);
  for (let k = 0; k < L.n; k++) {
    const z = [-.7, 0, .7][k % 3] + (R() - .5) * .16, x = (R() - .5) * 1.8, s = (.75 + R() * .45) * L.h / gh;
    q.setFromEuler(new THREE.Euler((R() - .5) * .35, R() * 7, (R() - .5) * .35)); m4.compose(new THREE.Vector3(x, 0, z), q, new THREE.Vector3(s * (L.shape === "leaf" ? .8 : 1), s, s)); mesh.setMatrixAt(k, m4);

    const s = new THREE.Sprite(fruitMat(crop)); s.userData.base = new THREE.Vector3((k % 3 - 1) * .6 + (R() - .5) * .3, L.fy, [-.7, 0, .7][Math.floor(k / 3) % 3] + (R() - .5) * .2);
    s.position.copy(s.userData.base); s.visible = false; P.plants.add(s); P.fruit.push(s);
  }
}
const grown = (i) => { const p = S.plots[i]; return p.crop ? THREE.MathUtils.clamp(1 - (p.end - nowMs()) / (CROPS[p.crop].time * 1000), 0, 1) : 0; };
const ready = (i) => { const p = S.plots[i]; return !!p.crop && p.end <= nowMs(); };
const green = new THREE.Color(), ripe = new THREE.Color();
function updatePlots(t) {
  plots.forEach((P, i) => {
    if (P.crop !== S.plots[i].crop) buildPlants(i);
    if (!P.crop) return;
    const L = CROPS[P.crop].look, g = grown(i), r = THREE.MathUtils.smoothstep(g, .55, 1);
    P.plants.scale.set(.55 + .45 * g, .12 + .88 * g, .55 + .45 * g);
    P.mat.color.copy(green.set(L.green)).lerp(ripe.set(L.ripe), r);
    P.fruit.forEach((s, k) => { const f = THREE.MathUtils.smoothstep(g, .65, 1); s.visible = f > .01;
      const a = s.material.map.image ? s.material.map.image.width / s.material.map.image.height : 1, sz = L.fs * (.35 + .65 * f);
      s.scale.set(sz * a / (.55 + .45 * g), sz / (.12 + .88 * g), 1); // undo the plants' growth scale so the produce keeps its shape
      s.position.y = s.userData.base.y + (g >= 1 ? Math.sin(t * 3 + k) * .02 : 0); });
  });
}

// planting and harvesting
function plantPlot(i, crop, quiet) {
  const p = S.plots[i], c = CROPS[crop];
  if (!p || p.crop || c.lvl > S.level) return false;
  if (have(crop) > 0) takeItem(crop, 1);
  else if (S.coins >= c.seed) S.coins -= c.seed;
  else { if (!quiet) toast("Not enough coins for " + c.n + " seeds"); return false; }
  p.crop = crop; p.end = nowMs() + c.time * 1000 * (PRESET.rain ? .9 : 1); S.lastCrop = crop; // rain waters the fields
  buildPlants(i); squish(plots[i].g, .35); renderHud(["coins"]); saveEcon(); renderSeeds();
  return true;
}
function harvestPlot(i, quiet) {
  if (!ready(i)) return false;
  if (barnSpace() < 2) { if (!quiet) toast("📦 The barn is full"); return false; }
  const crop = S.plots[i].crop; addItem(crop, 2); S.plots[i].crop = null; S.plots[i].end = 0;
  fxAt(plots[i].g.position, "+2 " + CROPS[crop].e); squish(plots[i].g, .35); buildPlants(i); earn({xp:CROPS[crop].xp});
  renderSeeds(); if (!$id("barnPanel").hidden) renderBarn();
  return true;
}
// floating "+2 🌾" over a spot in the world
function fxAt(pos, text) {
  const v = pos.clone().setY(1.2).project(camera); if (v.z > 1) return;
  const d = document.createElement("div"); d.className = "fx out"; d.textContent = text;
  d.style.left = (v.x + 1) / 2 * innerWidth + "px"; d.style.top = (1 - v.y) / 2 * innerHeight + "px";
  document.body.appendChild(d); setTimeout(() => d.remove(), 1150);
}

// panels: seed tray, field card, barn
let armed = null, cardPlot = -1;
const panels = ["seedTray", "plotCard", "barnPanel", "animalCard"];
function openPanel(id) { for (const p of panels) $id(p).hidden = p !== id; if (id !== "seedTray") armed = null; if (id !== "plotCard") cardPlot = -1; }
function closePanels() { openPanel(null); }
function renderSeeds() {
  if ($id("seedTray").hidden) return;
  $id("seedList").innerHTML = Object.entries(CROPS).map(([id, c]) => c.lvl > S.level
    ? `<button class="seed locked" disabled><img src="${ART + id}.webp" alt=""><b>${c.n}</b><small>🔒 Lv ${c.lvl}</small></button>`
    : `<button class="seed${armed === id ? " on" : ""}" data-crop="${id}"><img src="${ART + id}.webp" alt=""><b>${c.n}</b><small>${have(id) ? "×" + have(id) : c.seed + " 🪙"} · ${fmtTime(c.time * 1000)}</small></button>`).join("");
}
function openSeeds(i) {
  openPanel("seedTray"); armed = CROPS[S.lastCrop] && CROPS[S.lastCrop].lvl <= S.level ? S.lastCrop : "wheat"; renderSeeds();
  if (i >= 0) plantPlot(i, armed);
}
$id("seedList").addEventListener("click", (e) => { const b = e.target.closest("[data-crop]"); if (b) { armed = b.dataset.crop; renderSeeds(); } });
function showPlot(i) {
  openPanel("plotCard"); cardPlot = i;
  const p = S.plots[i], c = CROPS[p.crop], left = Math.max(0, p.end - nowMs());
  $id("plotTitle").textContent = c.e + " " + c.n + " is growing";
  $id("plotLeft").textContent = "Ready in " + fmtTime(left);
  $id("plotFinish").textContent = "Finish now · " + gemCost(left) + " 💎";
}
$id("plotFinish").onclick = () => { const i = cardPlot; if (i < 0 || !S.plots[i].crop) return; const cost = gemCost(Math.max(0, S.plots[i].end - nowMs()));
  if (S.gems < cost) { toast("Not enough gems"); return; } S.gems -= cost; S.plots[i].end = nowMs(); renderHud(["gems"]); saveEcon(); closePanels(); };
function renderBarn() {
  const used = barnUsed();
  $id("barnUsed").textContent = used + " / " + S.barnCap;
  $id("barnCap").classList.toggle("full", used >= S.barnCap); $id("barnCap").firstChild.style.width = Math.min(100, used / S.barnCap * 100) + "%";
  const list = Object.entries(S.barn).filter(([, n]) => n > 0);
  $id("barnItems").innerHTML = list.length ? list.map(([id, n]) => `<span>${(CROPS[id] || {}).e || "📦"} ${(CROPS[id] || {}).n || id} ×${n}</span>`).join("") : "<small>Empty. Harvest some fields!</small>";
}
$id("barnBtn").onclick = () => { if (!$id("barnPanel").hidden) return closePanels(); openPanel("barnPanel"); renderBarn(); };
for (const [b, fn] of [["seedClose", closePanels], ["plotClose", closePanels], ["barnClose", closePanels]]) $id(b).onclick = fn;

// touch: a finger that starts on a ripe field harvests every ripe field it slides over; with a seed picked, one that starts
// on an empty field plants every empty field it slides over. Either way the camera stays put for that finger.
let farmDrag = null, paintUsed = false;
function plotAt(x, y) {
  const ray = new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  const hit = ray.intersectObjects(plots.map(P => P.g), true)[0]; if (!hit) return -1;
  let o = hit.object; while (o && o.userData.plot === undefined) o = o.parent; return o ? o.userData.plot : -1;
}
function farmDown(e) {
  paintUsed = false; const i = plotAt(e.clientX, e.clientY); if (i < 0) return false;
  if (ready(i)) { farmDrag = {id:e.pointerId, mode:"harvest"}; harvestPlot(i); paintUsed = true; return true; }
  if (!S.plots[i].crop && armed && !$id("seedTray").hidden) { farmDrag = {id:e.pointerId, mode:"plant"}; plantPlot(i, armed); paintUsed = true; return true; }
  return false;
}
function farmMove(e) {
  if (!farmDrag || farmDrag.id !== e.pointerId) return false;
  const i = plotAt(e.clientX, e.clientY);
  if (i >= 0) { if (farmDrag.mode === "harvest") harvestPlot(i, true); else if (!S.plots[i].crop) plantPlot(i, armed, true); }
  return true;
}
function farmTap(i) {
  if (i < 0) return false;
  if (!S.plots[i].crop) openSeeds(i); else if (!ready(i)) showPlot(i);
  return true;
}
const farmUp = (e) => { if (farmDrag && farmDrag.id === e.pointerId) farmDrag = null; };
buildPlantsAll(); function buildPlantsAll() { plots.forEach((_, i) => buildPlants(i)); }

document.getElementById("acPet").onclick = () => { const a = animals[+animalCard.dataset.i], r = a.pet();
  // a cuddle is worth XP once every 45 s per animal, and a happy animal sometimes finds you a coin
  if (r !== "startled" && r !== "grumpy" && clockT - (a.lastReward ?? -1e9) > 45) { a.lastReward = clockT; const coin = rnd() < .3 ? 5 : 0;
    earn({xp:2, coins:coin}); if (!$id("toast").textContent.startsWith("⭐") || $id("toast").hidden) toast("+2 ⭐" + (coin ? "  +5 🪙" : "")); }
  document.getElementById("acDoing").textContent = r === "startled" ? a.name + " got startled and ran off!" : r === "grumpy" ? a.name + " is not in the mood." : a.name + " loved that!"; };
document.getElementById("acCall").onclick = () => { const a = animals[+animalCard.dataset.i];
  if (a.act === "sleeping") { document.getElementById("acDoing").textContent = a.name + " is fast asleep."; return; }
  if (a.pers === "Grumpy" && rnd() < .5) { a.emote("💢"); document.getElementById("acDoing").textContent = a.name + " ignored you."; return; }
  const p = new THREE.Vector2(cam.target.x + (rnd() - .5) * 2, cam.target.z + 3 + rnd() * 2); a.emote("❗", 1.2); a.go(p.x, p.y, true, "Coming over to you", "look"); };
document.getElementById("acClose").onclick = () => { animalCard.hidden = true; };

// ---------------- paint: walls, trim and roof ----------------
// Walls are repainted by redrawing the plank texture in the new color, so grain and wear stay.
const PAINT = {
  Walls:[["Barn red", [4, 62, 36]], ["Sky blue", [208, 42, 42]], ["Sage", [100, 18, 40]], ["Buttercream", [42, 55, 70]], ["Charcoal", [220, 6, 22]], ["Lavender", [268, 26, 52]], ["Natural wood", [30, 45, 40]], ["White", [40, 12, 86]]],
  Trim:[["White", 0xf2eadc], ["Black", 0x2a2a2a], ["Wood", 0x9a6a40], ["Cream", 0xe8d7b0], ["Red", 0x9c2a22]],
  Roof:[["Charcoal", [30, 8, 26]], ["Brown", [25, 30, 30]], ["Forest green", [130, 25, 26]], ["Barn red", [4, 45, 30]], ["Slate blue", [212, 22, 32]]],
};
const hsl = (h) => `hsl(${h[0]},${h[1]}%,${h[2]}%)`;
function paint(part, i) {
  const [, v] = PAINT[part][i];
  if (part === "Walls") { const [c, n] = planks(v, 11); M.red.map.dispose(); M.red.map = tex(c, 1); M.red.normalMap = tex(n); M.red.needsUpdate = true; }
  if (part === "Trim") M.trim.color.set(v);
  if (part === "Roof") { const [c, n] = shingles(3, v); M.roof.map.dispose(); M.roof.map = tex(c, 1); M.roof.normalMap = tex(n); M.roof.needsUpdate = true; }
  document.querySelectorAll(`[data-part="${part}"]`).forEach((b, j) => b.classList.toggle("on", j === i));
}
{ const pd = document.getElementById("paint");
  for (const part of Object.keys(PAINT)) {
    const lab = document.createElement("div"); lab.textContent = part; pd.appendChild(lab);
    const row = document.createElement("div"); row.className = "row"; pd.appendChild(row);
    PAINT[part].forEach(([name, v], i) => {
      const b = document.createElement("button"); b.className = "sw" + (i === 0 ? " on" : ""); b.title = name; b.setAttribute("aria-label", part + ": " + name);
      b.dataset.part = part; b.style.background = typeof v === "number" ? "#" + v.toString(16).padStart(6, "0") : hsl(v);
      b.onclick = () => paint(part, i); row.appendChild(b);
    });
  }
  if (innerWidth < 600) pd.open = false;
  if (qs.get("walls")) paint("Walls", +qs.get("walls")); if (qs.get("trim")) paint("Trim", +qs.get("trim")); if (qs.get("roof")) paint("Roof", +qs.get("roof"));
}
const bar = document.getElementById("bar");
for (const [k, label] of [["morning", "🌅 Morning"], ["noon", "☀️ Noon"], ["golden", "🌇 Golden hour"], ["rain", "🌧️ Rain"], ["snow", "❄️ Snow"], ["night", "🌙 Night"]]) {
  const b = document.createElement("button"); b.textContent = label; b.dataset.p = k; b.onclick = () => setPreset(k); bar.appendChild(b);
}
if (qs.has("shot")) { bar.remove(); document.querySelector(".hint").remove(); document.getElementById("paint").remove(); }
// snapshots skip ahead a little so the animals have spread out and are busy
setPreset(qs.get("preset") || "golden");
window.__herd = animals; if (qs.has("debug")) window.__dbg = {barn, cam, view, squishing, camera, updateSquish, placeCamera, setPreset, inPen, PEN_LIST, clock:() => clockT, setClock:(t) => { clockT = t; }, S, plots, plotAt, ready};
// test pictures: look at a chosen spot (tx, tz), and optionally fill the fields with crops at different stages (not saved)
if (qs.has("tx")) { cam.target.x = view.target.x = +qs.get("tx"); cam.target.z = view.target.z = +qs.get("tz"); }
if (qs.has("farmdemo")) [["wheat", 1], ["corn", 1], ["tomato", .7], ["pumpkin", 1], ["strawberry", 1], ["sugarcane", .4]].forEach(([c, g], i) => {
  S.plots[i].crop = c; S.plots[i].end = nowMs() + (1 - g) * CROPS[c].time * 1000; buildPlants(i); });
if (qs.has("farmdemo")) updatePlots(0);
if (qs.has("shot")) { const R0 = +(qs.get("sim") || 40); for (let k = 0; k < R0 * 10; k++) { clockT += .1; for (const a of animals) a.update(.1, clockT); } if (qs.get("card")) showAnimal(+qs.get("card")); }

// ---------------- animation ----------------
const clock = new THREE.Timer(); let shotFrames = 0;
function frame() {
  clock.update(); const t = clock.getElapsed(); windU.uTime.value = t; skyU.uTime.value = t;
  // the animals live their lives
  const dt = Math.min(.1, t - (frame.lastT ?? t)); frame.lastT = t; clockT = t;
  placeCamera(dt); updateSquish(performance.now());
  for (const a of animals) a.update(dt, t);
  updatePlots(t);
  if (Math.floor(t * 2) !== frame.lastCard) { frame.lastCard = Math.floor(t * 2); // open cards refresh twice a second
    if (animalCard.dataset.i !== undefined && !animalCard.hidden) showAnimal(+animalCard.dataset.i);
    if (cardPlot >= 0) { if (S.plots[cardPlot].crop && !ready(cardPlot)) showPlot(cardPlot); else closePanels(); } }
  // trees sway with the wind
  for (const b of bushes) b.rotation.y = Math.sin(t * 1.1 + b.position.x) * .02 * (1 + wind * 2);
  for (const tr of [tree, tree2, ...hills]) { const c = tr.userData.canopy; c.rotation.z = Math.sin(t * 1.3 + tr.position.x) * .025 * (1 + wind * 2); c.rotation.x = Math.sin(t * .9) * .015 * (1 + wind * 2); }
  if (rain.visible) { rain.position.y = -((t * 22) % 30); rain.position.x = camera.position.x * 0; }
  if (snow.visible) { snow.position.y = -((t * 1.6) % 30); snow.position.x = Math.sin(t * .4) * 1.5; }
  composer.render();
  if (qs.has("shot") && texturesReady && ++shotFrames >= 3) { window.__done = true; return; } // snapshot mode: draw a few frames, then hold still
  requestAnimationFrame(frame);
}
frame();
// keep every buffer at the same pixel ratio: the renderer, the post-processing chain and the tilt-shift blur
function applySize() {
  renderer.setPixelRatio(QUALITY.pr); composer.setPixelRatio(QUALITY.pr);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  for (const t of [tiltH, tiltV]) { renderer.getDrawingBufferSize(t.uniforms.uRes.value); t.uniforms.uAmount.value = 4 * QUALITY.pr; }
}
addEventListener("resize", applySize);
// automatic quality: watch the real frame time and, only if the phone can't hold ~45 fps, step down one notch at a time
// (sharpness first, then shadow detail). It never steps back up, so it can't flicker between settings.
const QUALITY = {pr:Math.min(devicePixelRatio, 2), steps:[() => QUALITY.pr = Math.min(QUALITY.pr, 1.6), () => QUALITY.pr = Math.min(QUALITY.pr, 1.3),
  () => { sun.shadow.mapSize.set(1024, 1024); sun.shadow.map?.dispose(); sun.shadow.map = null; }, () => QUALITY.pr = Math.min(QUALITY.pr, 1)]};
if (!qs.has("shot")) {
  let last = performance.now(), sum = 0, n = 0, since = last + 4000; // ignore the first seconds while shaders compile and textures load
  const watch = (now) => {
    const ft = now - last; last = now;
    if (now > since && ft < 250 && !document.hidden) { sum += ft; n++; }
    if (n >= 90) { if (sum / n > 22 && QUALITY.steps.length) { QUALITY.steps.shift()(); applySize(); since = now + 1500; } sum = 0; n = 0; }
    if (QUALITY.steps.length) requestAnimationFrame(watch);
  };
  requestAnimationFrame(watch);
}
if (qs.has("debug")) { window.__quality = () => [QUALITY.pr, renderer.getPixelRatio(), sun.shadow.mapSize.x, QUALITY.steps.length, renderer.domElement.width];
  window.__qstep = () => { QUALITY.steps.shift()(); applySize(); }; }
window.__ready = true;
</script>
