<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
<rect width="900" height="720" fill="#faf8f2"/>
<style>text{font-family:Arial,sans-serif;fill:#292929}.t{font-size:24px;font-weight:700}.s{font-size:16px}.d{stroke:#5b5b5b;stroke-width:2;fill:none}.g{stroke:#b8b8b8;stroke-width:1;stroke-dasharray:6 6}.o{stroke:#252525;stroke-width:5;fill:#f0eee7}.b{stroke:#1672b8;stroke-width:3;fill:none}.p{fill:#c93434}.a{stroke:#1672b8;stroke-width:2;marker-start:url(#m);marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 0L0 4L8 8Z" fill="#1672b8"/></marker></defs>
<text x="34" y="42" class="t">Sunny Acres Cow B1 — controlled Holstein rear target</text>
<text x="34" y="68" class="s">Rump, pins, udder attachment, hock alignment and hind-hoof tracking target.</text>
<rect x="75" y="95" width="750" height="520" class="g"/><text x="694" y="118" class="s">B0 X/Y envelope</text>
<line x1="75" y1="575" x2="825" y2="575" class="d"/>
<!-- silhouette -->
<path class="o" d="M450 190 Q383 188 335 226 Q302 257 292 315 Q286 369 311 422 L337 474 L346 575 L392 575 L400 486 Q411 441 428 419 Q440 409 450 409 Q460 409 472 419 Q489 441 500 486 L508 575 L554 575 L563 474 L589 422 Q614 369 608 315 Q598 257 565 226 Q517 188 450 190Z"/>
