<!-- attachment guide --> <line x1="411" y1="356" x2="489" y2="356" class="a"/><text x="333" y="343" class="s">rear udder attachment 0.1626 biological anchor</text>
<line x1="307" y1="145" x2="593" y2="145" class="a"/><text x="375" y="134" class="s">outer hook width 0.60</text>
<line x1="411" y1="170" x2="489" y2="170" class="a"/><text x="388" y="161" class="s">pin-bone spacing 0.1626</text>
<line x1="340" y1="610" x2="560" y2="610" class="a"/><text x="373" y="638" class="s">hind hoof centers ±0.23</text>
