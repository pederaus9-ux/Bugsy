<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#6EC3E6">
<title>Sunny Acres 3D</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../farm/icon-192.png">
<link rel="apple-touch-icon" href="../farm/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --parch:#FCEBC0; --parch2:#F4D79A; --wood:#9A5B2A; --wood-dk:#6E3D18; --ink:#5A3413;
  --green:#6CC04A; --green-dk:#3E8E24; --gold:#FFC83D; --gold-dk:#C4850C; --blue:#48B4F0; --blue-dk:#1F7FC0;
  --red:#E8513C; --red-dk:#A8321F;
  --fun:"Lilita One","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9cc3e6;font-family:var(--body);color:var(--ink);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.out{color:#fff;text-shadow:0 2px 0 var(--wood-dk),2px 0 0 var(--wood-dk),-2px 0 0 var(--wood-dk),0 -2px 0 var(--wood-dk),1.5px 1.5px 0 var(--wood-dk),-1.5px 1.5px 0 var(--wood-dk),1.5px -1.5px 0 var(--wood-dk),-1.5px -1.5px 0 var(--wood-dk)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@keyframes bump{40%{transform:scale(1.25)}}
.bump{animation:bump .35s ease-out}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.hud > *{pointer-events:auto}
.lvlbox{display:flex;align-items:center}
.star{width:56px;height:56px;position:relative;z-index:1;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.star svg{position:absolute;inset:0}
.star b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fun);font-weight:400;font-size:21px;padding-top:4px}
.xpbar{margin-left:-16px;width:118px;height:24px;background:rgba(70,35,10,.6);border:3px solid #fff;border-radius:0 13px 13px 0;position:relative;overflow:hidden}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#9BE36E,#4FAE2E);transition:width .4s}
.xpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fun);font-size:13px;padding-left:10px}
.money{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.cnt{display:flex;align-items:center;height:32px;min-width:112px;background:rgba(70,35,10,.6);border:3px solid #fff;border-radius:17px;padding-right:12px}
.cnt .ic{font-size:28px;margin-left:-14px;margin-right:6px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3));line-height:1}
.cnt b{font-family:var(--fun);font-weight:400;font-size:19px;margin-left:auto}

/* dock and side buttons */
.dock{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:5;display:flex;gap:10px}
.dock button{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF2C4,#F2BF4B);border:4px solid #fff;
  box-shadow:0 4px 0 var(--wood-dk),0 7px 12px rgba(0,0,0,.3);font-size:30px;position:relative;line-height:1}
.dock button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dk)}
.dock .l{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-family:var(--fun);font-size:14px;white-space:nowrap}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--red);border:2px solid #fff;
  color:#fff;font-family:var(--fun);font-size:13px;display:grid;place-items:center;padding:0 5px}
.side{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:5;display:flex;flex-direction:column;gap:8px}
.side button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25);font-size:21px}
/* walk and edit modes */
.modebar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 100px);z-index:9;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);
  background:rgba(70,35,10,.88);color:#fff;border:3px solid #fff;border-radius:99px;padding:5px 5px 5px 16px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.modebar small{opacity:.8;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.modebar button{background:#fff;color:var(--wood-dk);border-radius:99px;padding:8px 14px;font-weight:900;font-size:14px;flex:none}
#editBar{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
.stick{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:116px;height:116px;border-radius:50%;z-index:8;touch-action:none;
  background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,.3));border:3px solid rgba(255,255,255,.75);box-shadow:0 4px 16px rgba(0,0,0,.25)}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#FFF2C4,#F2BF4B);border:3px solid #fff;box-shadow:0 3px 0 var(--wood-dk)}
.fx.combo{font-size:34px;color:#FFE27A;z-index:7}
#swipe{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.throwbtn{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);z-index:8;width:64px;height:64px;border-radius:50%;font-size:28px;
  background:radial-gradient(circle at 35% 30%,#E8FFD0,#8CD35A);border:4px solid #fff;box-shadow:0 4px 0 var(--green-dk)}
.throwbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dk)}
.throwbtn .l{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-family:var(--fun);font-size:14px;color:#fff}
body.walking .side,body.walking .chips,body.walking #hint,body.editing .side,body.editing .chips,body.editing .dock,body.editing #hint{display:none!important}

/* chips under the level star: weather and events */
.chips{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip{display:flex;align-items:center;gap:6px;background:rgba(70,35,10,.6);border:2px solid #fff;border-radius:14px;padding:3px 10px 3px 6px;
  font-family:var(--fun);font-size:14px;color:#fff;max-width:220px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.chip .e{font-size:20px;line-height:1}
.chip small{font-family:var(--body);font-weight:800;font-size:11px;opacity:.9}
.chip.ev{background:linear-gradient(#FFB443,#E9831B);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.chip .mini{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.35);margin-top:2px;overflow:hidden}
.chip .mini i{display:block;height:100%;background:#fff}

/* trays: seed picker, field card, animal card and little bubbles, docked above the dock */
.tray{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);max-width:520px;margin:0 auto;z-index:8;
  background:var(--parch);border:4px solid var(--wood);border-radius:20px;padding:8px 10px 10px;box-shadow:0 7px 16px rgba(0,0,0,.35);animation:pop .14s ease-out}
.tray h3{margin:0 0 6px;font:400 18px var(--fun);display:flex;justify-content:space-between;align-items:center;gap:8px}
.tray h3 small{font:800 12px var(--body);opacity:.7;display:block}
.tray .x{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--wood-dk);font-weight:800;box-shadow:0 2px 0 var(--parch2);flex:none}
.tray-sub{font-size:13px;font-weight:800;opacity:.8}
.tray .row{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.seeds{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:2px 0 2px;touch-action:none}
.seed{touch-action:none;flex:none;width:70px;border:3px solid transparent;border-radius:16px;background:var(--parch2);padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.seed img{width:36px;height:36px;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.seed b{font-size:11px;font-weight:800;letter-spacing:-.2px;white-space:nowrap} .seed small{font-size:11px;font-weight:800;opacity:.75;text-align:center}
.seed.on{border-color:var(--gold-dk);background:#FFF6DC}
.seed.locked{opacity:.45;filter:grayscale(1)}
.acard{display:flex;align-items:center;gap:10px}
.acard img{width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));flex:none}
.acard .who{flex:1;min-width:0}
.acard b.nm{font:400 20px var(--fun)}
.acard .rn{font-size:14px;margin-left:4px;opacity:.7}
.hearts{font-size:15px;letter-spacing:1px;line-height:1.2}
.fx{position:fixed;z-index:6;pointer-events:none;font:400 22px var(--fun);transform:translate(-50%,-50%);animation:rise 1.1s ease-out forwards;white-space:nowrap}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 136px);left:0;right:0;transition:opacity .6s;pointer-events:none;text-align:center;color:#fff;font-weight:800;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:0 90px}

/* tutorial */
.tut{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 118px);max-width:430px;margin:0 auto;z-index:7;background:#fff;border:4px solid var(--gold-dk);
  border-radius:18px;padding:10px 12px;box-shadow:0 8px 20px rgba(0,0,0,.3);display:flex;gap:10px;align-items:flex-start;animation:pop .2s ease-out}
.tut .face{font-size:34px;line-height:1}
.tut p{margin:0;font-weight:800;font-size:15px;flex:1}
.tut small{display:block;font-weight:800;opacity:.55;font-size:11px;margin-top:4px}
.tut button{font-weight:800;font-size:12px;color:var(--wood);text-decoration:underline;flex:none}
.pointer{position:fixed;z-index:7;font-size:40px;pointer-events:none;transform:translate(-50%,-100%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{margin-top:-14px}}

/* panels */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(40,20,0,.5);display:flex;align-items:center;justify-content:center;
  padding:30px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.panel{width:100%;max-width:580px;max-height:100%;display:flex;flex-direction:column;background:var(--parch);border:6px solid var(--wood);
  border-radius:26px;box-shadow:inset 0 0 0 4px var(--parch2),0 12px 30px rgba(0,0,0,.45);position:relative;animation:pop .18s ease-out}
.ribbon{align-self:center;margin-top:-24px;background:linear-gradient(#F0664F,#C9381F);font-family:var(--fun);font-size:22px;padding:6px 26px;
  border-radius:14px;border:3px solid #fff;box-shadow:0 4px 0 #8A2415;white-space:nowrap;max-width:calc(100% - 70px);overflow:hidden;text-overflow:ellipsis}
.ribbon.out{text-shadow:0 2px 0 #8A2415,2px 0 0 #8A2415,-2px 0 0 #8A2415,0 -2px 0 #8A2415}
.xbtn{position:absolute;top:-18px;right:-14px;width:44px;height:44px;border-radius:50%;background:linear-gradient(#F0664F,#C9381F);border:3px solid #fff;
  box-shadow:0 3px 0 #8A2415;font-family:var(--fun);font-size:22px;color:#fff}
.pbody{overflow:auto;padding:14px 14px 16px;-webkit-user-select:none}
.pbody h4{font-family:var(--fun);font-weight:400;font-size:19px;margin:14px 0 8px}
.pbody h4:first-child{margin-top:4px}
.muted{opacity:.72}
.center{text-align:center}
.btn{font-family:var(--fun);font-weight:400;font-size:16px;color:#fff;background:linear-gradient(#8BDA60,#58AE36);border-radius:13px;padding:8px 15px;
  box-shadow:0 4px 0 var(--green-dk);text-shadow:0 1px 0 rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dk)}
.btn.gold{background:linear-gradient(#FFDD70,#F4B527);box-shadow:0 4px 0 var(--gold-dk);color:var(--wood-dk);text-shadow:none}
.btn.blue{background:linear-gradient(#72CBF7,#34A0E0);box-shadow:0 4px 0 var(--blue-dk)}
.btn.plain{background:#fff;color:var(--wood-dk);box-shadow:0 3px 0 var(--parch2);text-shadow:none}
.btn.red{background:linear-gradient(#F0664F,#C9381F);box-shadow:0 4px 0 #8A2415}
.btn:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed;transform:none}
.btn.sm{font-size:14px;padding:6px 11px;border-radius:11px}
.btn.wide{width:100%}
.slot{background:var(--parch2);border-radius:16px;box-shadow:inset 0 3px 0 rgba(110,61,24,.12)}
.queue{display:flex;gap:8px;justify-content:center}
.qslot{width:74px;height:74px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.qslot .e{font-size:32px;line-height:1.1}
.qslot.done{background:#DFF3C9;outline:3px solid var(--green)}
.qslot.wait .e{opacity:.45}
.qslot.empty{border:3px dashed rgba(110,61,24,.3);background:none;box-shadow:none;opacity:.6}
.qbtns{display:flex;gap:8px;justify-content:center;margin:12px 0 2px;flex-wrap:wrap}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.rcard{padding:8px 10px;display:flex;align-items:center;gap:10px}
.rcard .mid{flex:1;min-width:0}
.rcard > .e{font-size:36px;line-height:1;flex:none}
.rcard b{font-family:var(--fun);font-weight:400;font-size:17px;display:block;line-height:1.1}
.rcard small{font-weight:800;opacity:.7}
.need{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;font-weight:800}
.need .short{color:var(--red-dk)}
.rcard.locked{opacity:.55}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:14px 10px;padding-top:6px}
.note{background:#FFFEF7;border-radius:8px;padding:16px 10px 10px;box-shadow:0 4px 0 rgba(110,61,24,.18);position:relative;display:flex;flex-direction:column;gap:8px}
.note::before{content:"📌";position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:20px}
.note.can{outline:3px solid var(--green)}
.note .items{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px}
.oi{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:13px}
.oi .e{font-size:30px;line-height:1.1}
.oi.short{color:var(--red-dk)}
.oi.ok::after{content:"✔";color:var(--green-dk);font-size:12px}
.reward{display:flex;justify-content:center;gap:8px;font-family:var(--fun);font-size:15px;flex-wrap:wrap}
.note .foot{display:flex;gap:6px}
.note .foot .btn:first-child{flex:1}
.note.waiting{justify-content:center;align-items:center;text-align:center;min-height:170px;font-weight:800;background:rgba(255,254,247,.55)}
.note.waiting .e{font-size:40px}
.cap{height:18px;border-radius:10px;background:rgba(110,61,24,.2);overflow:hidden;margin:4px 0 10px}
.cap i{display:block;height:100%;background:linear-gradient(#9BE36E,#4FAE2E)}
.cap.full i{background:linear-gradient(#F48B79,#D8412A)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.islot{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.islot .e{font-size:32px;line-height:1}
.islot .q{position:absolute;bottom:4px;right:6px;font-family:var(--fun);font-size:15px}
.islot.sel{outline:3px solid var(--wood);background:#FFF6DC}
.sellbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;margin-top:12px}
.sellbar .e{font-size:34px}
.sellbar .grow{flex:1;min-width:120px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.scard .e{font-size:40px;line-height:1.1}
.scard b{font-family:var(--fun);font-weight:400;font-size:17px}
.scard small{font-weight:800;opacity:.72;font-size:12px}
.scard .btn{margin-top:auto}
.scard.locked{opacity:.55}
.scard img,.dcard img{width:52px;height:52px;object-fit:contain}
.promise{background:#E4F4FF;border:3px solid var(--blue);border-radius:16px;padding:12px 14px;margin-top:14px;font-weight:800}
.promise b{font-family:var(--fun);font-weight:400;font-size:18px;color:var(--blue-dk)}
.promise ul{margin:6px 0 0;padding-left:20px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{padding:10px;text-align:center}
.stat b{display:block;font-family:var(--fun);font-weight:400;font-size:24px}
.big{font-size:70px;text-align:center;line-height:1.1}
.howto{margin:8px 0;padding-left:22px;font-weight:700}
.howto li{margin:4px 0}
.stand{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sslot{min-height:128px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;position:relative;font-weight:800;font-size:13px;width:100%}
.sslot .e{font-size:38px;line-height:1.1}
.sslot b{font-family:var(--fun);font-weight:400;font-size:17px}
.sslot small{opacity:.7;font-size:12px}
.sslot.empty{border:3px dashed rgba(110,61,24,.3);background:none;box-shadow:none;color:var(--wood)}
.sslot.sold{background:#DFF3C9;outline:3px solid var(--green);animation:pop .3s}
.sslot .rm{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--red-dk);font-weight:800;box-shadow:0 2px 0 var(--parch2)}
.picker{padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{font-family:var(--fun);font-weight:400;font-size:20px;min-width:70px;text-align:center}
.stepper .btn{width:40px;padding:6px 0;font-size:20px}
.toggles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.sw.on{outline:3px solid var(--gold-dk);outline-offset:1px}
.evbar{height:18px;border-radius:10px;background:rgba(110,61,24,.2);overflow:hidden;margin:10px 0 4px;position:relative}
.evbar i{display:block;height:100%;background:linear-gradient(#FFD865,#F4A527)}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tier{padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12px;position:relative}
.tier .e{font-size:36px;line-height:1.1}
.tier b{font-family:var(--fun);font-weight:400;font-size:15px}
.tier.won{background:#DFF3C9;outline:3px solid var(--green)}
.tier.won::after{content:"✔";position:absolute;top:4px;right:8px;color:var(--green-dk);font-size:16px}
.decor{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dcard{padding:8px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;font-weight:800;font-size:12px}
.dcard .e{font-size:36px;line-height:1.1}
.dcard.locked .e{filter:grayscale(1) brightness(.7);opacity:.5}
.tag{display:inline-block;border-radius:8px;padding:0 6px;font-size:10px;font-weight:800;color:#fff}
.tag.r1{background:#58AE36}.tag.r2{background:#34A0E0}.tag.r3{background:#9B59D0}.tag.hol{background:#E9831B}
.wxnow{display:flex;align-items:center;gap:14px;padding:12px}
.wxnow .e{font-size:54px;line-height:1}
.wxnow b{font-family:var(--fun);font-weight:400;font-size:22px;display:block}
.wxrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

<script>
// A safety net that works even if the game's code can't start (a file still uploading, an old phone browser…):
// show what went wrong instead of a loading screen that never ends, with a Reload button.
(function () {
  var shown = false;
  function show(msg) {
    var L = document.getElementById("loading"); if (!L || window.__ready || (shown && !msg)) return; shown = true;
    L.innerHTML = '<div style="text-align:center;padding:24px;max-width:420px;font:800 16px Nunito,system-ui,sans-serif;color:#5a3413;text-shadow:none">' +
      '<div class="out" style="font:400 30px \'Lilita One\',system-ui,sans-serif;margin-bottom:12px">🌻 Sunny Acres</div>' +
      (msg ? 'The farm couldn\'t start. Please tap Reload. If it keeps happening, send a screenshot of this:<br><code style="display:block;margin-top:8px;font-size:12px;word-break:break-word;background:#fff8e6;border-radius:10px;padding:8px">' +
        String(msg).replace(/</g, "&lt;") + '</code>' : 'Still loading… this is taking longer than usual.') +
      '<br><button onclick="location.reload()" style="font:400 20px \'Lilita One\',system-ui,sans-serif;background:#6cc04a;color:#fff;border:0;border-radius:14px;padding:10px 22px;box-shadow:0 4px 0 #3e8e24">Reload</button></div>';
  }
  window.addEventListener("error", function (e) { show((e.message || "error") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "")); });
  window.addEventListener("unhandledrejection", function (e) { show(e.reason && (e.reason.message || e.reason)); });
  setTimeout(function () { show(); }, 25000);
  window.__bootFail = show;
  var last = null; try { last = localStorage.getItem("sa3d-boot"); } catch (e) {}
  if (last && last !== "ok") { var L = document.getElementById("loading");
    L.insertAdjacentHTML("beforeend", '<div style="position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);text-align:center;font:800 13px Nunito,system-ui,sans-serif;color:#5a3413;text-shadow:none">Last time the farm stopped while ' + String(last).replace(/</g, "&lt;") + '. Trying again…</div>'); }
})();
</script>

<script type="module" onerror="window.__bootFail && window.__bootFail('A game file didn\'t download. Check the internet and reload.')">
import * as THREE from "./lib/three.module.min.js";

const qs = new URLSearchParams(location.search);
const bootStep = (name) => { try { localStorage.setItem("sa3d-boot", name); } catch (e) {} };
bootStep("loading the 3D engine");
// animal pictures live next to the 2D game in the repo, or beside the page when published on its own
const ART = document.querySelector('meta[name="art-path"]')?.content || "./art/";

// ---------------- renderer ----------------
bootStep("starting the graphics");
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance", preserveDrawingBuffer:qs.has("shot")});

renderer.setSize(innerWidth, innerHeight);

renderer.shadowMap.type = THREE.PCFShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

bootStep("setting up the scene");
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(innerWidth < innerHeight ? 50 : 38, innerWidth / innerHeight, 0.1, 600);

// ---------------- shared "weather" uniforms every material listens to ----------------
// Snow settles on upward-facing surfaces; rain darkens things and makes them glossy.
const WX = {uSnow:{value:0}, uWet:{value:0}};
function weatherShader(sh) {
  sh.uniforms.uSnow = WX.uSnow; sh.uniforms.uWet = WX.uWet;
  sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vWN; varying vec3 vWP;")
    .replace("#include <beginnormal_vertex>", `#include <beginnormal_vertex>
      #ifdef USE_INSTANCING
        vWN = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * objectNormal);
      #else
        vWN = normalize(mat3(modelMatrix) * objectNormal);
      #endif`)
    .replace("#include <worldpos_vertex>", `#include <worldpos_vertex>
      #ifdef USE_INSTANCING
        vWP = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
      #else
        vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;
      #endif`);
  sh.fragmentShader = sh.fragmentShader.replace("#include <common>", `#include <common>
    varying vec3 vWN; varying vec3 vWP; uniform float uSnow; uniform float uWet;
    float hsh(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(hsh(i), hsh(i+vec2(1,0)), f.x), mix(hsh(i+vec2(0,1)), hsh(i+vec2(1,1)), f.x), f.y); }`)
    .replace("#include <map_fragment>", `#include <map_fragment>
    float snowAmt = uSnow * smoothstep(0.3, 0.6, vWN.y + (vnoise(vWP.xz * 6.0) - 0.5) * 0.12 + (vnoise(vWP.xz * .8) - 0.5) * 0.08);
    diffuseColor.rgb *= mix(1.0, 0.62, uWet * (1.0 - snowAmt));
    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.93, 0.96, 1.0), snowAmt);`)
    .replace("#include <roughnessmap_fragment>", `#include <roughnessmap_fragment>
    roughnessFactor = mix(roughnessFactor, 0.18, uWet * 0.85 * (1.0 - snowAmt));
    roughnessFactor = mix(roughnessFactor, 0.7, snowAmt);`);

function weatherize(mat) { mat.onBeforeCompile = weatherShader; return mat; }

// Leaves and grass: light shines through them when the sun is behind (like real foliage),
// and their normals point outward from the plant instead of flipping per card, so a tree reads as one soft volume.
const LIT = {uSunDir:{value:new THREE.Vector3(0, 1, 0)}, uSunCol:{value:new THREE.Color()}};
function foliageShader(sh, trans = 1) {
  weatherShader(sh);

  sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nuniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uTrans;")
    .replace("#include <normal_fragment_begin>", "float faceDirection = gl_FrontFacing ? 1.0 : -1.0;\nvec3 normal = normalize(vNormal);\nvec3 nonPerturbedNormal = normal;")
    .replace("#include <lights_fragment_end>", `#include <lights_fragment_end>
      vec3 Vw = normalize(vWP - cameraPosition);
      float back = pow(max(dot(Vw, normalize(uSunDir)), 0.0), 4.0);
      reflectedLight.indirectDiffuse += diffuseColor.rgb * uSunCol * (back * 0.9 + 0.1) * uTrans;`);

function foliage(mat, trans = 1, extra) { mat.onBeforeCompile = (sh) => { foliageShader(sh, trans); if (extra) extra(sh); }; return mat; }
let texturesReady = false; THREE.DefaultLoadingManager.onLoad = () => { texturesReady = true; };
const TL = new THREE.TextureLoader();
function photo(path, rep, color = true) {
  const t = TL.load(path); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(...rep);
  if (color) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const TEX = document.querySelector('meta[name="tex-path"]')?.content || "tex/";
const leafTex = photo(TEX + "leaves.webp"), barkTex = photo(TEX + "bark.jpg", [1, 3]);

// ---------------- procedural textures (drawn once, tiled) ----------------
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function canvas(n) { const c = document.createElement("canvas"); c.width = c.height = n; return [c, c.getContext("2d")]; }
function tex(c, color, rep = [1, 1]) {

}
// turns a grayscale height canvas into a normal map
function normalFrom(hc, strength = 2) {

  const [c, x] = canvas(n), out = x.createImageData(n, n), H = (i, j) => src[(((j + n) % n) * n + ((i + n) % n)) * 4] / 255;

    const dx = (H(i + 1, j) - H(i - 1, j)) * strength, dy = (H(i, j + 1) - H(i, j - 1)) * strength;
    const l = Math.hypot(dx, dy, 1), k = (j * n + i) * 4;
    out.data[k] = (-dx / l * .5 + .5) * 255; out.data[k + 1] = (dy / l * .5 + .5) * 255; out.data[k + 2] = (1 / l * .5 + .5) * 255; out.data[k + 3] = 255;
  }

}
function planks(base, seed, worn = .5) { // vertical painted barn boards
  const n = 512, [c, x] = canvas(n), [h, hx] = canvas(n), R = rng(seed), w = 64;
  hx.fillStyle = "#808080"; hx.fillRect(0, 0, n, n);
  for (let p = 0; p < n / w; p++) {
    const l = (R() - .5) * 18;
    x.fillStyle = `hsl(${base[0]},${base[1]}%,${base[2] + l * .35}%)`; x.fillRect(p * w, 0, w, n);
    for (let g = 0; g < 26; g++) { // wood grain
      const gx = p * w + R() * w; x.strokeStyle = `rgba(0,0,0,${.03 + R() * .06})`; x.lineWidth = .6 + R() * 1.4;
      x.beginPath(); x.moveTo(gx, 0); for (let y = 0; y <= n; y += 32) x.lineTo(gx + Math.sin(y * .02 + g) * 2.5, y); x.stroke();
      hx.strokeStyle = `rgba(0,0,0,${.05 + R() * .08})`; hx.lineWidth = x.lineWidth; hx.beginPath(); hx.moveTo(gx, 0); hx.lineTo(gx, n); hx.stroke();
    }
    if (R() < .45) { const ky = R() * n, kx = p * w + 10 + R() * (w - 20); x.fillStyle = "rgba(40,20,5,.35)"; x.beginPath(); x.ellipse(kx, ky, 4, 7, 0, 0, 7); x.fill(); }
    x.fillStyle = "rgba(20,10,5,.75)"; x.fillRect(p * w, 0, 3, n); hx.fillStyle = "#1a1a1a"; hx.fillRect(p * w, 0, 3, n);
    x.fillStyle = "rgba(255,255,255,.08)"; x.fillRect(p * w + 3, 0, 2, n);
  }
  for (let i = 0; i < 900 * worn; i++) { x.fillStyle = `rgba(${R() < .5 ? "235,225,205" : "60,40,25"},${R() * .18})`; x.fillRect(R() * n, R() * n, 1 + R() * 4, 1 + R() * 10); }
  return [c, normalFrom(h, 3)];

function shingles(seed, base = [30, 12, 28]) {
  const n = 512, [c, x] = canvas(n), [h, hx] = canvas(n), R = rng(seed), rh = 32, tw = 44;
  for (let r = 0; r < n / rh; r++) for (let t = -1; t < n / tw + 1; t++) {
    const ox = t * tw + (r % 2) * tw / 2 + (R() - .5) * 4, y = r * rh, v = R();
    x.fillStyle = `hsl(${base[0] - 5 + v * 12},${base[1] - 4 + v * 8}%,${base[2] - 6 + v * 14}%)`; x.fillRect(ox, y, tw - 2, rh);
    const g = hx.createLinearGradient(0, y, 0, y + rh); g.addColorStop(0, "#303030"); g.addColorStop(1, "#d0d0d0");
    hx.fillStyle = g; hx.fillRect(ox, y, tw - 2, rh);
    x.fillStyle = "rgba(0,0,0,.45)"; x.fillRect(ox, y + rh - 3, tw - 2, 3);
    for (let s = 0; s < 30; s++) { x.fillStyle = `rgba(${R() < .5 ? 255 : 0},${R() < .5 ? 255 : 0},${R() < .5 ? 255 : 0},.06)`; x.fillRect(ox + R() * tw, y + R() * rh, 2, 2); }
  }
  return [c, normalFrom(h, 4)];
}
function stones(seed) {
  const n = 512, [c, x] = canvas(n), [h, hx] = canvas(n), R = rng(seed);
  x.fillStyle = "#6f675c"; x.fillRect(0, 0, n, n); hx.fillStyle = "#202020"; hx.fillRect(0, 0, n, n);
  for (let i = 0; i < 190; i++) {
    const cx = R() * n, cy = R() * n, rx = 18 + R() * 26, ry = 12 + R() * 16, l = 48 + R() * 22;
    for (const [ox, oy] of [[0, 0], [n, 0], [-n, 0], [0, n], [0, -n]]) {
      const g = x.createRadialGradient(cx + ox - rx * .3, cy + oy - ry * .4, 2, cx + ox, cy + oy, rx);
      g.addColorStop(0, `hsl(35,${8 + R() * 10}%,${l + 10}%)`); g.addColorStop(1, `hsl(30,8%,${l - 12}%)`);
      x.fillStyle = g; x.beginPath(); x.ellipse(cx + ox, cy + oy, rx, ry, R(), 0, 7); x.fill();
      const hg = hx.createRadialGradient(cx + ox, cy + oy, 1, cx + ox, cy + oy, rx); hg.addColorStop(0, "#fff"); hg.addColorStop(1, "#555");
      hx.fillStyle = hg; hx.beginPath(); hx.ellipse(cx + ox, cy + oy, rx, ry, 0, 0, 7); hx.fill();

function grass(seed) {

    const cx = R() * n, cy = R() * n, r = 60 + R() * 160, hue = 75 + R() * 25;
    for (const [ox, oy] of [[0, 0], [n, 0], [-n, 0], [0, n], [0, -n]]) {
      const g = x.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, r);
      g.addColorStop(0, `hsla(${hue},${40 + R() * 20}%,${30 + R() * 14}%,.35)`); g.addColorStop(1, "hsla(90,40%,35%,0)");

    const px = R() * n, py = R() * n, len = 4 + R() * 9, a = -Math.PI / 2 + (R() - .5) * .9;
    x.strokeStyle = `hsl(${70 + R() * 35},${35 + R() * 35}%,${22 + R() * 30}%)`; x.lineWidth = .8 + R() * 1.1;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len); x.stroke();
  }
  return c;
}
function dirt(seed) {
  const n = 512, [c, x] = canvas(n), R = rng(seed);
  x.fillStyle = "#b59568"; x.fillRect(0, 0, n, n);
  for (let i = 0; i < 9000; i++) { x.fillStyle = `hsla(${28 + R() * 12},${18 + R() * 18}%,${38 + R() * 32}%,${.3 + R() * .5})`; x.beginPath(); x.arc(R() * n, R() * n, .5 + R() * 2.2, 0, 7); x.fill(); }
  return c;
}
function leafCard(seed) { // a clump of leaves with transparent gaps, used on many small cards per tree
  const n = 256, [c, x] = canvas(n), R = rng(seed);
  for (let i = 0; i < 70; i++) {
    const a = R() * 7, r = R() * 100, cx = 128 + Math.cos(a) * r, cy = 128 + Math.sin(a) * r, s = 10 + R() * 12;
    x.save(); x.translate(cx, cy); x.rotate(R() * 7);
    x.fillStyle = `hsl(${85 + R() * 30},${45 + R() * 25}%,${25 + R() * 25}%)`;
    x.beginPath(); x.ellipse(0, 0, s * .45, s, 0, 0, 7); x.fill();
    x.strokeStyle = "rgba(0,0,0,.25)"; x.lineWidth = 1; x.beginPath(); x.moveTo(0, -s); x.lineTo(0, s); x.stroke();

function radial(inner = "rgba(0,0,0,1)") {
  const [c, x] = canvas(128), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, inner); g.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);

// ---------------- materials ----------------
const std = (o) => weatherize(new THREE.MeshStandardMaterial(o));
const [redC, redN] = planks([4, 62, 36], 11), [trimC, trimN] = planks([40, 25, 88], 5, .25), [fenceC, fenceN] = planks([30, 25, 42], 17, .8);
const [shC, shN] = shingles(3), [stC, stN] = stones(9);

// ================= tactile physics: slicing, bouncing drops, bait and herding =================
// Everything you collect now exists for a moment as a real object: sliced crops split in two and fly apart,
// goods pop out of a building's door and bounce, eggs and milk tumble off the animals. After they settle they
// zip into the Barn button (coins into the coin counter). While walking they wait on the ground until you come close.

}

}

function updateDrops(dt) {

// a burst of little bits (leaves, juice) that fall and fade
const bitTex = {};
function bits(pos, color, n, up = 3.5) {

    spawnDrop(pos, mat.clone(), new THREE.Vector3(Math.cos(a) * sp, up * (.6 + rnd() * .6), Math.sin(a) * sp), {kind:"bit", size:.12 + rnd() * .12, life:.7 + rnd() * .5, spin:0}); }
}
const JUICE = {wheat:"rgba(240,200,90,.95)", corn:"rgba(250,215,60,.95)", carrot:"rgba(255,140,40,.95)", soybean:"rgba(150,190,80,.95)", sugarcane:"rgba(170,220,120,.95)",
  tomato:"rgba(230,50,40,.95)", strawberry:"rgba(235,40,70,.95)", pumpkin:"rgba(250,140,30,.95)"};

// ---------- Fruit Ninja harvesting: a glowing blade trail, and every ripe crop it crosses is sliced in two ----------
const swipeCv = document.getElementById("swipe"), swipeCx = swipeCv.getContext("2d"), trail = [];
let swipeDir = new THREE.Vector2(1, 0), trailDirty = false;
function sizeSwipe() { const r = Math.min(devicePixelRatio || 1, 2); swipeCv.width = innerWidth * r; swipeCv.height = innerHeight * r; swipeCx.setTransform(r, 0, 0, r, 0, 0); }
sizeSwipe(); addEventListener("resize", sizeSwipe);
function trailPoint(x, y) {
  const p = trail[trail.length - 1];
  if (p) { const dx = x - p.x, dy = y - p.y, l = Math.hypot(dx, dy); if (l < 3) return; swipeDir.set(dx / l, dy / l); }
  trail.push({x, y, t:performance.now()}); trailDirty = true;
}
function drawTrail() {
  if (!trailDirty) return;
  const now = performance.now(); while (trail.length && now - trail[0].t > 180) trail.shift();
  swipeCx.clearRect(0, 0, innerWidth, innerHeight);
  if (trail.length < 2) { trailDirty = trail.length > 0; return; }
  // a tapered blade: thin at the tail, wide and bright at the tip, with a soft glow
  for (const [w, col, blur] of [[16, "rgba(255,236,160,.35)", 18], [7, "rgba(255,255,255,.95)", 6]]) {
    swipeCx.shadowColor = "rgba(255,220,120,.9)"; swipeCx.shadowBlur = blur; swipeCx.strokeStyle = col; swipeCx.lineCap = "round";
    for (let i = 1; i < trail.length; i++) { const k = i / (trail.length - 1), age = 1 - (now - trail[i].t) / 180;
      swipeCx.lineWidth = Math.max(.5, w * k * age); swipeCx.beginPath(); swipeCx.moveTo(trail[i - 1].x, trail[i - 1].y); swipeCx.lineTo(trail[i].x, trail[i].y); swipeCx.stroke(); }
  }

}
function combo(n, x, y) { // three or more in one swipe
  const d = document.createElement("div"); d.className = "fx out combo"; d.textContent = "×" + n + " combo!"; d.style.left = x + "px"; d.style.top = (y - 50) + "px";
  document.body.appendChild(d); setTimeout(() => d.remove(), 1150); G.sfx("magic");
}
// split the crop: two halves fly apart across the cut, spinning, then bounce and head for the barn
function sliceFx(i, crop) {
  const c = plots[i].g.position, right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0).setY(0).normalize();
  const fwd = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1).setY(0); if (fwd.lengthSq() < 1e-4) fwd.set(0, 0, -1); fwd.normalize();
  const cut = right.clone().multiplyScalar(swipeDir.x).addScaledVector(fwd, swipeDir.y).normalize(), across = new THREE.Vector3(-cut.z, 0, cut.x);
  const at = new THREE.Vector3(c.x, .8, c.z);

    across.clone().multiplyScalar(side * (2 + rnd())).addScaledVector(cut, 1.2).setY(5.5 + rnd() * 1.5), {size:walk ? .6 : 1, half:!!G.CROPS[crop], spin:side * 10});

// goods pop out of a building's door one after another
function machineDrop(bid, items) {
  const B = buildings[bid]; if (!B || !B.g) return;
  const door = B.g.position.clone().add(new THREE.Vector3(0, 1, 1.7));
  items.slice(0, 6).forEach((id, n) => spawnDrop(door, itemMat(id), new THREE.Vector3((rnd() - .5) * 2.4, 5 + rnd() * 1.5, 2.2 + rnd() * 1.4), {delay:n * .14, size:walk ? .5 : .8}));

// ---------- bait and herding ----------
// Throw a handful of feed (walk mode button, or press and hold on the grass): hungry and greedy animals race over to eat it.
// Penned animals can't get out, so they crowd the fence nearest the snack and beg. While you walk around,
// timid animals move out of your way (so you can herd them into a corner), curious ones come to have a look,
// and the dog trots along behind you.
const baits = [];
let baitAt = 0;
const baitMat = emojiMat("🌾");
function throwBait() {
  if (!walk || clockT - baitAt < 1.2) return; baitAt = clockT;
  const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw), y = groundY(walk.pos.x, walk.pos.y) + EYE - .35;
  const v = new THREE.Vector3(fx, 0, fz).multiplyScalar(6.5).setY(3.2 + Math.sin(walk.pitch) * 5);
  spawnDrop(new THREE.Vector3(walk.pos.x + fx * .6, y, walk.pos.y + fz * .6), baitMat.clone(), v, {size:.45, kind:"bait", onLand:(d) => { layBait(d.s.position.x, d.s.position.z); d.gone = true; }});
  G.sfx("throw");
}
function dropBaitAt(x, z) { // from the farm view: it falls from above
  spawnDrop(new THREE.Vector3(x, 5, z), baitMat.clone(), new THREE.Vector3(0, -2, 0), {size:.45, kind:"bait", onLand:(d) => { layBait(d.s.position.x, d.s.position.z); d.gone = true; }});
  G.sfx("throw");
}

  const pile = new THREE.Sprite(baitMat.clone()); pile.scale.setScalar(.5); pile.position.set(x, groundY(x, z) + .2, z); scene.add(pile);
  const b = {x, z, v:new THREE.Vector2(x, z), until:clockT + 18, pile, bites:0};
  baits.push(b); bits(pile.position, "rgba(235,205,120,.95)", 6, 2.5);
  for (const a of animals) {
    if (a.act === "sleeping") continue;
    const d = a.pos.distanceTo(b.v); if (d > 18) continue;
    const keen = .25 + a.P.hunger * .5 + a.need.hunger * .5; if (rnd() > keen) continue;
    const reach = a.pen ? inPen(a.pen, x, z, -.2) : !PEN_LIST.some(p => inPen(p, x, z)), ang = rnd() * Math.PI * 2, r = .6 + rnd() * .5;
    a.bait = b; a.until = 0; a.path = null; a.emote(a.P.hunger > .8 ? "🤩" : "😋", 1.4);
    a.go(x + Math.cos(ang) * r, z + Math.sin(ang) * r, a.P.hunger > .8 || d > 7, reach ? "Racing to the snack" : "Wants that snack!", "bait");
  }
}
function updateBaits() {
  for (let k = baits.length - 1; k >= 0; k--) { const b = baits[k];
    if (clockT > b.until || b.bites > 10) { scene.remove(b.pile); b.pile.material.dispose(); baits.splice(k, 1); continue; }
    b.pile.scale.setScalar(.5 * Math.max(.35, 1 - b.bites / 12)); }
}
// what an animal does about you while you walk around (checked a few times a second)
function sensePlayer(a, t) {
  if (!walk || a.act === "sleeping" || t < (a.senseAt || 0)) return; a.senseAt = t + .25;
  const pp = walk.pos, d = a.pos.distanceTo(pp), P = a.P;
  if (a.kind === "dog") { // follows you around, a couple of steps behind
    if (d > 3.4 && d < 30 && !(a.doing === "follow" && a.target)) { const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw);
      a.go(pp.x - fx * 1.8 + (rnd() - .5), pp.y - fz * 1.8 + (rnd() - .5), d > 7, "Following you", "follow"); }
    return;
  }
  if (a.kind === "cat") return; // cats do what cats want
  if (a.doing === "bait" && d > 1.3) return; // busy with the snack
  const nerve = 2.1 + (1 - P.brave) * 2.8; // how close you can get
  if (d < nerve && a.act !== "fleeing" && !(P.curious >= .9 && d > 1.4)) { a.flee(pp, P.brave < .3 ? "Scared of you!" : "Moving out of your way"); return; }

    a.lookedAt = t + 9; const q = a.pos.lerp(pp, 1 - (nerve + .4) / d); a.emote("👀", 1.6); a.go(q.x, q.y, false, "Coming to see you", "look");

// ---------- the view that game.js talks to ----------
function keyPos(key) {

  if (type === "animal") { const an = animals.find(x => x.ref.type === "pen" && x.ref.kind === a && x.ref.i === +b); return an && an.g.position.clone().setY(an.S.h + .3); }
  if (type === "pet") { const an = animals.find(x => x.ref.type === "pet" && x.ref.j === +a); return an && an.g.position.clone().setY(an.S.h + .3); }
  if (type === "building") return new THREE.Vector3(BUILD_SPOT[a][0], 3.2, BUILD_SPOT[a][1]);
  if (type === "board") return board.position.clone().setY(2.8);
  if (type === "gift") return gift.position.clone().setY(1);
  if (type === "stand") return stall.position.clone().setY(2);
  if (type === "decor") { const d = GS().decor.placed[+a]; return d && new THREE.Vector3(d.x, 1.2, d.z); }

    return null;

}
setInterval(() => { syncStand(); syncPenSigns(); refreshInfo(); if (GS().level !== syncBuildings.lvl) { syncBuildings.lvl = GS().level; syncBuildings(); syncPlots(); } }, 1000);
setInterval(() => { GV.applyWeather(); syncHoliday(); }, 60000);

bootStep("loading your farm");
// ---------------- start the game ----------------
G.ART_PATH.p = ART;
if (qs.has("shot") && !qs.has("loud")) G.opts.quiet = true;
const started = G.start();
if (qs.has("shot") && !qs.has("loud")) { G.close(); for (const id of ["hint", "tut", "pointer"]) document.getElementById(id).hidden = true; }

  if (!S.pets.length) S.pets.push({kind:"dog", name:"Buddy", love:80, loveAt:Date.now(), petAt:0, playAt:0, treatAt:0, giftAt:0}, {kind:"cat", name:"Whiskers", love:60, loveAt:Date.now(), petAt:0, playAt:0, treatAt:0, giftAt:Date.now()});
  for (const b of ["bakery", "dairy", "kitchen"]) S.buildings[b].owned = true;
  S.buildings.feedmill.jobs = [{r:"chicken_feed", end:Date.now() - 1, dur:30000}]; S.buildings.bakery.jobs = [{r:"bread", end:Date.now() + 50000, dur:60000}];
  while (S.plots.length < 9) S.plots.push({crop:null, end:0});
  [["wheat", 1], ["corn", 1], ["tomato", .7], ["pumpkin", 1], ["strawberry", 1], ["sugarcane", .4], ["carrot", .9], ["wheat", .5], [null]].forEach(([c, g], i) => {
    S.plots[i].crop = c; S.plots[i].end = c ? Date.now() + (1 - g) * G.CROPS[c].time * 1000 : 0; });
  S.decor.placed = [{id:"fountain", x:-3.6, z:2.4}, {id:"tulips", x:-5.4, z:9.2}, {id:"pine", x:17, z:4}, {id:"bench", x:-3.4, z:14.5}];
  S.stand.list = [{id:"egg", qty:2, price:24, sellAt:Date.now() + 60000}, {id:"bread", qty:1, price:14, sellAt:Date.now() - 1}, null, null];
}
bootStep("putting your farm in place");
GV.refresh("all");
for (const [x, z, hw, hd] of BLOCKS.slice(OBST_BLOCKS)) OBST.push({x, z, hw, hd, c:1, s:0});
if (qs.has("farmdemo")) [["wheat", 1], ["corn", 1], ["tomato", .7], ["pumpkin", 1], ["strawberry", 1], ["sugarcane", .4]].forEach(([c, g], i) => {
  G.S.plots[i].crop = c; G.S.plots[i].end = Date.now() + (1 - g) * G.CROPS[c].time * 1000; buildPlants(i); });
updatePlots(0);
bootStep("setting the weather and time of day");
setPreset(qs.get("preset") || G.lookNow());
syncHoliday();
if (qs.has("tx")) { cam.target.x = view.target.x = +qs.get("tx"); cam.target.z = view.target.z = +qs.get("tz"); }
Object.defineProperty(window, "__herd", {get:() => animals});
if (qs.has("debug")) window.__dbg = {barn, cam, view, squishing, camera, updateSquish, placeCamera, setPreset, inPen, PEN_LIST, clock:() => clockT, setClock:(t) => { clockT = t; }, G, plots, plotAt, ready, hitAt, keyPos, board, stall, gift, buildings, get moving() { return moving; }, get farmDrag() { return farmDrag; }, get armed() { return armed; }, decorObjs,
  get walk() { return walk; }, get editMode() { return editMode; }, BLOCKS, BUILD_SPOT, TREES, grid, sun, ground, M, tiltH, get QUALITY() { return QUALITY; }, renderer, scene, drops, baits, throwBait, dropBaitAt};
// snapshots skip ahead a little so the animals have spread out and are busy
if (qs.has("shot")) { const R0 = +(qs.get("sim") || 40); for (let k = 0; k < R0 * 10; k++) { clockT += .1; for (const a of animals) a.update(.1, clockT); }
  if (qs.get("card")) { const a = animals[+qs.get("card")]; if (a) openInfo({type:a.ref.type === "pen" ? "animal" : "pet", an:a}); } }
{ // hide the loading screen once the textures are in
  const L = document.getElementById("loading"); const hide = () => { L.style.opacity = 0; setTimeout(() => L.remove(), 700); };
  if (texturesReady) hide(); else { THREE.DefaultLoadingManager.onLoad = () => { texturesReady = true; hide(); }; setTimeout(hide, 6000); } }

// ---------------- animation ----------------
const clock = new THREE.Timer(); let shotFrames = 0;
frame.drawn = 0;
function frame() {
  if (QUALITY.fps30) { const tn = performance.now(); if (tn - (frame.lastDraw || 0) < 31) { requestAnimationFrame(frame); return; } frame.lastDraw = tn; }
  clock.update(); const t = clock.getElapsed(); windU.uTime.value = t; skyU.uTime.value = t;
  // the animals live their lives
  const dt = Math.min(.1, t - (frame.lastT ?? t)); frame.lastT = t; clockT = t;
  if (walk) updateWalk(dt);
  placeCamera(dt); updateSquish(performance.now());
  updateDrops(dt); updateBaits(); drawTrail();
  if (shake > 0) { camera.position.x += (Math.random() - .5) * shake; camera.position.y += (Math.random() - .5) * shake; shake = Math.max(0, shake - dt * .5); }
  for (const a of animals) a.update(dt, t);
  updateGame(t, dt);
  // trees sway with the wind
  for (const b of bushes) b.rotation.y = Math.sin(t * 1.1 + b.position.x) * .02 * (1 + wind * 2);
  for (const tr of [tree, tree2, ...hills]) { const c = tr.userData.canopy; c.rotation.z = Math.sin(t * 1.3 + tr.position.x) * .025 * (1 + wind * 2); c.rotation.x = Math.sin(t * .9) * .015 * (1 + wind * 2); }
  if (rain.visible) { rain.position.y = -((t * 22) % 30); rain.position.x = camera.position.x * 0; }
  if (snow.visible) { snow.position.y = -((t * 1.6) % 30); snow.position.x = Math.sin(t * .4) * 1.5; }
  composer.render();
  if (!frame.okAt && ++frame.drawn >= 3) { frame.okAt = true; bootStep("ok"); }

}
// keep every buffer at the same pixel ratio: the renderer, the post-processing chain and the tilt-shift blur
function applySize() {

  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);

}
addEventListener("resize", applySize);
// graphics quality, from Settings: Auto watches the real frame time and, only if the phone can't hold ~45 fps, steps down one notch
// at a time (sharpness first, then shadow detail) and never steps back up, so it can't flicker. Best, Balanced and Battery saver are fixed.
const DPR = Math.min(devicePixelRatio, 2);
const autoSteps = () => [() => QUALITY.pr = Math.min(QUALITY.pr, 1.6), () => QUALITY.pr = Math.min(QUALITY.pr, 1.3),
  () => setShadow(1024), () => QUALITY.pr = Math.min(QUALITY.pr, 1)];
const QUALITY = {pr:DPR, steps:autoSteps(), auto:true, fps30:false};
function setShadow(n) { if (sun.shadow.mapSize.x !== n) { sun.shadow.mapSize.set(n, n); sun.shadow.map?.dispose(); sun.shadow.map = null; } }
let watching = false;
function watchFrames() {
  if (watching || qs.has("shot")) return; watching = true;
  let last = performance.now(), sum = 0, n = 0, since = last + 4000; // ignore the first seconds while shaders compile and textures load
  const watch = (now) => {
    const ft = now - last; last = now;
    if (now > since && ft < 250 && !document.hidden) { sum += ft; n++; }
    if (n >= 90) { if (sum / n > 22 && QUALITY.steps.length) { QUALITY.steps.shift()(); applySize(); since = now + 1500; } sum = 0; n = 0; }
    if (QUALITY.auto && QUALITY.steps.length) requestAnimationFrame(watch); else watching = false;
  };
  requestAnimationFrame(watch);
}
function setQuality(q) {

  QUALITY.auto = q === "auto"; QUALITY.fps30 = q === "battery";
  QUALITY.pr = q === "battery" ? Math.min(DPR, 1) : q === "balanced" ? Math.min(DPR, 1.5) : DPR;
  setShadow(q === "battery" ? 1024 : 2048);
  bloom.enabled = tiltH.enabled = tiltV.enabled = q !== "battery";
  QUALITY.steps = QUALITY.auto ? autoSteps() : [];
  applySize();
  if (QUALITY.auto) watchFrames();
}
bootStep("drawing the first picture");
setQuality(G.PREFS.quality || "auto");
frame();
if ("serviceWorker" in navigator && location.protocol === "https:" && !qs.has("shot")) navigator.serviceWorker.register("sw.js").catch(() => {});
if (qs.has("debug")) { window.__quality = () => [QUALITY.pr, renderer.getPixelRatio(), sun.shadow.mapSize.x, QUALITY.steps.length, renderer.domElement.width];
  window.__qstep = () => { QUALITY.steps.shift()(); applySize(); }; }
window.__ready = true;
