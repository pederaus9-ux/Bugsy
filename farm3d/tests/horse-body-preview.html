<!DOCTYPE html>
<meta charset="utf-8">
<canvas id="c"></canvas>
<script type="module">
import * as THREE from '../lib/three.module.min.js';
import {createHorse3D, updateHorse3D} from '../horse3d.js';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(1100, 620);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fbf6a);
scene.add(new THREE.HemisphereLight(0xfff6df, 0x4e7a32, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.25);
sun.position.set(-3, 6, 4); scene.add(sun);
const horse = createHorse3D(1.85, 0, 0);
for (let i = 0; i < 5; i++) updateHorse3D(horse, 0, 0, 1/60, 'idle');
horse.head.rotation.x = 0.55;
scene.add(horse.g);
const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 24), new THREE.MeshStandardMaterial({color:0x6ea34a}));
ground.rotation.x = -Math.PI/2; scene.add(ground);
const camera = new THREE.PerspectiveCamera(32, 1100/620, .1, 40);
camera.position.set(4.2, 1.15, 0.2);
camera.lookAt(0, 1.05, -0.35);
renderer.render(scene, camera);
window.__horse = {horse, camera, renderer, scene};
window.__ready = true;
</script>
