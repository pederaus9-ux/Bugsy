<!DOCTYPE html>
<meta charset="utf-8">
<title>Horse profile</title>
<style>html,body{margin:0;background:#87b34a}</style>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from '../lib/three.module.min.js';
import {createHorse3D, updateHorse3D} from '../horse3d.js';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(960, 540);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b34a);
scene.add(new THREE.HemisphereLight(0xfff4d2, 0x4d7a32, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(4, 8, 3); scene.add(sun);
const horse = createHorse3D(1.6, 0, 0);
scene.add(horse.g);
for (let i = 0; i < 20; i++) updateHorse3D(horse, 0, 0, 1/60, 'idle');
const camera = new THREE.PerspectiveCamera(35, 960/540, .1, 50);
camera.position.set(2.4, 1.15, -1.55);
camera.lookAt(0, 1.2, -.85);
renderer.render(scene, camera);
window.__horseReady = true;
</script>
