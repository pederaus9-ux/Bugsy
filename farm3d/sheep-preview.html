<!doctype html>
<meta charset="utf-8">
<title>Sheep preview</title>
<script type="module">
import * as THREE from './lib/three.module.min.js';
import {createSheep3D,updateSheep3D} from './sheep3d.js';
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc5d7ae);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,20);camera.position.set(1.6,.8,1.8);
scene.add(new THREE.DirectionalLight(0xffffff,1.2).translateX(2).translateY(3),new THREE.AmbientLight(0xffffff,.5));
const sheep=createSheep3D();scene.add(sheep.g);
let mode=new URLSearchParams(location.search).get('mode')||'idle',t=0;
addEventListener('keydown',e=>{if(e.key==='1')mode='idle';if(e.key==='2')mode='walk';if(e.key==='3')mode='run';});
function frame(){const speed=mode==='run'?.7:mode==='walk'?.35:0,dt=1/60;t+=dt;sheep.g.position.z-=speed*dt;updateSheep3D(sheep,0,-speed*dt,dt);camera.lookAt(0,.4,sheep.g.position.z);renderer.render(scene,camera);requestAnimationFrame(frame);}
frame();
</script>
