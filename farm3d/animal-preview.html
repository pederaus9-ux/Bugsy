<!doctype html>
<meta charset="utf-8">
<title>Animal modules preview</title>
<script type="module">
import * as THREE from './lib/three.module.min.js';
import {createHorse3D,updateHorse3D} from './horse3d.js';
import {createDog3D,updateDog3D} from './dog3d.js';
import {createCat3D,updateCat3D} from './cat3d.js';
import {createChicken3D,updateChicken3D} from './chicken3d.js';
import {createFarmer3D,updateFarmer3D} from './farmer3d.js';
const q=new URLSearchParams(location.search),kind=q.get('kind')||'horse',mode=q.get('mode')||'idle';
const makers={horse:[createHorse3D,updateHorse3D],dog:[createDog3D,updateDog3D],cat:[createCat3D,updateCat3D],chicken:[createChicken3D,updateChicken3D],farmer:[createFarmer3D,updateFarmer3D]};
const [create,update]=makers[kind];
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd7e4c8);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,30);camera.position.set(2.2,1.2,2.4);
scene.add(new THREE.AmbientLight(0xffffff,.6),new THREE.DirectionalLight(0xffffff,1));
const actor=create();scene.add(actor.g);
function frame(){const speed=mode==='run'?1.4:mode==='walk'?.6:0;actor.g.position.z-=speed/60;update(actor,0,-speed/60,1/60,mode);camera.lookAt(0,.5,actor.g.position.z);renderer.render(scene,camera);requestAnimationFrame(frame);}frame();
</script>
